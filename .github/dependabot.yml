version: 2
updates:
  # 1. NPM dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Los_Angeles'

    # Wait for new releases to settle before proposing them.
    cooldown:
      default-days: 3
      semver-major-days: 14

    open-pull-requests-limit: 5

    labels:
      - 'dependencies'

    # Conventional commits (commitlint)
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'

    # Held major versions. Remove an entry once the blocker below is resolved.
    ignore:
      # typescript 7 is the native (Go) port and ships no JavaScript compiler
      # API (require('typescript') only exports version fields). typescript-eslint
      # (peer range <6.1.0), ts-jest, next's type check and eslint-config-next
      # all load that API, so `pnpm run lint` and every jest suite fail to start.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

    # Groups are evaluated in order and the first match wins, so the specific
    # groups must stay above the catch-all groups.
    # NOTE: groups only apply to version updates. Security updates are not
    # grouped (applies-to: security-updates is intentionally not set) so each
    # security fix still arrives as its own PR.
    # Auto-merge is decided by .github/workflows/dependabot-automerge.yml from
    # the group name, not by labels. Only minor/patch groups are eligible.
    groups:
      framework:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - 'eslint-config-next'
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - 'minor'
          - 'patch'

      mui:
        patterns:
          - '@mui/*'
          - '@emotion/*'
        update-types:
          - 'minor'
          - 'patch'

      # 'playwright' must be grouped with @playwright/* so the two never drift
      # apart (a stale 'playwright' next to a newer @playwright/test broke CI).
      testing:
        patterns:
          - 'playwright'
          - 'playwright-core'
          - '@playwright/*'
          - '@testing-library/*'
          - 'jest*'
          - '@jest/*'
          - 'babel-jest'
          - '@types/jest'
          - '@axe-core/*'
        update-types:
          - 'minor'
          - 'patch'

      linting:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'prettier'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
        update-types:
          - 'minor'
          - 'patch'

      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
        update-types:
          - 'minor'
          - 'patch'

      # Everything else that is minor/patch
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

      # All major bumps in a single PR. Never auto-merged.
      major-updates:
        patterns:
          - '*'
        update-types:
          - 'major'

  # 2. GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'ci(deps)'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
