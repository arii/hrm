name: 'Setup Environment'
description: 'Checks out code, sets up Node.js, pnpm, and installs dependencies'
runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        clean: false

    - name: Sanitize Workspace (Preserve Cache)
      shell: bash
      run: |
        git reset --hard HEAD
        git clean -fdx --exclude .next --exclude node_modules --exclude .eslintcache --exclude .cache

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'pnpm'

    - name: Run Setup Script
      shell: bash
      run: |
        chmod +x ./scripts/setup.sh
        ./scripts/setup.sh
