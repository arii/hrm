name: 'Setup Environment'
description: 'Checks out code, sets up Node.js, pnpm, installs gh CLI, and installs dependencies'

inputs:
  ref:
    description: 'The branch, tag or SHA to checkout.'
    required: false
  fetch-depth:
    description: 'Number of commits to fetch. 0 for all history.'
    required: false
    default: '1'
  node-version:
    description: 'Version of Node.js to use.'
    required: false
    default: '20.x'

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        clean: false

    - name: Sanitize Workspace (Preserve Cache)
      shell: bash
      run: |
        # This step is crucial for self-hosted runners to prevent contamination
        # between workflow runs. It resets the git repository to a clean state
        # but preserves cached directories like node_modules and .next,
        # which significantly speeds up the build process.
        git reset --hard HEAD
        git clean -fdx --exclude .next --exclude node_modules --exclude .eslintcache --exclude .cache

    - name: Install GitHub CLI
      shell: bash
      run: |
        mkdir -p $HOME/.local/bin
        GH_VERSION=2.53.0
        curl -L https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz -o gh.tar.gz
        tar xvf gh.tar.gz
        mv gh_${GH_VERSION}_linux_amd64/bin/gh $HOME/.local/bin/
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Run Setup Script
      shell: bash
      run: |
        chmod +x ./scripts/setup.sh
        ./scripts/setup.sh
