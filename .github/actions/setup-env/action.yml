# .github/actions/setup-env/action.yml
name: 'Setup Environment'
description: 'Sets up Node.js and pnpm, installs dependencies and Playwright.'

inputs:
  use-build-cache:
    description: 'Whether to use build cache (.next/cache, dist)'
    default: 'false'
  cache-type:
    description: 'Type of cache (e.g., build, type-check)'
    default: 'build'
  cache-paths:
    description: 'Paths to cache'
    default: |
      .next_prod/cache
      dist
      *.tsbuildinfo

runs:
  using: 'composite'
  steps:
    - name: Install jq
      shell: bash
      run: |
        if ! command -v jq &> /dev/null; then
          echo "jq not found, installing..."
          sudo apt-get update && sudo apt-get install -y jq
        else
          echo "jq already installed: $(jq --version)"
        fi

    - name: 'Setup pnpm'
      uses: pnpm/action-setup@v4

    - name: 'Setup Node.js'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Cache Build Artifacts
      if: inputs.use-build-cache == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ inputs.cache-paths }}
        # Use github.sha in the key to ensure we save a new cache on every commit
        # while using restore-keys to fall back to previous commits.
        key: cache-${{ inputs.cache-type }}-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          cache-${{ inputs.cache-type }}-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.ref_name }}-
          cache-${{ inputs.cache-type }}-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-

    - name: Install GitHub CLI
      shell: bash
      run: |
        if ! command -v gh &> /dev/null; then
          echo "GitHub CLI not found, installing..."
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
          && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
          && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
          && sudo apt update \
          && sudo apt install gh -y
        else
          echo "GitHub CLI already installed: $(gh --version)"
        fi

    - name: 'Install Dependencies'
      shell: bash
      run: |
        pnpm install --frozen-lockfile

    - name: Cache Playwright
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: 'Install Playwright (Chromium)'
      shell: bash
      run: pnpm exec playwright install chromium

    - name: Configure Envs
      shell: bash
      run: |
        echo "NEXTAUTH_URL=http://127.0.0.1:3000" > .env.local
        echo "NEXTAUTH_SECRET=ci-secret-${{ env.SESSION_ID || github.run_id }}" >> .env.local

    - name: 'Run Setup Script'
      shell: bash
      env:
        SKIP_INSTALL: 'true'
      run: |
        chmod +x ./scripts/setup.sh
        ./scripts/setup.sh
