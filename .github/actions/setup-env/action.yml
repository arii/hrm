# .github/actions/setup-env/action.yml
name: 'Setup Environment'
description: 'Sets up Node.js and pnpm, installs dependencies and Playwright.'

runs:
  using: 'composite'
  steps:
    - name: Install jq
      shell: bash
      run: |
        if ! command -v jq &> /dev/null; then
          echo "jq not found, installing..."
          sudo apt-get update && sudo apt-get install -y jq
        else
          echo "jq already installed: $(jq --version)"
        fi

    - name: 'Setup pnpm'
      uses: pnpm/action-setup@v4

    - name: 'Setup Node.js'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install GitHub CLI
      shell: bash
      run: |
        if ! command -v gh &> /dev/null; then
          echo "GitHub CLI not found. Installing..."
          mkdir -p $HOME/.local/bin
          # Detect OS and Architecture
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          if [ "$ARCH" = "x86_64" ]; then
            ARCH="amd64"
          elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            ARCH="arm64"
          fi

          GH_VERSION=2.63.0
          URL="https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_${OS}_${ARCH}.tar.gz"

          echo "Downloading GitHub CLI from $URL"
          curl -fL -sS "$URL" -o gh.tar.gz

          # Verify it is a gzip file before tarring
          if ! file gh.tar.gz | grep -q "gzip compressed data"; then
            echo "Error: Downloaded file is not a valid gzip archive."
            head -n 20 gh.tar.gz
            exit 1
          fi

          tar xvf gh.tar.gz

          # Move binary to local bin
          mv "gh_${GH_VERSION}_${OS}_${ARCH}/bin/gh" "$HOME/.local/bin/"
          # Add to PATH for this and future steps
          echo "$HOME/.local/bin" >> $GITHUB_PATH
        else
          echo "GitHub CLI is already installed."
          gh --version
        fi

    - name: 'Install Dependencies'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Cache Playwright
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: 'Install Playwright (Chromium)'
      shell: bash
      run: pnpm exec playwright install chromium

    - name: Configure Envs
      shell: bash
      run: |
        echo "NEXTAUTH_URL=http://127.0.0.1:3000" > .env.local
        echo "NEXTAUTH_SECRET=ci-secret-${{ env.SESSION_ID || github.run_id }}" >> .env.local

    - name: 'Run Setup Script'
      shell: bash
      run: |
        chmod +x ./scripts/setup.sh
        ./scripts/setup.sh
