# .github/actions/setup-env/action.yml
name: 'Setup Environment'
description: 'Sets up Node.js and pnpm, installs dependencies and Playwright.'

inputs:
  use-build-cache:
    description: 'Whether to use build cache (.next/cache, dist)'
    default: 'false'
  cache-type:
    description: 'Type of cache (e.g., build, type-check)'
    default: 'build'
  cache-paths:
    description: 'Paths to cache'
    default: |
      .next_prod/cache
      dist
      *.tsbuildinfo

runs:
  using: 'composite'
  steps:
    - name: Install jq
      shell: bash
      run: |
        if ! command -v jq &> /dev/null; then
          echo "jq not found, installing..."
          sudo apt-get update && sudo apt-get install -y jq
        else
          echo "jq already installed: $(jq --version)"
        fi

    - name: 'Setup pnpm'
      uses: pnpm/action-setup@v4
      with:
        version: 9.15.9

    - name: 'Setup Node.js'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Cache Build Artifacts
      if: inputs.use-build-cache == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ inputs.cache-paths }}
        # Use github.sha in the key to ensure we save a new cache on every commit
        # while using restore-keys to fall back to previous commits.
        key: cache-${{ inputs.cache-type }}-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          cache-${{ inputs.cache-type }}-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.ref_name }}-
          cache-${{ inputs.cache-type }}-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-

    - name: 'Install Dependencies'
      shell: bash
      run: |
        # Retry logic for pnpm install to handle transient 403 Forbidden errors
        MAX_RETRIES=3
        RETRY_DELAY=10
        n=0
        until [ "$n" -ge "$MAX_RETRIES" ]
        do
           echo "Attempting pnpm install (Attempt $((n+1))/$MAX_RETRIES)..."
           pnpm install --frozen-lockfile && break
           n=$((n+1))
           if [ "$n" -lt "$MAX_RETRIES" ]; then
             echo "pnpm install failed, retrying in ${RETRY_DELAY}s..."
             sleep "$RETRY_DELAY"
           fi
        done
        if [ "$n" -ge "$MAX_RETRIES" ]; then
          echo "❌ pnpm install failed after $MAX_RETRIES attempts"
          exit 1
        fi

    - name: Cache Playwright
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: 'Install Playwright (Chromium)'
      shell: bash
      run: pnpm exec playwright install chromium

    - name: Configure Envs
      shell: bash
      run: |
        echo "NEXTAUTH_URL=http://127.0.0.1:3000" > .env.local
        echo "NEXTAUTH_SECRET=ci-secret-${{ env.SESSION_ID || github.run_id }}" >> .env.local

    - name: 'Run Setup Script'
      shell: bash
      env:
        SKIP_INSTALL: 'true'
      run: |
        chmod +x ./scripts/setup.sh
        ./scripts/setup.sh
