name: 'GH PR Wait Checks'
description: 'Waits for PR checks to complete'
inputs:
  pr_number:
    description: 'PR number'
    required: true
  timeout:
    description: 'Timeout in seconds'
    required: false
    default: '300'
  github_token:
    description: 'GitHub token for authentication'
    required: true
runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        set -e
        timeout ${{ inputs.timeout }} gh pr checks ${{ inputs.pr_number }} --watch
