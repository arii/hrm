name: 'Sanitize String'
description: 'Sanitizes a string for safe use in file paths, environment variables, and keys.'
inputs:
  value:
    description: 'The raw string to sanitize.'
    required: true
  max-length:
    description: 'The maximum allowed length for the string.'
    required: false
    default: '64'
outputs:
  sanitized-value:
    description: 'The sanitized and truncated string.'
    value: ${{ steps.sanitize.outputs.result }}
runs:
  using: "composite"
  steps:
    - id: validate-input
      shell: bash
      run: |
        if ! [[ "${{ inputs.max-length }}" =~ ^[0-9]+$ ]] || [ "${{ inputs.max-length }}" -le 0 ]; then
          echo "::error::Input 'max-length' must be a positive integer."
          exit 1
        fi

    - id: sanitize
      shell: bash
      env:
        RAW: ${{ inputs.value }}
        LEN: ${{ inputs.max-length }}
      run: |
        # 1. Strip newlines (tr -d '\n') to protect GITHUB_OUTPUT
        # 2. Replace invalid chars with hyphen
        # 3. Squeeze repeating hyphens (tr -s '-')
        # 4. Truncate
        CLEAN=$(echo "$RAW" | tr -d '\n' | sed 's/[^a-zA-Z0-9_-]/-/g' | tr -s '-' | cut -c1-"$LEN")

        # Remove trailing hyphens if any (optional but clean)
        CLEAN=${CLEAN%-}
        echo "result=$CLEAN" >> "$GITHUB_OUTPUT"
