name: 'Sanitize String'
description: 'Sanitizes a string for safe use in file paths, environment variables, and keys.'
inputs:
  value:
    description: 'The raw string to sanitize.'
    required: true
  max-length:
    description: 'The maximum allowed length for the string.'
    required: false
    default: '64'
outputs:
  sanitized-value:
    description: 'The sanitized and truncated string.'
    value: ${{ steps.sanitize.outputs.result }}
runs:
  using: "composite"
  steps:
    - id: validate-input
      shell: bash
      run: |
        if ! [[ "${{ inputs.max-length }}" =~ ^[0-9]+$ ]] || [ "${{ inputs.max-length }}" -le 0 ]; then
          echo "::error::Input 'max-length' must be a positive integer."
          exit 1
        fi

    - id: sanitize
      shell: bash
      env:
        RAW: ${{ inputs.value }}
        LEN: ${{ inputs.max-length }}
      run: |
        # Detailed Sanitization Steps:
        # 1. `tr -d '\n'`: Removes any newline characters. This is a critical safety measure to
        #    prevent multi-line inputs from breaking the key=value format of GITHUB_OUTPUT.
        # 2. `sed 's/[^a-zA-Z0-9_-]/-/g'`: Replaces any character that is NOT an alphanumeric,
        #    underscore, or hyphen with a hyphen. This is the core sanitization step.
        # 3. `tr -s '-'`: Squeezes (compresses) any sequence of one or more hyphens into a single
        #    hyphen. This prevents inputs like `feature//branch` from becoming `feature--branch`.
        # 4. `cut -c1-"$LEN"`: Truncates the string to the maximum allowed length specified by the
        #    `max-length` input.
        CLEAN=$(echo "$RAW" | tr -d '\n' | sed 's/[^a-zA-Z0-9_-]/-/g' | tr -s '-' | cut -c1-"$LEN")

        # 5. `${CLEAN%-}`: This is a shell parameter expansion that removes a trailing hyphen `-`
        #    from the end of the string, if one exists. This cleans up the output, for example,
        #    transforming `my-branch-` into `my-branch`.
        CLEAN=${CLEAN%-}

        echo "result=$CLEAN" >> "$GITHUB_OUTPUT"
