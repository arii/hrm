name: 'Check for Changes'
description: 'Checks for file changes against a specified base branch'
inputs:
  base_branch:
    description: 'The base branch to compare against'
    required: true
outputs:
  has_changes:
    description: "Boolean indicating if changes were found"
runs:
  using: "composite"
  steps:
    - name: Fetch base branch
      shell: bash
      run: git fetch origin ${{ inputs.base_branch }} --depth=1
    - name: Check for file changes
      id: check_files
      shell: bash
      run: |
        if git diff --quiet origin/${{ inputs.base_branch }} HEAD; then
          echo "No changes detected."
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          echo "Changes detected."
          echo "has_changes=true" >> $GITHUB_OUTPUT
        fi
