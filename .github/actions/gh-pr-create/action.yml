name: 'GH PR Create'
description: 'Creates a Pull Request using GitHub CLI'
inputs:
  title:
    description: 'PR title'
    required: true
  body:
    description: 'PR body text'
    required: false
  body_file:
    description: 'Path to a file containing the PR body'
    required: false
  base:
    description: 'Base branch'
    required: true
  head:
    description: 'Head branch'
    required: true
  github_token:
    description: 'GitHub token for authentication'
    required: true
outputs:
  pr_number:
    description: 'The number of the created PR'
    value: ${{ steps.create.outputs.pr_number }}
  pr_url:
    description: 'The URL of the created PR'
    value: ${{ steps.create.outputs.pr_url }}
runs:
  using: 'composite'
  steps:
    - id: create
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        TITLE: ${{ inputs.title }}
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        BODY: ${{ inputs.body }}
        BODY_FILE: ${{ inputs.body_file }}
      run: |
        set -e
        # Construct arguments array safely
        ARGS=("--title" "$TITLE" "--base" "$BASE" "--head" "$HEAD" "--json" "url,number")

        if [ -n "$BODY_FILE" ]; then
          ARGS+=("--body-file" "$BODY_FILE")
        elif [ -n "$BODY" ]; then
          ARGS+=("--body" "$BODY")
        else
          ARGS+=("--body" "")
        fi

        # Execute gh pr create and capture JSON output
        JSON_OUTPUT=$(gh pr create "${ARGS[@]}")

        # Parse JSON output using jq (standard on GitHub runners)
        PR_URL=$(echo "$JSON_OUTPUT" | jq -r '.url')
        PR_NUMBER=$(echo "$JSON_OUTPUT" | jq -r '.number')

        echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
        echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
