name: PR Quality Gate

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check'
        required: true
        default: 'leader'
      pr_number:
        description: 'PR number to post comments to (optional)'
        required: false
        type: string
  
  workflow_call:
    inputs:
      branch:
        description: 'Branch to check'
        required: false
        type: string
        default: 'leader'
      pr_number:
        description: 'PR number to post comments to (optional)'
        required: false
        type: string

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  prepare-env:
    name: 📝 Prepare Environment
    runs-on: ubuntu-latest
    outputs:
      session_id: ${{ steps.sanitize_id.outputs.sanitized-value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanitize SESSION_ID
        id: sanitize_id
        uses: ./.github/actions/sanitize-string
        with:
          value: ${{ github.event.pull_request.number || github.ref_name || github.run_id }}

  test-actions:
    name: ⚙️ Test Composite Actions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "Special Chars and Truncation"
            value: 'feature/test-branch/with_special-chars!@#$%^&*()'
            max-length: '30'
            expected: 'feature-test-branch-with_speci'
          - name: "Empty String"
            value: ''
            max-length: '64'
            expected: ''
          - name: "Already Sanitized"
            value: 'clean-string-123'
            max-length: '64'
            expected: 'clean-string-123'
          - name: "Shorter than Max Length with special chars"
            value: 'short/string'
            max-length: '64'
            expected: 'short-string'
          - name: "Duplicate Hyphens"
            value: 'feature//branch'
            max-length: '64'
            expected: 'feature-branch'
          - name: "Trailing Hyphen"
            value: 'feature/branch-'
            max-length: '64'
            expected: 'feature-branch'
          - name: "At Max Length"
            value: 'a-very-long-string-that-is-exactly-64-characters-long-and-valid'
            max-length: '64'
            expected: 'a-very-long-string-that-is-exactly-64-characters-long-and-valid'
          - name: "Only Invalid Chars"
            value: '!@#$%^&*()'
            max-length: '64'
            expected: ''
          - name: "Leading and Trailing Invalid Chars"
            value: '!!test-branch!!'
            max-length: '64'
            expected: 'test-branch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sanitize String (Test Case - ${{ matrix.name }})
        id: sanitize_step
        uses: ./.github/actions/sanitize-string
        with:
          value: ${{ matrix.value }}
          max-length: ${{ matrix.max-length }}

      - name: Verify (Test Case - ${{ matrix.name }})
        run: |
          actual="${{ steps.sanitize_step.outputs.sanitized-value }}"
          expected="${{ matrix.expected }}"
          if [ "$actual" != "$expected" ]; then
            echo "Test Case Failed: ${{ matrix.name }}"
            echo "Expected: '$expected'"
            echo "Actual:   '$actual'"
            exit 1
          fi
          echo "✅ Test Case Passed: ${{ matrix.name }}"

  quality-check:
    name: 🛡️ Quality Check
    needs: [prepare-env, test-actions]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SESSION_ID: ${{ needs.prepare-env.outputs.session_id }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Environment
        id: setup
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./scripts/setup.sh
          ./scripts/setup.sh 2>&1 | tee setup-output.log
        continue-on-error: true

      - name: Upload Setup Report
        if: steps.setup.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: setup-report
          path: setup-output.log
          retention-days: 3

      - name: Run Knip
        id: knip
        shell: bash
        run: |
          set -o pipefail
          pnpm run knip 2>&1 | tee knip-output.txt
        continue-on-error: true

      - name: Upload Knip Report
        if: always() && steps.knip.outcome == 'failure' && hashFiles('knip-output.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: knip-report
          path: knip-output.txt
          retention-days: 3

      - name: Lint Code
        id: lint
        shell: bash
        run: |
          set -o pipefail
          pnpm run lint 2>&1 | tee lint-output.log
        continue-on-error: true

      - name: Upload Lint Report
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-output.log
          retention-days: 3

      - name: Fail on Lint Errors
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Verify Build
        id: build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: build-verification-secret-do-not-use-in-production
        shell: bash
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee build-output.log

      - name: Upload Build Report
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-output.log
          retention-days: 3

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          include-hidden-files: true
          path: |
            dist/
            .next/
          retention-days: 1

  core-tests:
    name: 🧪 Core Logic
    needs: [prepare-env, quality-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SESSION_ID: ${{ needs.prepare-env.outputs.session_id }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
          merge-multiple: true

      - name: Run Infra Tests
        id: infra-tests
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: build-verification-secret-do-not-use-in-production
        shell: bash
        run: |
          set -o pipefail
          pnpm run test:infra 2>&1 | tee infra-tests.log
        continue-on-error: true

      - name: Run Unit Tests
        id: unit-tests
        shell: bash
        run: |
          set -o pipefail
          pnpm run test:unit 2>&1 | tee unit-tests.log
        continue-on-error: true

      - name: Upload Test Reports
        if: always() && (steps.infra-tests.outcome == 'failure' || steps.unit-tests.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            infra-tests.log
            unit-tests.log
          retention-days: 3

  visual-tests:
    name: 🎨 Visual Regression
    needs: [prepare-env, quality-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SESSION_ID: ${{ needs.prepare-env.outputs.session_id }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
          merge-multiple: true

      - name: Run Visual Tests
        id: visual-tests
        shell: bash
        run: |
          set -o pipefail
          pnpm run test:json 2>&1 | tee visual-tests.log
          python3 scripts/analyze-playwright-report.py playwright-report.json
        continue-on-error: true

      - name: Upload Visual Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-logs
          path: visual-tests.log
          retention-days: 3

      - name: Upload Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual-${{ env.SESSION_ID }}
          path: playwright-report/
          retention-days: 5

      - name: Cache Cleanup - Prune if Over 7GB
        if: always()
        shell: bash
        run: |
          CACHE_DIR="${{ github.workspace }}/.cache/ms-playwright"
          if [ -d "$CACHE_DIR" ]; then
            CACHE_SIZE=$(du -sh "$CACHE_DIR" | cut -f1)
            CACHE_SIZE_BYTES=$(du -sb "$CACHE_DIR" | cut -f1)
            SEVEN_GB=$((7 * 1024 * 1024 * 1024))

            echo "📊 Playwright cache size: $CACHE_SIZE"

            if [ "$CACHE_SIZE_BYTES" -gt "$SEVEN_GB" ]; then
              echo "⚠️ Cache exceeds 7GB threshold ($((CACHE_SIZE_BYTES / 1024 / 1024 / 1024))GB), pruning..."

              echo "Cache structure before cleanup:"
              du -sh "$CACHE_DIR"/* 2>/dev/null | sort -rh | head -10

              echo "Removing older browser versions..."
              find "$CACHE_DIR" -type d -name "chromium-*" | sort -V | head -n -1 | while read dir; do
                DIR_SIZE=$(du -sh "$dir" | cut -f1)
                echo "  Removing $dir (${DIR_SIZE})"
                rm -rf "$dir"
              done

              CACHE_SIZE_BYTES=$(du -sb "$CACHE_DIR" | cut -f1)
              if [ "$CACHE_SIZE_BYTES" -gt "$SEVEN_GB" ]; then
                echo "Still over 7GB after version cleanup, removing entire cache..."
                rm -rf "$CACHE_DIR"
              fi

              FINAL_SIZE=$(du -sh "$CACHE_DIR" 2>/dev/null | cut -f1)
              echo "✅ Cache pruned. Final size: ${FINAL_SIZE:-0MB} (under 7GB limit)"
            else
              echo "✅ Cache within limits (under 7GB)"
            fi
          fi

  quality-report:
    name: 📊 Quality Report
    if: always()
    needs: [prepare-env, quality-check, core-tests, visual-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Test Logs
        uses: actions/download-artifact@v4
        with:
          pattern: '*-logs'
          path: logs
          merge-multiple: true

      - name: Download Lint Report
        uses: actions/download-artifact@v4
        with:
          name: lint-report
          path: logs
        continue-on-error: true

      - name: Download Knip Report
        uses: actions/download-artifact@v4
        with:
          name: knip-report
          path: logs
        continue-on-error: true

      - name: Download Build Report
        uses: actions/download-artifact@v4
        with:
          name: build-report
          path: logs
        continue-on-error: true

      - name: Download Setup Report
        uses: actions/download-artifact@v4
        with:
          name: setup-report
          path: logs
        continue-on-error: true

      - name: Download Core Test Reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: logs
        continue-on-error: true

      - name: Report Failure to Jules
        if: needs.quality-check.result == 'failure' || needs.core-tests.result == 'failure' || needs.visual-tests.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.ARI_PAT }}
          # Pass all test outcomes to the script as env vars for easier access
          QUALITY_CHECK_OUTCOME: ${{ needs.quality-check.result }}
          CORE_TESTS_OUTCOME: ${{ needs.core-tests.result }}
          VISUAL_TESTS_OUTCOME: ${{ needs.visual-tests.result }}
          LOG_TRUNCATE_BYTES: 20000
        run: |
          set +e  # Disable exit on error to continue reporting even if commands fail

          # Cap the log truncation size to prevent excessively large comments
          if [ -z "$LOG_TRUNCATE_BYTES" ] || ! [[ "$LOG_TRUNCATE_BYTES" =~ ^[0-9]+$ ]]; then
             LOG_TRUNCATE_BYTES=20000
          fi
          if [ "$LOG_TRUNCATE_BYTES" -gt 50000 ]; then
             LOG_TRUNCATE_BYTES=50000
          fi

          # 1. SETUP: Find PR number and define checks
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
            PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number')
          fi

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
            echo "::warning::No Pull Request found for this branch. Skipping comment."
            exit 0
          fi

          COMMENT_FILE="test-results/pr-comment.md"
          mkdir -p test-results

          # Define checks in a readable, maintainable format.
          # Each line: <OUTCOME_VAR_NAME>|<Display Name>|<primary_log_file>
          read -r -d '' CHECKS_DEFINITION <<'EOF'
          QUALITY_CHECK_OUTCOME|Quality Check|logs/lint-output.log;logs/build-output.log;logs/knip-output.txt;logs/setup-output.log
          CORE_TESTS_OUTCOME|Core Tests|logs/infra-tests.log;logs/unit-tests.log
          VISUAL_TESTS_OUTCOME|Visual Tests|logs/visual-tests.log
          EOF

          # 2. AGGREGATION: Loop through checks to find failures and collect logs
          FAILED_CHECKS_LIST=""
          LOGS_BODY=""

          # Helper function to append a log file's content to the comment body
          append_log_to_body() {
            local log_file="$1"
            local test_name="$2"
            if [ -f "$log_file" ]; then
              LOGS_BODY="${LOGS_BODY}\n### ${test_name} Log (${log_file##*/})\n" # Add filename to header
              LOGS_BODY="${LOGS_BODY}\`\`\`\n"
              # Append truncated, color-code-stripped log content
              LOGS_BODY="${LOGS_BODY}$(tail -c "${{ env.LOG_TRUNCATE_BYTES }}" "$log_file" | sed -r 's/\x1b\[[0-9;]*m//g')\n"
              LOGS_BODY="${LOGS_BODY}\`\`\`\n"
            else
              LOGS_BODY="${LOGS_BODY}\n### ${test_name} Log\n_Log file not found: ${log_file}_\n"
            fi
          }

          while IFS='|' read -r outcome_var display_name log_files; do
            # Use indirect expansion to get the outcome value (e.g., $QUALITY_CHECK_OUTCOME)
            if [ "${!outcome_var}" == "failure" ]; then
              # Add to the comma-separated list of failed checks
              if [ -z "$FAILED_CHECKS_LIST" ]; then
                FAILED_CHECKS_LIST="$display_name"
              else
                FAILED_CHECKS_LIST="$FAILED_CHECKS_LIST, $display_name"
              fi

              # Append the primary log files for this check
              for log_file in $(echo "$log_files" | tr ';' ' '); do
                append_log_to_body "$log_file" "$display_name"
              done
            fi
          done <<< "$CHECKS_DEFINITION"


          # 3. REPORTING: If any checks failed, construct and post the comment
          if [ -n "$FAILED_CHECKS_LIST" ]; then
            # Construct the final comment body
            COMMENT_HEADER="@jules fix: CI checks failed: ${FAILED_CHECKS_LIST}. Review requested.\n\n"
            # Add a notice about truncated logs and a link to the full logs
            LOG_FOOTER="---\n*Note: Logs are truncated. View the [full workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.*"
            COMMENT_DETAILS="<details><summary><strong>Failed Test Report Log</strong></summary>${LOGS_BODY}\n${LOG_FOOTER}\n</details>"
            # Write to file
            echo -e "${COMMENT_HEADER}${COMMENT_DETAILS}" > "$COMMENT_FILE"

            # Post the comment to the PR, with error handling
            if ! gh pr comment "$PR_NUMBER" --body-file "$COMMENT_FILE"; then
              echo "::error::Failed to post comment to PR. The GitHub token may have expired or lack permissions."
            fi
          else
            echo "::warning::Job failed, but no specific test outcome was 'failure'. A step may have failed unexpectedly."
          fi
