name: PR Quality Gate

on:
  # pull_request:
  #   branches: [ "leader" ]
  # NOTE: PR quality checks are now handled by gemini-orchestrator.yml
  # which calls pr-quality-standalone.yml as a reusable workflow
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check'
        required: true
        default: 'leader'

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1
  # Browsers are installed INSIDE the workspace so they persist with clean: false
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
  # Unique session identifier for concurrent runs
  SESSION_ID: ${{ github.event.pull_request.number || github.ref_name || github.run_id }}

jobs:
  # ===========================================================================
  # JOB 1: INFRASTRUCTURE SETUP (The "Clean Slate")
  # Wipes workspace, installs deps, and prepares the environment for all jobs.
  # ===========================================================================
  infra-setup:
    name: 🏗️ Infra Setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0
          clean: true # 🧹 Wipes previous run artifacts to ensure a fresh start

      # --- GLOBAL PERSISTENCE CONFIG ---
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Configure Persistent Store
        shell: bash
        run: |
          mkdir -p ~/.local/share/pnpm/store
          # Use session-specific cache directories to prevent conflicts
          mkdir -p ~/.cache/pnpm-${{ env.SESSION_ID }}
          pnpm config set store-dir ~/.local/share/pnpm/store
          pnpm config set cache-dir ~/.cache/pnpm-${{ env.SESSION_ID }}
          pnpm config set side-effects-cache true

      - name: Create Runtime Envs
        run: |
          mkdir -p logs
          echo "NEXTAUTH_URL=http://127.0.0.1:3000" > .env.local
          echo "NEXTAUTH_SECRET=ci-secret-${{ env.SESSION_ID }}" >> .env.local

      - name: Run Setup Script
        run: |
          chmod +x ./scripts/setup.sh
          ./scripts/setup.sh
        # This installs dependencies into ./node_modules

      - name: Install Playwright (Binary Only)
        run: pnpm exec playwright install chromium
        # Installs into ./.cache/ms-playwright (inside workspace)

  # ===========================================================================
  # JOB 2: QUALITY CHECKS
  # Reuses the workspace from Job 1 (No re-install needed)
  # ===========================================================================
  quality-check:
    name: 🛡️ Quality Check
    needs: infra-setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          clean: false # ⚡ KEEP WORKSPACE (Preserves node_modules & browsers)

      # We still set up pnpm/node just to ensure the binaries are in PATH
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v6
        with: { node-version: '20.x' }

      - name: Configure Session-specific Cache
        run: |
          pnpm config set cache-dir ~/.cache/pnpm-${{ env.SESSION_ID }}
          pnpm config set side-effects-cache true

      - name: Verify Dependencies
        run: |
          # Ensure dependencies are installed if node_modules is missing
          if [ ! -d "node_modules" ]; then
            echo "node_modules missing, reinstalling dependencies..."
            pnpm install --frozen-lockfile
          fi

      - name: Run Knip
        id: knip
        run: |
          pnpm run knip 2>&1 | tee knip-output.txt || true
        continue-on-error: true

      - name: Upload Knip Report
        if: always() && steps.knip.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: knip-report
          path: knip-output.txt
          retention-days: 30
        continue-on-error: true

      - name: Lint Code
        run: pnpm run lint

      - name: Verify Build
        run: pnpm run build

  # ===========================================================================
  # JOB 3: CORE LOGIC TESTS
  # Reuses workspace. Runs functional tests.
  # ===========================================================================
  core-tests:
    name: 🧪 Core Logic
    needs: quality-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          clean: false # ⚡ KEEP WORKSPACE

      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v6
        with: { node-version: '20.x' }

      - name: Configure Session-specific Cache
        run: |
          pnpm config set cache-dir ~/.cache/pnpm-${{ env.SESSION_ID }}
          pnpm config set side-effects-cache true

      - name: Configure Envs
        run: |
          # Re-write envs just in case, but folder is persisted
          echo "NEXTAUTH_URL=http://127.0.0.1:3000" > .env.local
          echo "NEXTAUTH_SECRET=ci-secret-${{ env.SESSION_ID }}" >> .env.local

      - name: Verify Dependencies
        run: |
          # Ensure dependencies are installed if node_modules is missing
          if [ ! -d "node_modules" ]; then
            echo "node_modules missing, reinstalling dependencies..."
            pnpm install --frozen-lockfile
            pnpm exec playwright install chromium
          fi

      - name: Run Infra Tests
        id: infra-tests
        run: pnpm run test:infra 2>&1 | tee infra-tests.log || true
        continue-on-error: true

      - name: Run Unit Tests
        id: unit-tests
        run: pnpm run test:unit 2>&1 | tee unit-tests.log || true
        continue-on-error: true

      - name: Upload Test Reports
        if: always() && (steps.infra-tests.outcome == 'failure' || steps.unit-tests.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            infra-tests.log
            unit-tests.log
          retention-days: 30
        continue-on-error: true

  # ===========================================================================
  # JOB 4: VISUAL REGRESSION TESTS
  # Reuses workspace. Runs visual tests.
  # ===========================================================================
  visual-tests:
    name: 🎨 Visual Regression
    needs: core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          clean: false # ⚡ KEEP WORKSPACE

      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v6
        with: { node-version: '20.x' }

      - name: Configure Session-specific Cache
        run: |
          pnpm config set cache-dir ~/.cache/pnpm-${{ env.SESSION_ID }}
          pnpm config set side-effects-cache true

      - name: Configure Envs
        run: |
          echo "NEXTAUTH_URL=http://127.0.0.1:3000" > .env.local
          echo "NEXTAUTH_SECRET=ci-secret-${{ env.SESSION_ID }}" >> .env.local

      - name: Verify Dependencies
        run: |
          # Ensure dependencies are installed if node_modules is missing
          if [ ! -d "node_modules" ]; then
            echo "node_modules missing, reinstalling dependencies..."
            pnpm install --frozen-lockfile
            pnpm exec playwright install chromium
          fi

      - name: Run Visual Tests
        run: |
          pnpm run test:json || true
          python3 scripts/analyze-playwright-report.py playwright-report.json

      - name: Upload Report on Failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-visual-${{ env.SESSION_ID }}
          path: playwright-report/
          retention-days: 5

      - name: Cache Cleanup - Prune if Over 7GB
        if: always()
        shell: bash
        run: |
          CACHE_DIR="${{ github.workspace }}/.cache/ms-playwright"
          if [ -d "$CACHE_DIR" ]; then
            CACHE_SIZE=$(du -sh "$CACHE_DIR" | cut -f1)
            CACHE_SIZE_BYTES=$(du -sb "$CACHE_DIR" | cut -f1)
            SEVEN_GB=$((7 * 1024 * 1024 * 1024))
            
            echo "📊 Playwright cache size: $CACHE_SIZE"
            
            if [ "$CACHE_SIZE_BYTES" -gt "$SEVEN_GB" ]; then
              echo "⚠️ Cache exceeds 7GB threshold ($((CACHE_SIZE_BYTES / 1024 / 1024 / 1024))GB), pruning..."
              
              # List cache structure before cleanup
              echo "Cache structure before cleanup:"
              du -sh "$CACHE_DIR"/* 2>/dev/null | sort -rh | head -10
              
              # Remove oldest chromium versions, keeping only latest
              echo "Removing older browser versions..."
              find "$CACHE_DIR" -type d -name "chromium-*" | sort -V | head -n -1 | while read dir; do
                DIR_SIZE=$(du -sh "$dir" | cut -f1)
                echo "  Removing $dir (${DIR_SIZE})"
                rm -rf "$dir"
              done
              
              # If still over threshold, remove entire cache
              CACHE_SIZE_BYTES=$(du -sb "$CACHE_DIR" | cut -f1)
              if [ "$CACHE_SIZE_BYTES" -gt "$SEVEN_GB" ]; then
                echo "Still over 7GB after version cleanup, removing entire cache..."
                rm -rf "$CACHE_DIR"
              fi
              
              FINAL_SIZE=$(du -sh "$CACHE_DIR" 2>/dev/null | cut -f1)
              echo "✅ Cache pruned. Final size: ${FINAL_SIZE:-0MB} (under 7GB limit)"
            else
              echo "✅ Cache within limits (under 7GB)"
            fi
          fi

  # ===========================================================================
  # JOB 5: QUALITY REPORT & FAILURE NOTIFICATION
  # Aggregates results and notifies Jules of any failures
  # ===========================================================================
  quality-report:
    name: 📊 Quality Report
    if: always()
    needs: [quality-check, core-tests, visual-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect Failure Information
        id: failures
        env:
          CODE_QUALITY_RESULT: ${{ needs.quality-check.result }}
          CORE_TESTS_RESULT: ${{ needs.core-tests.result }}
          VISUAL_TESTS_RESULT: ${{ needs.visual-tests.result }}
        run: |
          set +e
          
          FAILED_JOBS=""
          FAILURE_COUNT=0
          
          if [ "$CODE_QUALITY_RESULT" != "success" ] && [ "$CODE_QUALITY_RESULT" != "skipped" ]; then
            FAILED_JOBS="$FAILED_JOBS- Code Quality ($CODE_QUALITY_RESULT)"$'\n'
            FAILURE_COUNT=$((FAILURE_COUNT + 1))
          fi
          
          if [ "$CORE_TESTS_RESULT" != "success" ] && [ "$CORE_TESTS_RESULT" != "skipped" ]; then
            FAILED_JOBS="$FAILED_JOBS- Core Tests ($CORE_TESTS_RESULT)"$'\n'
            FAILURE_COUNT=$((FAILURE_COUNT + 1))
          fi
          
          if [ "$VISUAL_TESTS_RESULT" != "success" ] && [ "$VISUAL_TESTS_RESULT" != "skipped" ]; then
            FAILED_JOBS="$FAILED_JOBS- Visual Regression Tests ($VISUAL_TESTS_RESULT)"$'\n'
            FAILURE_COUNT=$((FAILURE_COUNT + 1))
          fi
          
          echo "FAILED_JOBS<<EOF" >> $GITHUB_ENV
          echo "$FAILED_JOBS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "FAILURE_COUNT=$FAILURE_COUNT" >> $GITHUB_ENV

      - name: Post Quality Check Comment
        if: github.event.pull_request.number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const code_quality = '${{ needs.quality-check.result }}';
            const core_tests = '${{ needs.core-tests.result }}';
            const visual_tests = '${{ needs.visual-tests.result }}';
            const pr = context.payload.pull_request;
            
            let summary = '## 📋 Quality Gate Status\n\n';
            summary += `| Check | Status |\n`;
            summary += `|-------|--------|\n`;
            summary += `| Code Quality | ${code_quality === 'success' ? '✅' : code_quality === 'skipped' ? '⊘' : '❌'} ${code_quality} |\n`;
            summary += `| Core Tests | ${core_tests === 'success' ? '✅' : core_tests === 'skipped' ? '⊘' : '❌'} ${core_tests} |\n`;
            summary += `| Visual Tests | ${visual_tests === 'success' ? '✅' : visual_tests === 'skipped' ? '⊘' : '❌'} ${visual_tests} |\n`;
            
            if ('${{ env.FAILURE_COUNT }}' > 0) {
              summary += `\n⚠️ **${{ env.FAILURE_COUNT }} Quality Check(s) Need Attention**\n`;
              summary += `\n${{ env.FAILED_JOBS }}`;
              summary += `\n📦 Check [artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for detailed reports.\n`;
            } else {
              summary += `\n✅ All quality checks passed!\n`;
            }
            
            summary += `\n📖 [Full Workflow Log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Notify on Critical Failures
        if: env.FAILURE_COUNT > 0
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            
            github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⏸️ **Review Status**: Quality checks have issues. Please review the failing checks above and either:\n\n1. Fix the issues locally and push updates\n2. Reach out if you need help resolving these issues\n\nI will continue to monitor and re-test as you make changes.'
            });
