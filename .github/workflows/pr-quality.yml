name: PR Quality Gate

on:
  pull_request:
    branches: ['leader']
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check'
        required: true
        default: 'leader'

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  actions: read
  pull-requests: write
  issues: write

env:
  FORCE_COLOR: 1
  SESSION_ID: ${{ github.event.pull_request.number || github.ref_name || github.run_id }}

jobs:
  scope-check:
    name: 'Scope Check'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Analyze Changed Files
        id: analyze-files
        run: |
          # Logic from pr-scope-check.yml
          declare -A areas
          areas[Auth]="app/api/auth|lib/auth.ts|middleware.ts"
          areas[CI-CD]=".github/|scripts/|Dockerfile|docker-compose.yml"
          areas[API]="app/api/|services/|lib/validation"
          areas[UI]="app/((?!api).)*$|components/|hooks/|context/|public/"
          areas[Core-Internals]="server.ts|lib/|utils/|types/"
          areas[Docs]=".md$|.mdx$|docs/"
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          changed_files=$(git diff --name-only "$base_sha" "$head_sha")
          declare -A touched_areas_map
          while IFS= read -r file; do
            for area in Auth CI-CD API UI Core-Internals Docs; do
              if echo "$file" | grep -E -q "${areas[$area]}"; then
                touched_areas_map[$area]=1
                break
              fi
            done
          done <<< "$changed_files"
          unique_areas="${!touched_areas_map[@]}"
          area_count="${#touched_areas_map[@]}"
          echo "count=$area_count" >> $GITHUB_OUTPUT
          echo "areas=$unique_areas" >> $GITHUB_OUTPUT
      - name: Add Scope Label
        uses: actions/github-script@v7
        with:
          script: |
            // Logic to add scope labels based on analysis

  dependency-validation:
    name: 'Dependency Validation'
    runs-on: self-hosted
    if: contains(github.event.pull_request.title, 'deps')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate Dependency PR
        run: |
          # Logic from dependency-validation.yml
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          git diff --name-only "${BASE_SHA}".."${HEAD_SHA}" | grep -q package.json || exit 1
          git diff --name-only "${BASE_SHA}".."${HEAD_SHA}" | grep -q pnpm-lock.yaml || exit 1

  lint:
    name: 'Lint'
    runs-on: self-hosted
    steps:
      - name: 'Setup Environment'
        uses: ./.github/actions/setup-env
      - name: 'Run Lint'
        run: pnpm run lint

  unit-tests:
    name: 'Unit Tests'
    runs-on: self-hosted
    steps:
      - name: 'Setup Environment'
        uses: ./.github/actions/setup-env
      - name: 'Run Unit Tests'
        run: pnpm run test:unit

  report-failure:
    name: 'Report Failure'
    runs-on: self-hosted
    needs: [scope-check, dependency-validation, lint, unit-tests]
    if: failure()
    steps:
      - name: 'Post Failure Comment'
        run: echo "One or more checks failed."
