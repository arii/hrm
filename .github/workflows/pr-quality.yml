  copy-checks:
    name: 📝 Copy checks from parent commit
    if: inputs.has_changes == 'false'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.ARI_PAT || secrets.GITHUB_TOKEN }}
    permissions:
      checks: write
      actions: read
      pull-requests: read
    steps:
      - name: Install jq
        run: |
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy checks from parent commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          set -e
          CURRENT_SHA=$(git rev-parse HEAD)

          echo "🔎 Searching for the last successful 'PR Quality Gate' workflow run on branch '${{ github.head_ref || github.ref_name }}'..."
          # Fetch the SHA of the head commit from the most recent successful run of this workflow on this branch.
          # Exclude the current run_id to prevent finding ourselves in a race condition.
          WORKFLOW_RUN_JSON=$(gh run list --workflow "pr-quality.yml" --branch "${{ github.head_ref || github.ref_name }}" --status "success" -L 5 --json headSha,databaseId 2>/dev/null || echo "[]")
          PARENT_SHA=$(echo "$WORKFLOW_RUN_JSON" | jq -r --argjson current_run_id ${{ github.run_id }} '.[] | select(.databaseId != $current_run_id) | .headSha' | head -n 1 || echo "")

          if [ -z "$PARENT_SHA" ] || [ "$PARENT_SHA" = "null" ]; then
            echo "::warning::Could not find a recent successful workflow run to copy checks from. Falling back to the commit before HEAD (${{ github.event.before }})."
            PARENT_SHA="${{ github.event.before }}"
          fi

          if [ -z "$PARENT_SHA" ] || [ "$PARENT_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::warning::No valid previous commit SHA found. Falling back to HEAD~1."
            PARENT_SHA=$(git rev-parse HEAD~1)
          fi

          echo "::notice::Will copy checks from commit: ${PARENT_SHA}"

          # Fetch the parent commit to ensure it's available locally for the polling logic.
          git fetch origin "$PARENT_SHA" --depth=1 || (echo "::error::Could not fetch commit ${PARENT_SHA}." && exit 1)

          # --- Dynamically determine the list of jobs to copy ---
          echo "🔎 Determining required checks for branch '$TARGET_BRANCH'..."
          # Use || echo "[]" to prevent failure if API call fails (e.g., 403 Forbidden)
          if REQUIRED_CHECKS_JSON=$(gh api "repos/${{ github.repository }}/branches/$TARGET_BRANCH/protection/required_status_checks" --jq '.contexts' 2>/dev/null); then
             echo "Successfully fetched required checks."
          else
             echo "::warning::Failed to fetch required checks (likely 403 Forbidden). Using fallback."
             REQUIRED_CHECKS_JSON="[]"
          fi

          if [ "$(echo "$REQUIRED_CHECKS_JSON" | jq 'length')" -gt 0 ]; then
            echo "Found protected branch rules. Required checks:"
            echo "$REQUIRED_CHECKS_JSON" | jq -r '.[]'
            # Convert JSON array to a bash array
            mapfile -t JOBS_TO_COPY < <(echo "$REQUIRED_CHECKS_JSON" | jq -r '.[]')
          else
            echo "Branch is not protected or failed to fetch rules. Using fallback list."
            JOBS_TO_COPY=(
              "📝 Prepare Environment"
              "🎒 Knip Check"
              "🔍 Lint Check"
              "🏗️ Build Check"
              "🧪 Infrastructure Tests"
              "🧪 Unit Tests"
              "🧪 Component Tests"
              "🧪 Performance Tests"
              "🧪 Visual Tests"
              "📊 Integration Tests Summary"
              "📊 Quality Report"
            )
          fi

          # --- Check parent commit checks (No Polling) ---
          echo "🔎 Checking status of checks on parent commit ($PARENT_SHA)..."

          # Fetch check runs for the parent commit
          PARENT_CHECKS_JSON=$(gh api "repos/${{ github.repository }}/commits/${PARENT_SHA}/check-runs" --jq '.check_runs' 2>/dev/null || echo "[]")

          # Filter for the specific jobs we care about
          RELEVANT_CHECKS_JSON=$(echo "$PARENT_CHECKS_JSON" | jq -c --argjson jobs_to_copy "$(printf '%s\n' "${JOBS_TO_COPY[@]}" | jq -R . | jq -s .)" '[.[] | select(.name as $name | $jobs_to_copy | index($name))]')

          CHECKS_JSON="$RELEVANT_CHECKS_JSON"

          # Count how many of the relevant checks are NOT completed
          IN_PROGRESS_COUNT=$(echo "$RELEVANT_CHECKS_JSON" | jq '[.[] | select(.status != "completed")] | length')

          if [ "$IN_PROGRESS_COUNT" -gt 0 ]; then
            echo "::warning::Some parent checks are still in progress ($IN_PROGRESS_COUNT). Copying current status anyway."
          else
            echo "✅ All relevant parent checks are completed (or none found)."
          fi

          # --- Create new checks for the current commit ---
          echo "✒️ Copying final check statuses to current commit ($CURRENT_SHA)..."
          for JOB_NAME in "${JOBS_TO_COPY[@]}"; do
            CHECK=$(echo "${CHECKS_JSON}" | jq --arg name "${JOB_NAME}" '.[] | select(.name == $name)')
            if [ -n "$CHECK" ]; then
              # Use jq's // operator to provide a default value if .conclusion is null or not present
              CONCLUSION=$(echo "${CHECK}" | jq -r '.conclusion // "skipped"')
              # Also provide a default for the output object
              OUTPUT=$(echo "${CHECK}" | jq -c '.output // {title: "Check Skipped", summary: "The parent check conclusion was indeterminate."}')

              BODY=$(jq -n --arg name "$JOB_NAME" --arg head_sha "$CURRENT_SHA" --arg status "completed" --arg conclusion "$CONCLUSION" --argjson output "$OUTPUT" '{name: $name, head_sha: $head_sha, status: $status, conclusion: $conclusion, output: $output}')
              echo "Creating check: $JOB_NAME -> $CONCLUSION"
              # Attempt to create the check run, but don't fail the job if permission is denied (common with GITHUB_TOKEN on some setups)
              if ! gh api "repos/${{ github.repository }}/check-runs" --method POST --input - <<< "$BODY" 2>/dev/null; then
                 echo "::warning::Failed to create check run for '$JOB_NAME'. This is likely due to 'checks: write' permission limitations with the current token."
              fi
            else
              echo "Did not find check '${JOB_NAME}' on parent. Creating a skipped check."
              OUTPUT=$(jq -n '{title: "Check Skipped", summary: "This check was not found on the parent commit."}')
              BODY=$(jq -n --arg name "$JOB_NAME" --arg head_sha "$CURRENT_SHA" --arg status "completed" --arg conclusion "skipped" --argjson output "$OUTPUT" '{name: $name, head_sha: $head_sha, status: $status, conclusion: $conclusion, output: $output}')
              if ! gh api "repos/${{ github.repository }}/check-runs" --method POST --input - <<< "$BODY" 2>/dev/null; then
                 echo "::warning::Failed to create skipped check run for '$JOB_NAME'."
              fi
            fi
          done
          echo "🎉 Check copy process finished (successes and failures logged)."
