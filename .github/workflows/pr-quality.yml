name: PR Quality Gate

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check'
        required: true
        default: 'leader'
      pr_number:
        description: 'PR number to post comments to (optional)'
        required: false
        type: string
  
  workflow_call:
    inputs:
      branch:
        description: 'Branch to check'
        required: false
        type: string
        default: 'leader'
      pr_number:
        description: 'PR number to post comments to (optional)'
        required: false
        type: string
    secrets:
      GH_TOKEN:
        description: 'GitHub token for posting comments'
        required: true

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  prepare-env:
    name: 📝 Prepare Environment
    runs-on: ubuntu-latest
    outputs:
      session_id: ${{ steps.sanitize_id.outputs.sanitized-value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanitize SESSION_ID
        id: sanitize_id
        uses: ./.github/actions/sanitize-string
        with:
          value: ${{ github.event.pull_request.number || github.ref_name || github.run_id }}

  test-actions:
    name: ⚙️ Test Composite Actions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "Special Chars and Truncation"
            value: 'feature/test-branch/with_special-chars!@#$%^&*()'
            max-length: '30'
            expected: 'feature-test-branch-with_speci'
          - name: "Empty String"
            value: ''
            max-length: '64'
            expected: ''
          - name: "Already Sanitized"
            value: 'clean-string-123'
            max-length: '64'
            expected: 'clean-string-123'
          - name: "Shorter than Max Length with special chars"
            value: 'short/string'
            max-length: '64'
            expected: 'short-string'
          - name: "Duplicate Hyphens"
            value: 'feature//branch'
            max-length: '64'
            expected: 'feature-branch'
          - name: "Trailing Hyphen"
            value: 'feature/branch-'
            max-length: '64'
            expected: 'feature-branch'
          - name: "At Max Length"
            value: 'a-very-long-string-that-is-exactly-64-characters-long-and-valid'
            max-length: '64'
            expected: 'a-very-long-string-that-is-exactly-64-characters-long-and-valid'
          - name: "Only Invalid Chars"
            value: '!@#$%^&*()'
            max-length: '64'
            expected: ''
          - name: "Leading and Trailing Invalid Chars"
            value: '!!test-branch!!'
            max-length: '64'
            expected: 'test-branch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sanitize String (Test Case - ${{ matrix.name }})
        id: sanitize_step
        uses: ./.github/actions/sanitize-string
        with:
          value: ${{ matrix.value }}
          max-length: ${{ matrix.max-length }}

      - name: Verify (Test Case - ${{ matrix.name }})
        run: |
          actual="${{ steps.sanitize_step.outputs.sanitized-value }}"
          expected="${{ matrix.expected }}"
          if [ "$actual" != "$expected" ]; then
            echo "Test Case Failed: ${{ matrix.name }}"
            echo "Expected: '$expected'"
            echo "Actual:   '$actual'"
            exit 1
          fi
          echo "✅ Test Case Passed: ${{ matrix.name }}"

  quality-check:
    name: 🛡️ Quality Check
    needs: [prepare-env, test-actions]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SESSION_ID: ${{ needs.prepare-env.outputs.session_id }}
    steps:
      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          fetch-depth: 0

      - name: Run Knip
        id: knip
        shell: bash
        run: |
          set -o pipefail
          pnpm run knip 2>&1 | tee knip-output.txt
        continue-on-error: true

      - name: Upload Knip Report
        if: always() && steps.knip.outcome == 'failure' && hashFiles('knip-output.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: knip-report
          path: knip-output.txt
          retention-days: 3

      - name: Lint Code
        id: lint
        shell: bash
        run: |
          set -o pipefail
          pnpm run lint 2>&1 | tee lint-output.log
        continue-on-error: true

      - name: Upload Lint Report
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-output.log
          retention-days: 3

      - name: Fail on Lint Errors
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Verify Build
        id: build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: build-verification-secret-do-not-use-in-production
        shell: bash
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee build-output.log

      - name: Upload Build Report
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-output.log
          retention-days: 3

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ env.SESSION_ID }}
          include-hidden-files: true
          path: |
            dist/
            .next/
          retention-days: 1

  core-tests:
    name: 🧪 Core Logic
    needs: [prepare-env, quality-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SESSION_ID: ${{ needs.prepare-env.outputs.session_id }}
    steps:
      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          fetch-depth: 0

      - name: Configure Envs
        run: |
          echo "NEXTAUTH_URL=http://127.0.0.1:3000" > .env.local
          echo "NEXTAUTH_SECRET=ci-secret-${{ env.SESSION_ID }}" >> .env.local

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ env.SESSION_ID }}
          path: .
          merge-multiple: true

      - name: Run Infra Tests
        id: infra-tests
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: build-verification-secret-do-not-use-in-production
        shell: bash
        run: |
          set -o pipefail
          pnpm run test:infra 2>&1 | tee infra-tests.log
        continue-on-error: true

      - name: Run Unit Tests
        id: unit-tests
        shell: bash
        run: |
          set -o pipefail
          pnpm run test:unit 2>&1 | tee unit-tests.log
        continue-on-error: true

      - name: Upload Test Reports
        if: always() && (steps.infra-tests.outcome == 'failure' || steps.unit-tests.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            infra-tests.log
            unit-tests.log
          retention-days: 3

  visual-tests:
    name: 🎨 Visual Regression
    needs: [prepare-env, quality-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SESSION_ID: ${{ needs.prepare-env.outputs.session_id }}
    steps:
      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          fetch-depth: 0

      - name: Configure Envs
        run: |
          echo "NEXTAUTH_URL=http://127.0.0.1:3000" > .env.local
          echo "NEXTAUTH_SECRET=ci-secret-${{ env.SESSION_ID }}" >> .env.local

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ env.SESSION_ID }}
          path: .
          merge-multiple: true

      - name: Run Visual Tests
        id: visual-tests
        shell: bash
        run: |
          set -o pipefail
          pnpm run test:json 2>&1 | tee visual-tests.log
          python3 scripts/analyze-playwright-report.py playwright-report.json
        continue-on-error: true

      - name: Upload Visual Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-logs
          path: visual-tests.log
          retention-days: 3

      - name: Upload Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual-${{ env.SESSION_ID }}
          path: playwright-report/
          retention-days: 5

      - name: Cache Cleanup - Prune if Over 7GB
        if: always()
        shell: bash
        run: |
          CACHE_DIR="${{ github.workspace }}/.cache/ms-playwright"
          if [ -d "$CACHE_DIR" ]; then
            CACHE_SIZE=$(du -sh "$CACHE_DIR" | cut -f1)
            CACHE_SIZE_BYTES=$(du -sb "$CACHE_DIR" | cut -f1)
            SEVEN_GB=$((7 * 1024 * 1024 * 1024))

            echo "📊 Playwright cache size: $CACHE_SIZE"

            if [ "$CACHE_SIZE_BYTES" -gt "$SEVEN_GB" ]; then
              echo "⚠️ Cache exceeds 7GB threshold ($((CACHE_SIZE_BYTES / 1024 / 1024 / 1024))GB), pruning..."

              echo "Cache structure before cleanup:"
              du -sh "$CACHE_DIR"/* 2>/dev/null | sort -rh | head -10

              echo "Removing older browser versions..."
              find "$CACHE_DIR" -type d -name "chromium-*" | sort -V | head -n -1 | while read dir; do
                DIR_SIZE=$(du -sh "$dir" | cut -f1)
                echo "  Removing $dir (${DIR_SIZE})"
                rm -rf "$dir"
              done

              CACHE_SIZE_BYTES=$(du -sb "$CACHE_DIR" | cut -f1)
              if [ "$CACHE_SIZE_BYTES" -gt "$SEVEN_GB" ]; then
                echo "Still over 7GB after version cleanup, removing entire cache..."
                rm -rf "$CACHE_DIR"
              fi

              FINAL_SIZE=$(du -sh "$CACHE_DIR" 2>/dev/null | cut -f1)
              echo "✅ Cache pruned. Final size: ${FINAL_SIZE:-0MB} (under 7GB limit)"
            else
              echo "✅ Cache within limits (under 7GB)"
            fi
          fi

  quality-report:
    name: 📊 Quality Report
    if: always()
    needs: [prepare-env, quality-check, core-tests, visual-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Test Logs
        uses: actions/download-artifact@v4
        with:
          pattern: '*-logs'
          path: logs
          merge-multiple: true

      - name: Download Lint Report
        uses: actions/download-artifact@v4
        with:
          name: lint-report
          path: logs
        continue-on-error: true

      - name: Download Knip Report
        uses: actions/download-artifact@v4
        with:
          name: knip-report
          path: logs
        continue-on-error: true

      - name: Download Build Report
        uses: actions/download-artifact@v4
        with:
          name: build-report
          path: logs
        continue-on-error: true

      - name: Download Setup Report
        uses: actions/download-artifact@v4
        with:
          name: setup-report
          path: logs
        continue-on-error: true

      - name: Download Core Test Reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: logs
        continue-on-error: true

      - name: Post Comprehensive Quality Report
        env:
          QUALITY_RESULT: ${{ needs.quality-check.result }}
          CORE_TESTS_RESULT: ${{ needs.core-tests.result }}
          VISUAL_TESTS_RESULT: ${{ needs.visual-tests.result }}
          LOG_TRUNCATE_BYTES: 15000
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.ARI_PAT }}
        run: |
          set +e
          
          if [ -z "$LOG_TRUNCATE_BYTES" ] || ! [[ "$LOG_TRUNCATE_BYTES" =~ ^[0-9]+$ ]]; then
             LOG_TRUNCATE_BYTES=15000
          fi
          if [ "$LOG_TRUNCATE_BYTES" -gt 50000 ]; then
             LOG_TRUNCATE_BYTES=50000
          fi

          if [ -f "logs/lint-output.log" ]; then
            mv "logs/lint-output.log" "logs/code-quality.log"
          fi

          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
          fi
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
            PR_NUMBER="${{ inputs.pr_number }}"
          fi
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
            PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number' 2>/dev/null)
          fi
          
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
            echo "::warning::No Pull Request found. Skipping comment."
            exit 0
          fi
          
          mkdir -p test-results
          COMMENT_FILE="test-results/pr-comment.md"

          {
            echo "## 📋 Quality Gate Results"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Code Quality | $([ "$QUALITY_RESULT" = "success" ] && echo '✅ success' || echo '❌ '$QUALITY_RESULT) |"
            echo "| Core Tests | $([ "$CORE_TESTS_RESULT" = "success" ] && echo '✅ success' || echo '❌ '$CORE_TESTS_RESULT) |"
            echo "| Visual Tests | $([ "$VISUAL_TESTS_RESULT" = "success" ] && echo '✅ success' || echo '❌ '$VISUAL_TESTS_RESULT) |"
            echo ""

            FAILED_ANY=0

            if [ "$QUALITY_RESULT" != "success" ] && [ "$QUALITY_RESULT" != "skipped" ]; then
              FAILED_ANY=1
              echo "<details><summary><strong>❌ Code Quality Failures</strong></summary>"
              echo ""
              echo '```'
              FOUND_LOG=0
              if [ -f "logs/code-quality.log" ]; then
                echo "--- LINT FAILURES ---"
                tail -c $LOG_TRUNCATE_BYTES "logs/code-quality.log" | sed -r 's/\x1b\[[0-9;]*m//g'
                echo ""
                FOUND_LOG=1
              fi

              if [ -f "logs/knip-output.txt" ]; then
                echo "--- KNIP FAILURES ---"
                tail -c $LOG_TRUNCATE_BYTES "logs/knip-output.txt" | sed -r 's/\x1b\[[0-9;]*m//g'
                echo ""
                FOUND_LOG=1
              fi

              if [ -f "logs/build-output.log" ]; then
                echo "--- BUILD FAILURES ---"
                tail -c $LOG_TRUNCATE_BYTES "logs/build-output.log" | sed -r 's/\x1b\[[0-9;]*m//g'
                echo ""
                FOUND_LOG=1
              fi

              if [ -f "logs/setup-output.log" ]; then
                echo "--- SETUP FAILURES ---"
                tail -c $LOG_TRUNCATE_BYTES "logs/setup-output.log" | sed -r 's/\x1b\[[0-9;]*m//g'
                echo ""
                FOUND_LOG=1
              fi

              if [ $FOUND_LOG -eq 0 ]; then
                echo "Log file not found. Check workflow run for details."
              fi
              echo '```'
              echo ""
              echo "</details>"
            fi

            if [ "$CORE_TESTS_RESULT" != "success" ] && [ "$CORE_TESTS_RESULT" != "skipped" ]; then
              FAILED_ANY=1
               echo "<details><summary><strong>❌ Core Tests Failures</strong></summary>"
               echo ""
               echo '```'
               if [ -f "logs/infra-tests.log" ]; then
                 tail -c $LOG_TRUNCATE_BYTES "logs/infra-tests.log" | sed -r 's/\x1b\[[0-9;]*m//g'
               elif [ -f "logs/unit-tests.log" ]; then
                 tail -c $LOG_TRUNCATE_BYTES "logs/unit-tests.log" | sed -r 's/\x1b\[[0-9;]*m//g'
               else
                 echo "Log file not found"
               fi
               echo '```'
               echo ""
               echo "</details>"
            fi

            if [ "$VISUAL_TESTS_RESULT" != "success" ] && [ "$VISUAL_TESTS_RESULT" != "skipped" ]; then
              FAILED_ANY=1
              echo "<details><summary><strong>❌ Visual Tests Failures</strong></summary>"
              echo ""
              echo '```'
              if [ -f "logs/visual-tests.log" ]; then
                tail -c $LOG_TRUNCATE_BYTES "logs/visual-tests.log" | sed -r 's/\x1b\[[0-9;]*m//g'
              else
                echo "Log file not found"
              fi
              echo '```'
              echo ""
              echo "</details>"
            fi

            if [ $FAILED_ANY -eq 0 ]; then
              echo "✅ All quality checks passed!"
            else
              echo ""
              echo "---"
              echo "*Note: Logs are truncated to 15KB. View the [full workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for complete details.*"
            fi
          } > "$COMMENT_FILE"
          
          gh pr comment "$PR_NUMBER" --body-file "$COMMENT_FILE" || {
            echo "::error::Failed to post comment to PR #$PR_NUMBER"
            exit 1
          }
