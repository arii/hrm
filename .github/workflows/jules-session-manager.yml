# .github/workflows/jules-session-manager.yml
name: Jules Session Manager

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  jules-command:
    if: |
      (github.event.issue && github.event.issue.pull_request) &&
      (github.event.comment && contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) &&
      (github.event.comment && (startsWith(github.event.comment.body, '@jules-delete') || startsWith(github.event.comment.body, '@jules-new')))
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 'Parse Command'
        id: parse_command
        run: |
          COMMENT_BODY="${{ github.event.comment && github.event.comment.body }}"
          if [[ "$COMMENT_BODY" == "@jules-delete"* ]]; then
            echo "COMMAND=delete" >> $GITHUB_ENV
          elif [[ "$COMMENT_BODY" == "@jules-new"* ]]; then
            echo "COMMAND=new" >> $GITHUB_ENV
          fi

      - name: 'Get PR Context'
        id: pr_context
        if: env.COMMAND == 'new'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ (github.event.issue && github.event.issue.number) || 0 }}
        run: |
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "0" ]; then
            echo "::error::PR_NUMBER is missing or 0."
            exit 1
          fi
          # Fetch basic PR data
          PR_DATA=$(gh pr view "$PR_NUMBER" --json headRefName,baseRefName,body,title,comments,reviews)
          BRANCH=$(echo "$PR_DATA" | jq -r .headRefName)
          BASE_REF=$(echo "$PR_DATA" | jq -r .baseRefName)
          BODY=$(echo "$PR_DATA" | jq -r .body)
          TITLE=$(echo "$PR_DATA" | jq -r .title)

          # Fetch and format comments
          COMMENTS=$(echo "$PR_DATA" | jq -r '.comments | .[] | "- \(.body)"' | sed 's/^/  /')
          REVIEWS=$(echo "$PR_DATA" | jq -r '.reviews | .[] | select(.body != "") | "- \(.body)"' | sed 's/^/  /')

          # Fetch git logs
          # We assume the PR is up-to-date with the base branch
          # This gets the logs from the point the branch was created
          MERGE_BASE=$(git merge-base "origin/$BASE_REF" "HEAD")
          LOGS=$(git log -n 50 --pretty=format:"- %s" "$MERGE_BASE..HEAD")

          # Construct the full prompt
          FULL_PROMPT=$(cat <<EOM
          **PR Title:** $TITLE

          **PR Body:**
          $BODY

          **Review Comments:**
          $REVIEWS

          **Other Comments:**
          $COMMENTS

          **Git Logs:**
          $LOGS
          EOM
          )

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "PROMPT<<EOF" >> $GITHUB_ENV
          echo "$FULL_PROMPT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "TITLE=$TITLE" >> $GITHUB_ENV

      - name: 'Find Jules Session ID'
        id: find_session_id
        if: env.COMMAND == 'delete'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ (github.event.issue && github.event.issue.number) || 0 }}
        run: |
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "0" ]; then
            echo "::error::PR_NUMBER is missing or 0."
            exit 1
          fi
          SESSION_ID=$(gh pr view "$PR_NUMBER" --json comments --jq '.comments | .[] | .body' | grep -oP '(?<=<!-- JULES_SESSION_ID=)\S+(?= *-->)' | tail -n 1)
          if [ -z "$SESSION_ID" ]; then
            echo "::error::Could not find Jules session ID in PR comments. Was a session previously created using '@jules-new' and completed successfully?"
            exit 1
          fi
          echo "JULES_SESSION_ID=$SESSION_ID" >> $GITHUB_ENV

      - name: 'Validate Secrets and Install Dependencies'
        env:
          JULES_API_URL: ${{ secrets.JULES_API_URL }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set +e
          missing_vars=""

          if [ -z "$JULES_API_URL" ]; then
            missing_vars="JULES_API_URL"
          fi

          if [ -z "$JULES_API_KEY" ]; then
            if [ -n "$missing_vars" ]; then
              missing_vars="$missing_vars, JULES_API_KEY"
            else
              missing_vars="JULES_API_KEY"
            fi
          fi

          if [ -n "$missing_vars" ]; then
            echo "::error::The following required secrets are not set: $missing_vars. Please configure them in your repository secrets."
            exit 1
          fi

          echo "✅ All required Jules secrets are configured"
          pip install -r .github/scripts/requirements.txt

      - name: 'Run Jules Operation: New'
        if: env.COMMAND == 'new'
        id: jules_op_new
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          BRANCH: ${{ env.BRANCH }}
          TITLE: ${{ env.TITLE }}
          PROMPT: ${{ env.PROMPT }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ (github.event.repository && github.event.repository.name) || '' }}
        run: |
          set +e
          OUTPUT=$(python3 .github/scripts/jules_ops.py \
            --command "new" \
            --prompt "$PROMPT" \
            --branch "$BRANCH" \
            --title "$TITLE" \
            --owner "$REPO_OWNER" \
            --repo-name "$REPO_NAME" \
            --jules-api-url "${{ secrets.JULES_API_URL }}" 2>&1)
          EXIT_CODE=$?

          if [ $EXIT_CODE -ne 0 ]; then
            echo "error_message=$OUTPUT" >> $GITHUB_OUTPUT
            exit $EXIT_CODE
          fi

          echo "session_id=$OUTPUT" >> $GITHUB_OUTPUT

      - name: 'Run Jules Operation: Delete'
        if: env.COMMAND == 'delete'
        id: jules_op_delete
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_SESSION_ID: ${{ env.JULES_SESSION_ID }}
        run: |
          set +e
          OUTPUT=$(python3 .github/scripts/jules_ops.py \
            --command "delete" \
            --session-id "$JULES_SESSION_ID" \
            --jules-api-url "${{ secrets.JULES_API_URL }}" 2>&1)
          EXIT_CODE=$?

          if [ $EXIT_CODE -ne 0 ]; then
            echo "error_message=$OUTPUT" >> $GITHUB_OUTPUT
            exit $EXIT_CODE
          fi

      - name: 'Post Session ID Comment'
        if: success() && env.COMMAND == 'new'
        uses: actions/github-script@v7
        env:
          SESSION_ID: ${{ steps.jules_op_new.outputs.session_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sessionId = process.env.SESSION_ID;
            const prNumber = context.issue?.number || 0;
            if (sessionId && prNumber && prNumber !== 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `<!-- JULES_SESSION_ID=${sessionId} -->`
              });
            }

      - name: 'Add Reaction to Comment'
        if: success() && (github.event.comment && github.event.comment.id)
        uses: peter-evans/create-reaction@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-id: ${{ (github.event.comment && github.event.comment.id) || 0 }}
          reaction: '+1'
      - name: 'Handle Failure'
        if: failure()
        uses: actions/github-script@v7
        env:
          ERROR_NEW: ${{ steps.jules_op_new.outputs.error_message }}
          ERROR_DELETE: ${{ steps.jules_op_delete.outputs.error_message }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue?.number || 0;
            const errorMessageNew = process.env.ERROR_NEW || '';
            const errorMessageDelete = process.env.ERROR_DELETE || '';
            const errorMessage = errorMessageNew || errorMessageDelete || 'Unknown error occurred';

            const body = `Jules operation failed with the following error:\n\n\`\`\`\n${errorMessage}\n\`\`\``;

            const commentId = context.payload.comment?.id || 0;
            if (commentId && commentId !== 0) {
              try {
                await github.rest.reactions.createForIssueComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: commentId,
                  content: '-1'
                });
              } catch (e) {
                console.log('Could not add reaction:', e);
              }
            }

            if (prNumber && prNumber !== 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
