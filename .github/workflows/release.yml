name: Release

on:
  # This workflow is triggered on pushes to the 'leader' branch.
  # The release-please-action creates a "Release PR". When this PR is merged,
  # it constitutes a push to 'leader', which then triggers the action to create
  # the actual GitHub Release and tag.
  push:
    branches:
      - leader

# Permissions granted to the GITHUB_TOKEN for the release-please-action to manage the release process.
# - contents: write      | to create release tags and commit version updates/changelogs.
# - pull-requests: write | to create and manage the release PR.
# - issues: write        | to link issues in release notes.
# - releases: write      | to create the final GitHub release.
# See: https://github.com/marketplace/actions/release-please-action#workflow-permissions
permissions:
  contents: write
  pull-requests: write
  issues: write
  releases: write

jobs:
  release:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Release Please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
