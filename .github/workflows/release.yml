name: Release

on:
  # This workflow is triggered on pushes to the 'leader' branch.
  # The release-please-action creates a "Release PR". When this PR is merged,
  # it constitutes a push to 'leader', which then triggers the action to create
  # the actual GitHub Release and tag.
  push:
    branches:
      - leader

# This workflow uses the release-please-action to automate release PRs and changelogs.
#
# Permissions granted to the GITHUB_TOKEN for the release-please-action, scoped as
# narrowly as possible for security (principle of least privilege).
#
#   contents: write       # To create release tags, commit version bumps, and update the CHANGELOG.
#   pull-requests: write  # To create and manage the release PR.
#   issues: write         # To link issues in the release notes.
#   releases: write       # To create the final GitHub release.
#
# See: https://github.com/marketplace/actions/release-please-action#workflow-permissions
permissions:
  contents: write
  pull-requests: write
  issues: write
  releases: write

jobs:
  release:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Release Please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
