name: Release Automation

on:
  push:
    branches:
      - leader
      - beta

permissions:
  contents: write # Required for creating releases and committing changes
  issues: write   # Required for commenting on released issues
  pull-requests: write

jobs:
  test-and-release:
    name: 🚀 Test & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important: Fetch all history for semantic-release to analyze commits
          persist-credentials: false # We use a custom token for the release step

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run Quality Checks
        run: |
          pnpm run lint
          pnpm run build
          pnpm run test:unit

      - name: 📦 Semantic Release
        env:
          # GITHUB_TOKEN is automatically provided by Actions, but using a PAT (PERSONAL_ACCESS_TOKEN)
          # is recommended if you want the release commit to trigger other workflows.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
