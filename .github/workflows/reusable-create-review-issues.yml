# .github/workflows/reusable-create-review-issues.yml
# This workflow is responsible for creating GitHub issues based on the artifacts
# generated by the 'reusable-gemini-review.yml' workflow. It requires 'issues: write'
# permission to perform this function.
name: Reusable Create Review Issues

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'The PR number to source review artifacts from'
        required: true
        type: string
      run_id:
        description: 'The explicit workflow run ID to source artifacts from'
        required: false
        type: string
    secrets:
      gh_token:
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  create-review-issues:
    runs-on: ubuntu-latest
    name: Create Issues from Gemini Review

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Determine Source Workflow Run
        id: find_run
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPLICIT_RUN_ID: ${{ inputs.run_id }}
        run: |
          # Option 1: Use the explicitly provided run_id if available
          if [ -n "$EXPLICIT_RUN_ID" ]; then
            echo "::notice::Using explicitly provided run ID: $EXPLICIT_RUN_ID"
            echo "run_id=$EXPLICIT_RUN_ID" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Option 2: Fallback to finding the latest successful Gemini Orchestrator run for the PR's head SHA
          echo "::info::No explicit run ID provided. Searching for the latest successful 'gemini-orchestrator.yml' run..."
          HEAD_SHA=$(gh pr view $PR_NUMBER --json headRefOid --jq .headRefOid)
          echo "::info::Found head SHA for PR #$PR_NUMBER: $HEAD_SHA"

          RUN_ID=$(gh run list --commit "$HEAD_SHA" --workflow gemini-orchestrator.yml --status "success" --json databaseId --limit 1 | jq -r '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "run_id=not_found" >> $GITHUB_OUTPUT
            echo "::warning::No successful Gemini Orchestrator workflow run found for commit $HEAD_SHA."
          else
            echo "::info::Found latest successful run ID: $RUN_ID"
            echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          fi

      - name: Handle No Run Found
        if: steps.find_run.outputs.run_id == 'not_found'
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          gh pr comment $PR_NUMBER --body "Could not find a successful Gemini Orchestrator workflow run to source review artifacts. Please ensure the 'gemini-orchestrator.yml' workflow has completed successfully for this branch."
          exit 1

      - name: Download Review Artifact
        id: download_artifact
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
        run: |
          gh run download ${{ steps.find_run.outputs.run_id }} --name review-result --dir .
          if [ ! -f "review_result.json" ]; then
            echo "::error::Failed to download or find review_result.json artifact."
            exit 1
          fi
          echo "::info::Artifact downloaded successfully."

      - name: Create Suggested Issues
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ secrets.gh_token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          pnpm tsx scripts/create-review-issues.ts
