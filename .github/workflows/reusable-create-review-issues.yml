# .github/workflows/reusable-create-review-issues.yml
# This workflow is responsible for creating GitHub issues based on the artifacts
# generated by the 'reusable-gemini-review.yml' workflow. It requires 'issues: write'
# permission to perform this function.
name: Reusable Create Review Issues

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to create issues for'
        required: true
        type: string
      run_id:
        description: 'Workflow run ID with review artifacts'
        required: true
        type: string
  workflow_call:
    inputs:
      trigger_event:
        description: 'The event that triggered the workflow'
        required: false
        type: string
        default: 'workflow_call'
      pr_number:
        description: 'The PR number to associate the issues with'
        required: true
        type: string
      base_sha:
        description: 'The base SHA of the PR'
        required: false
        type: string
      run_id:
        description: 'The explicit workflow run ID to source artifacts from'
        required: true
        type: string
    secrets:
      gh_token:
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  disabled-guidance:
    if: |
      vars.GEMINI_ENABLE_REVIEW_ISSUES == 'false' &&
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'reopened') &&
      inputs.trigger_event != 'comment'
    runs-on: ubuntu-latest
    steps:
      - name: Post Guidance Comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = '### ℹ️ Gemini Review Issue Creation Disabled\n\n' +
              'Automatic creation of issues from reviews is currently disabled via `GEMINI_ENABLE_REVIEW_ISSUES`. To run it manually:\n\n' +
              '**Via Comment:**\n```\n@create-review-issues\n```\n\n' +
              '**Via GitHub Actions:**\n' +
              '1. Go to [Actions → Reusable Create Review Issues](' + context.payload.repository.html_url + '/actions/workflows/reusable-create-review-issues.yml)\n' +
              '2. Click "Run workflow"\n' +
              '3. Enter PR number: `' + context.payload.pull_request.number + '`\n' +
              '4. Enter Run ID from a successful review workflow.\n\n' +
              '**Via GitHub CLI:**\n```bash\ngh workflow run reusable-create-review-issues.yml -f pr_number=' + context.payload.pull_request.number + ' -f run_id=...\n```\n\n' +
              '#### 🤖 [Gemini Manual Trigger Guide](' + context.payload.repository.html_url + '/blob/leader/docs/workflows/MANUAL_TRIGGERS.md)\n\n' +
              '**To re-enable:** Set repository variable `GEMINI_ENABLE_REVIEW_ISSUES=true`';

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });

  create-review-issues:
    if: |
      github.event_name == 'workflow_dispatch' ||
      inputs.trigger_event == 'comment' ||
      vars.GEMINI_ENABLE_REVIEW_ISSUES != 'false'
    runs-on: ubuntu-latest
    name: Create Issues from Gemini Review

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event.pull_request || github.event.issue.pull_request) && format('refs/pull/{0}/head', inputs.pr_number || github.event.pull_request.number || github.event.issue.number) || github.sha }}
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Download Review Artifact
        uses: actions/download-artifact@v8
        with:
          name: review-result
          run-id: ${{ inputs.run_id }}
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Artifact
        id: verify_artifact
        run: |
          if [ ! -f "review_result.json" ]; then
            echo "::error::Failed to download or find review_result.json artifact."
            echo "artifact_found=false" >> $GITHUB_OUTPUT
          else
            echo "::info::Artifact downloaded and verified successfully."
            echo "artifact_found=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Suggested Issues
        if: steps.verify_artifact.outputs.artifact_found == 'true'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          pnpm tsx scripts/ci/run-create-review-issues.ts
