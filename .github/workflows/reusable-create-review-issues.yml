# .github/workflows/reusable-create-review-issues.yml
# This workflow is responsible for creating GitHub issues based on the artifacts
# generated by the 'reusable-gemini-review.yml' workflow. It requires 'issues: write'
# permission to perform this function.
name: Reusable Create Review Issues

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to create issues for'
        required: true
        type: string
      run_id:
        description: 'Workflow run ID with review artifacts'
        required: true
        type: string
  workflow_call:
    inputs:
      pr_number:
        description: 'The PR number to associate the issues with'
        required: true
        type: string
      base_sha:
        description: 'The base SHA of the PR'
        required: false
        type: string
      run_id:
        description: 'The explicit workflow run ID to source artifacts from'
        required: true
        type: string
    secrets:
      gh_token:
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  disabled-guidance:
    if: |
      vars.GEMINI_ENABLE_REVIEW_ISSUES == 'false' &&
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Post Guidance Comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### ℹ️ Gemini Review Issue Creation Disabled

            Automatic creation of issues from reviews is currently disabled via \`GEMINI_ENABLE_REVIEW_ISSUES\`. To run it manually:

            **Via Comment:**
            \`\`\`
            @create-review-issues
            \`\`\`

            **Via GitHub Actions:**
            1. Go to [Actions → Reusable Create Review Issues](${context.payload.repository.html_url}/actions/workflows/reusable-create-review-issues.yml)
            2. Click "Run workflow"
            3. Enter PR number: \`${context.payload.pull_request.number}\`
            4. Enter Run ID from a successful review workflow.

            **Via GitHub CLI:**
            \`\`\`bash
            gh workflow run reusable-create-review-issues.yml -f pr_number=${context.payload.pull_request.number} -f run_id=...
            \`\`\`

            #### 🤖 Manual Trigger Quick Reference
            | Command | Action |
            | :--- | :--- |
            | \`@gemini-bot\` | Run AI Code Review (PR only) |
            | \`@gemini-triage\` | Run Issue Triage |
            | \`@gemini-coder <task>\` | Generate Code |
            | \`@create-review-issues\` | Create issues from review (PR only) |
            | \`@gemini-help\` | Show this help message |

            Full reference: [Manual Trigger Guide](${context.payload.repository.html_url}/blob/leader/docs/workflows/MANUAL_TRIGGERS.md)

            **To re-enable:** Set repository variable \`GEMINI_ENABLE_REVIEW_ISSUES=true\`
            `;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });

  create-review-issues:
    if: |
      github.event_name == 'workflow_dispatch' ||
      vars.GEMINI_ENABLE_REVIEW_ISSUES != 'false'
    runs-on: ubuntu-latest
    name: Create Issues from Gemini Review

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Download Review Artifact
        uses: actions/download-artifact@v4
        with:
          name: review-result
          run-id: ${{ inputs.run_id }}
          path: .
          github-token: ${{ secrets.gh_token }}

      - name: Verify Artifact
        id: verify_artifact
        run: |
          if [ ! -f "review_result.json" ]; then
            echo "::error::Failed to download or find review_result.json artifact."
            echo "artifact_found=false" >> $GITHUB_OUTPUT
          else
            echo "::info::Artifact downloaded and verified successfully."
            echo "artifact_found=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Suggested Issues
        if: steps.verify_artifact.outputs.artifact_found == 'true'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          GH_TOKEN: ${{ secrets.gh_token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          pnpm tsx scripts/ci/run-create-review-issues.ts
