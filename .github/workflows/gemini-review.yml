name: Gemini Code Review
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Get PR Diff
        id: diff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr.diff
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get Additional Context
        id: context
        run: |
          # Get linked issue body
          ISSUE_NUMBER=$(gh pr view ${{ github.event.pull_request.number }} --json closingIssuesReferences --jq '.closingIssuesReferences[0].number')
          if [ -n "$ISSUE_NUMBER" ] && [ "$ISSUE_NUMBER" != "null" ]; then
            echo "Found linked issue: $ISSUE_NUMBER"
            ISSUE_BODY=$(gh issue view $ISSUE_NUMBER --json body --jq '.body')
            echo "LINKED_ISSUE_BODY<<EOF" >> $GITHUB_ENV
            echo "$ISSUE_BODY" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> $GITHUB_ENV
          else
            echo "No linked issue found."
            echo "LINKED_ISSUE_BODY=" >> $GITHUB_ENV
            echo "ISSUE_NUMBER=" >> $GITHUB_ENV
          fi
          # Get existing review comments from this bot (user 'arii')
          COMMENTS=$(gh pr view ${{ github.event.pull_request.number }} --json comments --jq '[.comments[] | select(.author.login == "arii") | .body] | .[]')
          if [ -n "$COMMENTS" ]; then
             echo "Found existing comments."
             # Format for prompt by joining with a separator
             FORMATTED_COMMENTS=$(echo "$COMMENTS" | paste -sd '---' -)
             echo "EXISTING_COMMENTS<<EOF" >> $GITHUB_ENV
             echo "$FORMATTED_COMMENTS" >> $GITHUB_ENV
             echo "EOF" >> $GITHUB_ENV
          else
             echo "No existing comments from bot found."
             echo "EXISTING_COMMENTS=" >> $GITHUB_ENV
          fi

          # Get PR Labels
          PR_LABELS=$(gh pr view ${{ github.event.pull_request.number }} --json labels --jq '[.labels[].name] | join(",")')
          echo "PR_LABELS=$PR_LABELS" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run Gemini Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKED_ISSUE_BODY: ${{ env.LINKED_ISSUE_BODY }}
          EXISTING_COMMENTS: ${{ env.EXISTING_COMMENTS }}
          PR_LABELS: ${{ env.PR_LABELS }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_DESCRIPTION: ${{ github.event.pull_request.body }}
          PR_DIFF_FILE: pr.diff
          REVIEW_CONTEXT_FILES: ${{ vars.REVIEW_CONTEXT_FILES || 'DEVELOPMENT.md,DESIGN_GUIDELINES.md,docs/audits/AUDIT_CODE_HYGIENE.md' }}
        run: |
          npx tsx scripts/gemini-client.ts \
            --preset review \
            --context "$REVIEW_CONTEXT_FILES" \
            --output "review_result.json"

      - name: Process Review Result
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ARI_PAT }}
          script: |
            const fs = require('fs');
            try {
              const result = JSON.parse(fs.readFileSync('review_result.json', 'utf8'));
              const { reviewComment, labels } = result;

              // Post the comment
              if (reviewComment) {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: reviewComment
                });
              }

              // Apply labels
              if (labels && labels.length > 0) {
                await github.rest.issues.addLabels({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  labels: labels
                });
              }

            } catch (e) {
              console.error('Error processing review result:', e);
              core.setFailed('Failed to process Gemini review result');
            }
