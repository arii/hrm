name: Gemini Code Review
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Get PR Diff
        id: diff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr.diff
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run Gemini Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_DESCRIPTION: ${{ github.event.pull_request.body }}
          PR_DIFF_FILE: pr.diff
        run: |
          npx tsx scripts/gemini-client.ts \
            --preset review \
            --context "DEVELOPMENT.md,DESIGN_GUIDELINES.md,docs/audits/AUDIT_CODE_HYGIENE.md" \
            --output "review_result.json"

      - name: Process Review Result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const result = JSON.parse(fs.readFileSync('review_result.json', 'utf8'));
              const { reviewComment, labels } = result;

              // Post the comment
              if (reviewComment) {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: reviewComment
                });
              }

              // Apply labels
              if (labels && labels.length > 0) {
                await github.rest.issues.addLabels({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  labels: labels
                });
              }

            } catch (e) {
              console.error('Error processing review result:', e);
              core.setFailed('Failed to process Gemini review result');
            }
