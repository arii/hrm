name: Gemini Code Review
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - run: pnpm install --frozen-lockfile

      - name: Get PR Diff
        id: diff
        run: |
          # Fetch the diff
          gh pr diff ${{ github.event.pull_request.number }} > pr.diff
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run Gemini Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_DESC: ${{ github.event.pull_request.body }}
        run: |
          # Limit diff size to avoid context limit
          head -c 50000 pr.diff > pr_trimmed.diff

          echo "Title: $PR_TITLE" > pr_context.txt
          echo "Description: $PR_DESC" >> pr_context.txt
          echo "Diff:" >> pr_context.txt
          cat pr_trimmed.diff >> pr_context.txt

          TASK_CONTENT=$(cat pr_context.txt)

          npx tsx scripts/gemini-client.ts \
            --task "Perform a code review on this Pull Request. $TASK_CONTENT" \
            --context "DEVELOPMENT.md,DESIGN_GUIDELINES.md,docs/audits/AUDIT_CODE_HYGIENE.md" \
            --output "review_result.md"

      - name: Post Review Comment
        uses: actions/github-script@v7
        with:
          script: |
             const fs = require('fs');
             try {
               const body = fs.readFileSync('review_result.md', 'utf8');
               await github.rest.issues.createComment({
                 issue_number: context.issue.number,
                 owner: context.repo.owner,
                 repo: context.repo.repo,
                 body: body
               });
             } catch (e) {
               console.log('No review result found');
             }
