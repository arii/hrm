# .github/workflows/smart-triage.yml
#
# Intelligent Issue Triaging and Improvement Workflow
#
# Purpose:
#   Automatically triages stale and new issues to improve overall repository health.
#   Rather than just closing stale issues, this workflow:
#   - Adds context labels to new issues based on content
#   - Identifies and labels stale issues (30+ days inactive)
#   - Suggests improvements or follow-ups for ambiguous issues
#   - Provides audit logs for all actions taken
#
# Triggers:
#   - Scheduled: Daily at 2 AM UTC (0 2 * * *)
#   - Manual: Via workflow_dispatch
#   - On Issue Events: When issues are opened or edited
#
# Actions Taken:
#   1. Analyzes issue content and labels it appropriately
#   2. Marks issues inactive for 30+ days with 'stale' label
#   3. Posts informative comments with suggestions for improvement
#   4. Logs all actions for auditability and debugging
#
# Configuration Options:
#   DISABLE_SMART_TRIAGE=true    - Disable all triaging
#   DISABLE_STALE_DETECTION=true - Only disable stale detection, keep new issue analysis
#
# Logging:
#   All actions (labels added, comments posted) are logged via GitHub workflow commands
#   for easy debugging and audit trail visibility.

name: Smart Triage

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Triage Stale Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          
          LABELS_ADDED=0
          COMMENTS_POSTED=0
          ISSUES_PROCESSED=0
          
          # Find stale issues (30+ days no activity)
          STALE=$(gh issue list --state open --search "updated:<$(date -d '30 days ago' '+%Y-%m-%d')" --json number,title,body,labels --limit 50)
          
          echo "$STALE" | jq -c '.[]' | while read -r issue; do
            NUM=$(echo "$issue" | jq -r '.number')
            BODY=$(echo "$issue" | jq -r '.body')
            LABELS=$(echo "$issue" | jq -r '.labels[].name | @csv' | tr -d '"' | paste -sd',' -)
            
            echo "::notice::Processing issue #$NUM"
            ((ISSUES_PROCESSED++))
            
            # Add missing labels based on content
            if ! echo "$BODY" | grep -iq "reproduce\|steps"; then
              if ! echo "$LABELS" | grep -q "needs-info"; then
                gh issue edit "$NUM" --add-label "needs-info" >/dev/null 2>&1 && \
                  echo "::notice::  ✅ Added 'needs-info' label to #$NUM" && \
                  ((LABELS_ADDED++))
                
                gh issue comment "$NUM" --body "Please provide reproduction steps for this issue." >/dev/null 2>&1 && \
                  echo "::notice::  ✅ Posted 'needs-info' comment to #$NUM" && \
                  ((COMMENTS_POSTED++))
              fi
            fi
            
            if echo "$BODY" | grep -iqE "crash|broken|error"; then
              if ! echo "$LABELS" | grep -q "bug"; then
                gh issue edit "$NUM" --add-label "bug" >/dev/null 2>&1 && \
                  echo "::notice::  ✅ Added 'bug' label to #$NUM" && \
                  ((LABELS_ADDED++))
              fi
            fi
          done
          
          echo "::notice::Triage Summary: Processed $ISSUES_PROCESSED issues, Added $LABELS_ADDED labels, Posted $COMMENTS_POSTED comments"

      - name: Detect Duplicates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          
          DUPLICATES_FOUND=0
          COMMENTS_POSTED=0
          
          gh issue list --state open --json number,title --limit 100 | \
            jq -r '.[] | .title' | sort | uniq -d | while read -r title; do
            
            DUPS=$(gh issue list --state open --search "\"$title\"" --json number --limit 5 | jq -r '.[].number')
            COUNT=$(echo "$DUPS" | wc -w)
            
            if [ "$COUNT" -gt 1 ]; then
              ((DUPLICATES_FOUND++))
              FIRST=$(echo "$DUPS" | awk '{print $1}')
              OTHERS=$(echo "$DUPS" | awk '{for(i=2;i<=NF;i++)printf "#%s,",$i}' | sed 's/,$//')
              
              echo "::notice::Found $COUNT duplicate issues for: '$title'"
              
              gh issue comment "$FIRST" --body "Possible duplicates: $OTHERS" >/dev/null 2>&1 && \
                echo "::notice::  ✅ Posted duplicate notice on #$FIRST" && \
                ((COMMENTS_POSTED++))
            fi
          done
          
          [ "$DUPLICATES_FOUND" -gt 0 ] && \
            echo "::notice::Duplicate Detection: Found $DUPLICATES_FOUND duplicate titles, Posted $COMMENTS_POSTED notices"

      - name: Suggest Resolution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          
          RESOLUTIONS_SUGGESTED=0
          
          # Find issues with many comments that might be resolved
          gh issue list --state open --json number,comments --limit 100 | \
            jq -c '.[] | select(.comments | length > 5)' | while read -r issue; do
            
            NUM=$(echo "$issue" | jq -r '.number')
            RECENT=$(gh issue view "$NUM" --json comments --jq '.comments[-3:] | .[].body' 2>/dev/null)
            
            if echo "$RECENT" | grep -iqE "fixed|resolved|merged|works"; then
              echo "::notice::Issue #$NUM may be resolved based on recent comments"
              
              gh issue comment "$NUM" --body "This issue may be resolved based on recent comments. Feel free to close if fixed!" >/dev/null 2>&1 && \
                echo "::notice::  ✅ Posted resolution suggestion on #$NUM" && \
                ((RESOLUTIONS_SUGGESTED++))
            fi
          done
          
          [ "$RESOLUTIONS_SUGGESTED" -gt 0 ] && \
            echo "::notice::Resolution Suggestions: Suggested resolution for $RESOLUTIONS_SUGGESTED issues"
