name: Test GitHub Actions

on:
  push:
    paths:
      - '.github/actions/sanitize-string/**'
      - '.github/workflows/test-actions.yml'
  pull_request:
    paths:
      - '.github/actions/sanitize-string/**'
      - '.github/workflows/test-actions.yml'

jobs:
  test-sanitize-action:
    name: Test Sanitize String Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test - Special Chars and Truncation
        id: test_special_chars
        uses: ./.github/actions/sanitize-string
        with:
          value: 'feature/test-branch/with_special-chars!@#$%^&*()'
          max-length: '30'

      - name: Test - Empty String
        id: test_empty
        uses: ./.github/actions/sanitize-string
        with:
          value: ''
          max-length: '64'

      - name: Test - Already Sanitized
        id: test_clean
        uses: ./.github/actions/sanitize-string
        with:
          value: 'clean-string-123'
          max-length: '64'

      - name: Test - Shorter than Max Length
        id: test_short
        uses: ./.github/actions/sanitize-string
        with:
          value: 'short/string'
          max-length: '64'

      - name: Test - Duplicate Hyphens
        id: test_dupes
        uses: ./.github/actions/sanitize-string
        with:
          value: 'feature//branch'
          max-length: '64'

      - name: Test - Trailing Hyphen
        id: test_trailing
        uses: ./.github/actions/sanitize-string
        with:
          value: 'feature/branch-'
          max-length: '64'

      - name: Test - At Max Length
        id: test_max
        uses: ./.github/actions/sanitize-string
        with:
          value: 'a-very-long-string-that-is-exactly-64-characters-long-and-valid'
          max-length: '64'

      - name: Test - Only Invalid Chars
        id: test_invalid
        uses: ./.github/actions/sanitize-string
        with:
          value: '!@#$%^&*()'
          max-length: '64'

      - name: Test - Leading/Trailing Invalid Chars
        id: test_leading_trailing
        uses: ./.github/actions/sanitize-string
        with:
          value: '!!test-branch!!'
          max-length: '64'

      - name: Verify All Results
        env:
          RES_SPECIAL: ${{ steps.test_special_chars.outputs.sanitized-value }}
          RES_EMPTY: ${{ steps.test_empty.outputs.sanitized-value }}
          RES_CLEAN: ${{ steps.test_clean.outputs.sanitized-value }}
          RES_SHORT: ${{ steps.test_short.outputs.sanitized-value }}
          RES_DUPES: ${{ steps.test_dupes.outputs.sanitized-value }}
          RES_TRAILING: ${{ steps.test_trailing.outputs.sanitized-value }}
          RES_MAX: ${{ steps.test_max.outputs.sanitized-value }}
          RES_INVALID: ${{ steps.test_invalid.outputs.sanitized-value }}
          RES_LEADING_TRAILING: ${{ steps.test_leading_trailing.outputs.sanitized-value }}
        run: |
          errors=0

          check_result() {
            local name=$1
            local actual=$2
            local expected=$3
            if [ "$actual" != "$expected" ]; then
              echo "❌ Test Failed: $name"
              echo "   Expected: '$expected'"
              echo "   Actual:   '$actual'"
              errors=$((errors + 1))
            else
              echo "✅ Test Passed: $name"
            fi
          }

          check_result "Special Chars and Truncation" "$RES_SPECIAL" "feature-test-branch-with_speci"
          check_result "Empty String" "$RES_EMPTY" ""
          check_result "Already Sanitized" "$RES_CLEAN" "clean-string-123"
          check_result "Shorter than Max Length" "$RES_SHORT" "short-string"
          check_result "Duplicate Hyphens" "$RES_DUPES" "feature-branch"
          check_result "Trailing Hyphen" "$RES_TRAILING" "feature-branch"
          check_result "At Max Length" "$RES_MAX" "a-very-long-string-that-is-exactly-64-characters-long-and-valid"
          check_result "Only Invalid Chars" "$RES_INVALID" ""
          check_result "Leading/Trailing Invalid Chars" "$RES_LEADING_TRAILING" "test-branch"

          if [ $errors -ne 0 ]; then
            echo "---"
            echo "❌ Total Failures: $errors"
            exit 1
          fi
