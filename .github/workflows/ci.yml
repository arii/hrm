name: CI

on:
  push:
    branches: [ leader ]
  pull_request:
    branches: [ leader ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run linter
        run: pnpm run lint
      - name: Run unit tests
        run: pnpm run test:unit
      - name: Build project
        run: pnpm run build
