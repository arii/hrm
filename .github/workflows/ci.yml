name: Continuous Integration

on:
  push:
    branches: [leader]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Lint
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Lint Code
        run: pnpm run lint

  build:
    name: 🏗️ Build
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Verify Build
        run: pnpm run build

  unit-tests:
    name: 🧪 Unit Tests
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Run Unit Tests
        run: ./scripts/ci/run-unit-tests.sh
        continue-on-error: true
      - name: Publish Unit Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests Report
          path: test-results/unit-results.xml
          reporter: java-junit
      - name: Upload Logs & Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            logs/
            test-results/
          retention-days: 7

  visual-tests:
    name: 🧪 Visual Tests
    runs-on: self-hosted
    needs: [build]
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Verify Build
        run: pnpm run build
      - name: Run Visual Tests
        run: ./scripts/ci/run-visual-tests.sh
        continue-on-error: true
      - name: Publish Visual Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Visual Tests Report
          path: test-results/results.xml
          reporter: java-junit
      - name: Merge Playwright Reports
        if: always()
        run: npx playwright merge-reports --reporter html ./blob-report
      - name: Upload Logs & Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-test-results
          path: |
            logs/
            test-results/
            blob-report/
            playwright-report/
          retention-days: 7

  ci-gate:
    name: ✅ CI Gate
    runs-on: ubuntu-latest
    needs: [lint, build, unit-tests, visual-tests]
    steps:
      - name: All checks passed
        run: echo "All CI checks passed successfully."
