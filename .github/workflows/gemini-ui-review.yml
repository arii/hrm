name: Gemini UI Review

on:
  workflow_call:
  issue_comment:
    types: [created]

jobs:
  ui-review:
    if: |
      (github.event_name == 'workflow_call') ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '@gemini-ui-review'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Set Deployment URL
        id: deploy-url
        run: |
          # Try to get the target URL from the latest deployment if possible
          # Default to localhost:3000 if not found
          URL=$(gh pr view ${{ github.event.issue.number || github.event.pull_request.number }} --json headRefName --jq '.headRefName' | xargs -I {} gh api repos/${{ github.repository }}/deployments?ref={} --jq '.[0].id' | xargs -I {} gh api repos/${{ github.repository }}/deployments/{}/statuses --jq '.[0].target_url' 2>/dev/null || echo "http://localhost:3000")
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start App (if no deployment URL)
        if: steps.deploy-url.outputs.url == 'http://localhost:3000'
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'a-super-long-and-secure-secret-for-ci-tests' }}
          SPOTIFY_CLIENT_ID: 'test_client_id'
          SPOTIFY_CLIENT_SECRET: 'test_client_secret'
        run: |
          pnpm run build
          bash scripts/start-production.sh &
          npx wait-on http://localhost:3000/api/health/simple --timeout 120000

      - name: Run UI Review Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          DEPLOYMENT_URL: ${{ steps.deploy-url.outputs.url }}
        run: npx tsx scripts/ci/run-ui-review.ts
