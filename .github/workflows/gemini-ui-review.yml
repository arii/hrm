name: Gemini UI Review

on:
  workflow_call:
  issue_comment:
    types: [created]

jobs:
  ui-review:
    if: |
      (github.event_name == 'workflow_call') ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '@gemini-ui-review'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Get Deployment URL
        id: deploy-url
        run: |
          PR_NUMBER=${{ github.event.issue.number || github.event.pull_request.number }}
          BRANCH=$(gh pr view "$PR_NUMBER" --json headRefName --jq '.headRefName')

          # Try to find target_url from the most recent deployment status for this branch
          URL=$(gh api "repos/${{ github.repository }}/deployments?ref=$BRANCH" --jq '.[0].id' | xargs -I {} gh api "repos/${{ github.repository }}/deployments/{}/statuses" --jq 'map(select(.state == "success")) | .[0].target_url' 2>/dev/null || true)

          if [ -z "$URL" ] || [ "$URL" == "null" ]; then
            echo "::error::No successful deployment found for branch $BRANCH. UI Review requires a preview environment."
            exit 1
          fi

          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run UI Review Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          DEPLOYMENT_URL: ${{ steps.deploy-url.outputs.url }}
        run: npx tsx scripts/ci/run-ui-review.ts
