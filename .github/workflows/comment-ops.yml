name: Bot Command Orchestrator

on:
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ (github.event.issue && github.event.issue.number) || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  actions: write

jobs:
  router:
    name: 🔍 Route Comment
    if: github.event.issue && github.event.issue.pull_request
    runs-on: ubuntu-latest
    outputs:
      is_review: ${{ steps.route.outputs.is_review }}
      is_squash: ${{ steps.route.outputs.is_squash }}
      is_resolve: ${{ steps.route.outputs.is_resolve }}
    steps:
      - id: route
        env:
          BODY: ${{ (github.event.comment && github.event.comment.body) || '' }}
        run: |
          if echo "$BODY" | grep -q "^@gemini-bot"; then echo "is_review=true" >> $GITHUB_OUTPUT; fi
          if echo "$BODY" | grep -q "@pr-squash"; then echo "is_squash=true" >> $GITHUB_OUTPUT; fi
          if echo "$BODY" | grep -q "@conflict-resolve"; then echo "is_resolve=true" >> $GITHUB_OUTPUT; fi

  execute-review:
    needs: [router]
    if: needs.router.outputs.is_review == 'true' && (github.event.issue && github.event.issue.number && github.event.issue.number != 0)
    uses: ./.github/workflows/reusable-gemini-review.yml
    with:
      pr_quality_result: 'not_applicable'
      trigger_event: 'comment'
      comment_body: ${{ (github.event.comment && github.event.comment.body) || '' }}
      pr_number: ${{ github.event.issue.number }}
    secrets: inherit

  execute-squash:
    needs: [router]
    if: needs.router.outputs.is_squash == 'true' && (github.event.issue && github.event.issue.number && github.event.issue.number != 0)
    uses: ./.github/workflows/pr-squash.yml
    with:
      pr_number: ${{ github.event.issue.number }}
      comment_body: ${{ (github.event.comment && github.event.comment.body) || '' }}
      comment_id: ${{ (github.event.comment && github.event.comment.id) || 0 }}
    secrets: inherit

  # Restoring conflict resolution logic from gemini-orchestrator.yml
  prepare-resolve:
    needs: [router]
    if: needs.router.outputs.is_resolve == 'true'
    runs-on: ubuntu-latest
    env:
      PR_NUMBER_RAW: ${{ (github.event.issue && github.event.issue.number) || 0 }}
    outputs:
      target_branch: ${{ steps.get_branches.outputs.target_branch }}
      source_branch: ${{ steps.get_branches.outputs.source_branch }}
      should_run: ${{ steps.validate.outputs.should_run }}
    steps:
      - name: Validate Context
        id: validate
        run: |
          if [ "$PR_NUMBER_RAW" == "0" ] || [ -z "$PR_NUMBER_RAW" ]; then
            echo "::warning::Missing or invalid PR_NUMBER ($PR_NUMBER_RAW). Skipping job."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Add reaction to comment
        if: steps.validate.outputs.should_run == 'true' && (github.event.comment && github.event.comment.id && github.event.comment.id != 0)
        uses: peter-evans/create-reaction@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-id: ${{ github.event.comment.id }}
          reaction: eyes
      - name: Get PR Details
        if: steps.validate.outputs.should_run == 'true'
        id: get_branches
        uses: actions/github-script@v7
        env:
          PR_NUMBER_RAW: ${{ env.PR_NUMBER_RAW }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER_RAW) || (context.payload.pull_request && context.payload.pull_request.number) || (context.payload.issue && context.payload.issue.number) || context.issue?.number || 0;
            if (!prNumber) {
              console.log('Could not determine PR number. Skipping.');
              return;
            }
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('target_branch', pr.data.base.ref);
            core.setOutput('source_branch', pr.data.head.ref);

  execute-resolve:
    needs: [router, prepare-resolve]
    if: needs.router.outputs.is_resolve == 'true' && needs.prepare-resolve.outputs.should_run == 'true'
    uses: ./.github/workflows/conflict-resolver.yml
    with:
      target_branch: ${{ needs.prepare-resolve.outputs.target_branch }}
      source_branch: ${{ needs.prepare-resolve.outputs.source_branch }}
      pr_number: ${{ (github.event.issue && github.event.issue.number) || 0 }}
    secrets: inherit
