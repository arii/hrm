name: 'Auto Conflict Resolver'

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'The branch to merge into'
        required: true
        default: 'leader'
      source_branch:
        description: 'The branch to merge from'
        required: true

jobs:
  merge_and_resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c feature/auto-resolve-${{ github.event.inputs.source_branch }}-into-${{ github.event.inputs.target_branch }}

      - name: Merge source branch
        run: |
          git fetch origin ${{ github.event.inputs.source_branch }}
          git merge origin/${{ github.event.inputs.source_branch }} --no-commit --no-ff || true

      - name: Resolve conflicts
        id: resolve
        uses: VeyronSakai/conflict-resolver@bf5816eeef0c15149d7288aef1a9c94a5218ee6f # pin to v0.4.0
        with:
          config-path: .github/conflict-resolver.yml

      - name: Handle resolution results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNRESOLVED_FILES: ${{ steps.resolve.outputs.unresolved-files }}
        run: |
          git add .
          git commit -m "Auto-resolve merge conflicts from ${{ github.event.inputs.source_branch }}"
          git push --force -u origin feature/auto-resolve-${{ github.event.inputs.source_branch }}-into-${{ github.event.inputs.target_branch }}
          NEW_PR_URL=$(gh pr create \
            --title "Merge ${{ github.event.inputs.source_branch }} with auto-resolved conflicts" \
            --body "This PR was automatically generated after resolving merge conflicts." \
            --base ${{ github.event.inputs.target_branch }} \
            --head feature/auto-resolve-${{ github.event.inputs.source_branch }}-into-${{ github.event.inputs.target_branch }})
          echo "NEW_PR_URL=$NEW_PR_URL" >> $GITHUB_ENV

      - name: Update comment on success
        if: success() && steps.resolve.outputs.unresolved-files == '' && github.event.inputs.pr_number
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.inputs.pr_number }}
          body: |
            ✅ Successfully resolved all conflicts. A new pull request has been created: ${{ env.NEW_PR_URL }}
            <!-- id: conflict-resolver-bot -->
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update comment on failure
        if: failure() || (success() && steps.resolve.outputs.unresolved-files != '')
        uses: peter-evans/create-or-update-comment@v4
        env:
          UNRESOLVED_FILES: ${{ steps.resolve.outputs.unresolved-files }}
        with:
          issue-number: ${{ github.event.inputs.pr_number }}
          body: |
            ❌ **Error: Unable to automatically resolve all conflicts.**
            The following files have unresolved conflicts:
            ```
            ${{ env.UNRESOLVED_FILES }}
            ```
            Please resolve these conflicts manually.
            <!-- id: conflict-resolver-bot -->
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail the workflow if conflicts were not resolved
        if: steps.resolve.outputs.unresolved-files != ''
        run: |
          echo "Workflow failed because unresolved conflicts remain."
          exit 1
