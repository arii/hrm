name: Gemini Manual Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to review (leave empty for current PR context)'
        required: false
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    # Trigger on manual dispatch OR on @gemini comment on a PR
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@gemini'))
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine PR Number
        id: pr_info
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual dispatch: use provided PR number or derive from context
            PR_NUMBER="${{ inputs.pr_number }}"
            if [ -z "$PR_NUMBER" ]; then
              # If no PR number provided and we're in workflow_dispatch without branch context,
              # we'll need to fail gracefully
              echo "::error::PR number required for manual dispatch workflow_dispatch"
              exit 1
            fi
          else
            # Comment trigger: extract from issue context
            PR_NUMBER="${{ github.event.issue.number }}"
          fi
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_OUTPUT
        shell: bash

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies with fallback
        id: install
        continue-on-error: true
        run: |
          if ! pnpm install --frozen-lockfile; then
            echo "LOCKFILE_MISMATCH=true" >> $GITHUB_ENV
            pnpm install && echo "INSTALL_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "INSTALL_SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Post Review Started Comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ARI_PAT }}
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 Gemini manual review requested. Starting analysis...'
            });

      - name: Analyze PR Change Patterns
        id: analyze_changes
        env:
          PR_NUMBER: ${{ steps.pr_info.outputs.PR_NUMBER }}
        run: |
          # Fetch PR details using gh CLI
          PR_JSON=$(gh pr view "$PR_NUMBER" --json commits,files,baseRefOid,headRefOid)
          
          # Get commit SHAs for diff
          BASE_SHA=$(echo "$PR_JSON" | jq -r '.baseRefOid')
          HEAD_SHA=$(echo "$PR_JSON" | jq -r '.headRefOid')
          
          # Count total files changed
          FILES_CHANGED=$(echo "$PR_JSON" | jq '.files | length')
          
          # Calculate LOC changed
          DIFF_STATS=$(git diff --shortstat "$BASE_SHA".."$HEAD_SHA" || echo "0 files changed")
          LOC_CHANGED=$(echo "$DIFF_STATS" | grep -oP '\d+(?= insertion)' || echo "0")
          LOC_DELETED=$(echo "$DIFF_STATS" | grep -oP '\d+(?= deletion)' || echo "0")
          TOTAL_LOC=$((LOC_CHANGED + LOC_DELETED))
          
          # Determine review depth based on size
          if [ $TOTAL_LOC -lt 100 ]; then
            REVIEW_DEPTH="detailed"
          elif [ $TOTAL_LOC -lt 400 ]; then
            REVIEW_DEPTH="standard"
          else
            REVIEW_DEPTH="focused"
          fi
          
          echo "FILES_CHANGED=$FILES_CHANGED" >> $GITHUB_ENV
          echo "TOTAL_LOC=$TOTAL_LOC" >> $GITHUB_ENV
          echo "REVIEW_DEPTH=$REVIEW_DEPTH" >> $GITHUB_ENV
          
          # Identify file types and architectural areas
          git diff --name-only "$BASE_SHA".."$HEAD_SHA" | \
            awk -F/ '{print $1}' | sort | uniq > changed_areas.txt
          
          CHANGED_AREAS=$(cat changed_areas.txt | tr '\n' ',' | sed 's/,$//')
          echo "CHANGED_AREAS=$CHANGED_AREAS" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get PR Diff with Context
        id: diff
        env:
          PR_NUMBER: ${{ steps.pr_info.outputs.PR_NUMBER }}
        run: |
          gh pr diff "$PR_NUMBER" --patch > pr.diff
          gh pr diff "$PR_NUMBER" > pr_summary.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Gather Review History
        id: review_history
        env:
          PR_NUMBER: ${{ steps.pr_info.outputs.PR_NUMBER }}
        run: |
          PREVIOUS_REVIEWS=$(gh pr view "$PR_NUMBER" \
            --json comments \
            --jq '[.comments[] | select(.author.login == "arii") | {body: .body, createdAt: .createdAt}]')
          
          echo "PREVIOUS_REVIEWS<<EOF" >> $GITHUB_ENV
          echo "$PREVIOUS_REVIEWS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          REVIEW_COUNT=$(echo "$PREVIOUS_REVIEWS" | jq '. | length')
          echo "REVIEW_COUNT=$REVIEW_COUNT" >> $GITHUB_ENV
          
          RESOLVED_COUNT=$(gh pr view "$PR_NUMBER" \
            --json reviewThreads \
            --jq '[.reviewThreads[] | select(.isResolved == true)] | length' || echo "0")
          echo "RESOLVED_COUNT=$RESOLVED_COUNT" >> $GITHUB_ENV
          
          CHANGES_REQUESTED=$(gh pr view "$PR_NUMBER" \
            --json reviews \
            --jq '[.reviews[] | select(.state == "CHANGES_REQUESTED")] | length')
          echo "CHANGES_REQUESTED=$CHANGES_REQUESTED" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get Issue Context
        id: context
        env:
          PR_NUMBER: ${{ steps.pr_info.outputs.PR_NUMBER }}
        run: |
          ISSUE_NUMBER=$(gh pr view "$PR_NUMBER" \
            --json closingIssuesReferences \
            --jq '.closingIssuesReferences[0].number' || echo "")
          
          if [ -n "$ISSUE_NUMBER" ] && [ "$ISSUE_NUMBER" != "null" ]; then
            ISSUE_BODY=$(gh issue view "$ISSUE_NUMBER" --json body --jq '.body')
            ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title')
            ISSUE_LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '[.labels[].name] | join(",")')
            
            echo "LINKED_ISSUE_BODY<<EOF" >> $GITHUB_ENV
            echo "$ISSUE_BODY" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> $GITHUB_ENV
            echo "ISSUE_TITLE=$ISSUE_TITLE" >> $GITHUB_ENV
            echo "ISSUE_LABELS=$ISSUE_LABELS" >> $GITHUB_ENV
          else
            echo "LINKED_ISSUE_BODY=" >> $GITHUB_ENV
            echo "ISSUE_NUMBER=" >> $GITHUB_ENV
          fi
          
          PR_LABELS=$(gh pr view "$PR_NUMBER" \
            --json labels \
            --jq '[.labels[].name] | join(",")')
          echo "PR_LABELS=$PR_LABELS" >> $GITHUB_ENV
          
          COMMIT_MESSAGES=$(gh pr view "$PR_NUMBER" \
            --json commits \
            --jq '[.commits[].commit.message] | join("\n---\n")')
          echo "COMMIT_MESSAGES<<EOF" >> $GITHUB_ENV
          echo "$COMMIT_MESSAGES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check for Test Changes
        id: test_coverage
        env:
          PR_NUMBER: ${{ steps.pr_info.outputs.PR_NUMBER }}
        run: |
          # Get base and head SHAs
          PR_JSON=$(gh pr view "$PR_NUMBER" --json baseRefOid,headRefOid)
          BASE_SHA=$(echo "$PR_JSON" | jq -r '.baseRefOid')
          HEAD_SHA=$(echo "$PR_JSON" | jq -r '.headRefOid')
          
          TEST_FILES=$(git diff --name-only "$BASE_SHA".."$HEAD_SHA" | \
            grep -E '(test|spec|__tests__|\.test\.|\.spec\.)' || echo "")
          
          if [ -n "$TEST_FILES" ]; then
            echo "HAS_TEST_CHANGES=true" >> $GITHUB_ENV
            echo "TEST_FILES<<EOF" >> $GITHUB_ENV
            echo "$TEST_FILES" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "HAS_TEST_CHANGES=false" >> $GITHUB_ENV
          fi
          
          SOURCE_FILES=$(git diff --name-only "$BASE_SHA".."$HEAD_SHA" | \
            grep -E '\.(ts|tsx|js|jsx)$' | \
            grep -v -E '(test|spec|__tests__|\.test\.|\.spec\.)' || echo "")
          
          if [ -n "$SOURCE_FILES" ] && [ "$(cat /dev/null 2>/dev/null || echo false)" == "false" ]; then
            echo "MISSING_TESTS=true" >> $GITHUB_ENV
          else
            echo "MISSING_TESTS=false" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run Intelligent Gemini Review
        id: gemini
        if: env.INSTALL_SUCCESS == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ steps.pr_info.outputs.PR_NUMBER }}
          PR_TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
          PR_DESCRIPTION: ${{ github.event.pull_request.body || github.event.issue.body }}
          PR_LABELS: ${{ env.PR_LABELS }}
          FILES_CHANGED: ${{ env.FILES_CHANGED }}
          TOTAL_LOC: ${{ env.TOTAL_LOC }}
          REVIEW_DEPTH: ${{ env.REVIEW_DEPTH }}
          CHANGED_AREAS: ${{ env.CHANGED_AREAS }}
          REVIEW_COUNT: ${{ env.REVIEW_COUNT }}
          RESOLVED_COUNT: ${{ env.RESOLVED_COUNT }}
          CHANGES_REQUESTED: ${{ env.CHANGES_REQUESTED }}
          PREVIOUS_REVIEWS: ${{ env.PREVIOUS_REVIEWS }}
          LINKED_ISSUE_BODY: ${{ env.LINKED_ISSUE_BODY }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          ISSUE_TITLE: ${{ env.ISSUE_TITLE }}
          ISSUE_LABELS: ${{ env.ISSUE_LABELS }}
          COMMIT_MESSAGES: ${{ env.COMMIT_MESSAGES }}
          HAS_TEST_CHANGES: ${{ env.HAS_TEST_CHANGES }}
          MISSING_TESTS: ${{ env.MISSING_TESTS }}
          TEST_FILES: ${{ env.TEST_FILES }}
          REVIEW_CONTEXT_FILES: ${{ vars.REVIEW_CONTEXT_FILES || 'DEVELOPMENT.md,DESIGN_GUIDELINES.md,docs/audits/AUDIT_CODE_HYGIENE.md' }}
          PR_DIFF_FILE: pr.diff
        run: |
          npx tsx scripts/gemini-client.ts \
            --preset review \
            --context "$REVIEW_CONTEXT_FILES" \
            --output "review_result.json"

      - name: Process Review Result
        if: steps.gemini.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr_info.outputs.PR_NUMBER }}
        with:
          github-token: ${{ secrets.ARI_PAT }}
          script: |
            const fs = require('fs');
            
            if (!fs.existsSync('review_result.json')) {
              console.log('No review result file found.');
              return;
            }
            
            const result = JSON.parse(fs.readFileSync('review_result.json', 'utf8'));
            let { reviewComment, labels } = result;
            
            const reviewType = process.env.REVIEW_COUNT === '0' ? 'initial' : `revision #${parseInt(process.env.REVIEW_COUNT) + 1}`;
            const filesChanged = process.env.FILES_CHANGED;
            const totalLoc = process.env.TOTAL_LOC;
            
            let header = `## 🤖 Gemini Code Review (${reviewType})\n\n`;
            header += `📊 **Change Summary:** ${filesChanged} files, ~${totalLoc} LOC\n`;
            header += `🎯 **Review Depth:** ${process.env.REVIEW_DEPTH}\n`;
            header += `📁 **Areas Changed:** ${process.env.CHANGED_AREAS}\n\n`;
            
            if (process.env.MISSING_TESTS === 'true') {
              header += `⚠️ **Test Coverage:** Source code changed without corresponding test updates.\n\n`;
            }
            
            if (!reviewComment || reviewComment.trim() === '') {
              reviewComment = `### ✅ Verification Complete\n\nNo significant issues found in this review.\n\n- **Verified:** Code changes align with requirements.\n- **Regressions:** None detected.\n- **Verdict:** Ready for approval.`;
            }
            
            reviewComment = header + reviewComment;
            
            if (reviewComment) {
              await github.rest.issues.createComment({
                issue_number: process.env.PR_NUMBER,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: reviewComment
              });
            }
            
            if (labels && labels.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  issue_number: process.env.PR_NUMBER,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  labels: labels
                });
              } catch (e) {
                console.log('Could not add labels:', e.message);
              }
            }

      - name: Handle Review Failure
        if: steps.gemini.outcome == 'failure'
        env:
          PR_NUMBER: ${{ steps.pr_info.outputs.PR_NUMBER }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ARI_PAT }}
          script: |
            const failureComment = '## Gemini Review Status\n\n**Status**: Review Failed\n\nThe review process encountered an error. Please check the workflow logs for details.';
            
            await github.rest.issues.createComment({
              issue_number: process.env.PR_NUMBER,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: failureComment
            });
