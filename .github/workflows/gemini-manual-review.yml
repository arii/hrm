name: Gemini Manual Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to review (leave empty for current PR context)'
        required: false
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    # Trigger on manual dispatch OR on @gemini comment on a PR
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@gemini'))
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine PR Number
        id: pr_info
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual dispatch: use provided PR number or derive from context
            PR_NUMBER="${{ inputs.pr_number }}"
            if [ -z "$PR_NUMBER" ]; then
              # If no PR number provided and we're in workflow_dispatch without branch context,
              # we'll need to fail gracefully
              echo "::error::PR number required for manual dispatch workflow_dispatch"
              exit 1
            fi
          else
            # Comment trigger: extract from issue context
            PR_NUMBER="${{ github.event.issue.number }}"
          fi
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_OUTPUT
        shell: bash

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies with fallback
        id: install
        run: |
          set -e
          if pnpm install --frozen-lockfile 2>&1; then
            echo "INSTALL_SUCCESS=true" >> $GITHUB_ENV
            echo "Installation successful with frozen lockfile"
          else
            echo "⚠️ Frozen lockfile mismatch detected, attempting flexible install..."
            if pnpm install 2>&1; then
              echo "INSTALL_SUCCESS=true" >> $GITHUB_ENV
              echo "LOCKFILE_MISMATCH=true" >> $GITHUB_ENV
              echo "Installation successful with flexible lockfile"
            else
              echo "INSTALL_SUCCESS=false" >> $GITHUB_ENV
              echo "::error::Failed to install dependencies. Check lockfile and package.json"
              exit 1
            fi
          fi

      - name: Post Review Started Comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ARI_PAT }}
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 Gemini manual review requested. Starting analysis...'
            });

      - name: Analyze PR Change Patterns
        id: analyze_changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          PR_NUMBER="${{ steps.pr_info.outputs.PR_NUMBER }}"
          
          # Fetch PR details with error handling
          if ! PR_JSON=$(gh pr view "$PR_NUMBER" --json commits,files,baseRefOid,headRefOid 2>&1); then
            echo "::error::Failed to fetch PR details for #$PR_NUMBER"
            exit 1
          fi
          
          # Get commit SHAs for diff
          BASE_SHA=$(echo "$PR_JSON" | jq -r '.baseRefOid')
          HEAD_SHA=$(echo "$PR_JSON" | jq -r '.headRefOid')
          
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ] || [ "$BASE_SHA" == "null" ] || [ "$HEAD_SHA" == "null" ]; then
            echo "::error::Failed to extract commit SHAs from PR"
            exit 1
          fi
          
          # Count total files changed
          FILES_CHANGED=$(echo "$PR_JSON" | jq '.files | length')
          
          # Calculate LOC changed with robust error handling
          DIFF_STATS=$(git diff --shortstat "$BASE_SHA".."$HEAD_SHA" 2>/dev/null || echo "0 files changed")
          LOC_CHANGED=$(echo "$DIFF_STATS" | grep -oP '\d+(?= insertion)' || echo "0")
          LOC_DELETED=$(echo "$DIFF_STATS" | grep -oP '\d+(?= deletion)' || echo "0")
          TOTAL_LOC=$((LOC_CHANGED + LOC_DELETED))
          
          # Determine review depth based on size
          if [ "$TOTAL_LOC" -lt 100 ]; then
            REVIEW_DEPTH="detailed"
          elif [ "$TOTAL_LOC" -lt 400 ]; then
            REVIEW_DEPTH="standard"
          else
            REVIEW_DEPTH="focused"
          fi
          
          echo "FILES_CHANGED=$FILES_CHANGED" >> $GITHUB_ENV
          echo "TOTAL_LOC=$TOTAL_LOC" >> $GITHUB_ENV
          echo "REVIEW_DEPTH=$REVIEW_DEPTH" >> $GITHUB_ENV
          
          # Identify file types and architectural areas
          git diff --name-only "$BASE_SHA".."$HEAD_SHA" 2>/dev/null | \
            awk -F/ '{print $1}' | sort | uniq > changed_areas.txt
          
          CHANGED_AREAS=$(cat changed_areas.txt | tr '\n' ',' | sed 's/,$//')
          echo "CHANGED_AREAS=$CHANGED_AREAS" >> $GITHUB_ENV

      - name: Get PR Diff with Context
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          PR_NUMBER="${{ steps.pr_info.outputs.PR_NUMBER }}"
          
          if ! gh pr diff "$PR_NUMBER" --patch > pr.diff 2>&1; then
            echo "::error::Failed to retrieve PR diff"
            exit 1
          fi
          
          if ! gh pr diff "$PR_NUMBER" > pr_summary.txt 2>&1; then
            echo "::warning::Failed to retrieve PR summary"
          fi

      - name: Gather Review History
        id: review_history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          PR_NUMBER="${{ steps.pr_info.outputs.PR_NUMBER }}"
          
          # Extract review history (generalized for any user - not just "arii")
          PREVIOUS_REVIEWS=$(gh pr view "$PR_NUMBER" \
            --json comments \
            --jq '[.comments[]] | length' 2>/dev/null || echo "0")
          
          echo "REVIEW_COUNT=$PREVIOUS_REVIEWS" >> $GITHUB_ENV
          
          # Extract resolved conversation count
          RESOLVED_COUNT=$(gh pr view "$PR_NUMBER" \
            --json reviewThreads \
            --jq '[.reviewThreads[] | select(.isResolved == true)] | length' 2>/dev/null || echo "0")
          echo "RESOLVED_COUNT=$RESOLVED_COUNT" >> $GITHUB_ENV
          
          # Extract changes requested count
          CHANGES_REQUESTED=$(gh pr view "$PR_NUMBER" \
            --json reviews \
            --jq '[.reviews[] | select(.state == "CHANGES_REQUESTED")] | length' 2>/dev/null || echo "0")
          echo "CHANGES_REQUESTED=$CHANGES_REQUESTED" >> $GITHUB_ENV

      - name: Get Issue Context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          PR_NUMBER="${{ steps.pr_info.outputs.PR_NUMBER }}"
          
          # Retrieve PR labels (only relevant info, not full objects)
          PR_LABELS=$(gh pr view "$PR_NUMBER" \
            --json labels \
            --jq '[.labels[].name] | join(",")' 2>/dev/null || echo "")
          echo "PR_LABELS=$PR_LABELS" >> $GITHUB_ENV
          
          # Retrieve commit messages (relevant for context)
          COMMIT_MESSAGES=$(gh pr view "$PR_NUMBER" \
            --json commits \
            --jq '[.commits[].commit.message] | join("\n---\n")' 2>/dev/null || echo "")
          echo "COMMIT_MESSAGES<<EOF" >> $GITHUB_ENV
          echo "$COMMIT_MESSAGES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          # Extract linked issue info (only if it exists)
          ISSUE_NUMBER=$(gh pr view "$PR_NUMBER" \
            --json closingIssuesReferences \
            --jq '.closingIssuesReferences[0].number' 2>/dev/null || echo "")
          
          if [ -n "$ISSUE_NUMBER" ] && [ "$ISSUE_NUMBER" != "null" ]; then
            ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title' 2>/dev/null || echo "")
            ISSUE_LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '[.labels[].name] | join(",")' 2>/dev/null || echo "")
            echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> $GITHUB_ENV
            echo "ISSUE_TITLE=$ISSUE_TITLE" >> $GITHUB_ENV
            echo "ISSUE_LABELS=$ISSUE_LABELS" >> $GITHUB_ENV
          else
            echo "ISSUE_NUMBER=" >> $GITHUB_ENV
          fi

      - name: Check for Test Changes
        id: test_coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          PR_NUMBER="${{ steps.pr_info.outputs.PR_NUMBER }}"
          
          # Get base and head SHAs
          PR_JSON=$(gh pr view "$PR_NUMBER" --json baseRefOid,headRefOid 2>/dev/null)
          BASE_SHA=$(echo "$PR_JSON" | jq -r '.baseRefOid')
          HEAD_SHA=$(echo "$PR_JSON" | jq -r '.headRefOid')
          
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ] || [ "$BASE_SHA" == "null" ] || [ "$HEAD_SHA" == "null" ]; then
            echo "::warning::Could not retrieve commit SHAs, skipping test coverage check"
            echo "HAS_TEST_CHANGES=false" >> $GITHUB_ENV
            echo "MISSING_TESTS=false" >> $GITHUB_ENV
            exit 0
          fi
          
          # Robust test file detection using multiple patterns
          TEST_FILES=$(git diff --name-only "$BASE_SHA".."$HEAD_SHA" 2>/dev/null | \
            grep -E '(\.test\.|\.spec\.|__tests__|tests?/)' || echo "")
          
          if [ -n "$TEST_FILES" ]; then
            echo "HAS_TEST_CHANGES=true" >> $GITHUB_ENV
            echo "TEST_FILE_COUNT=$(echo "$TEST_FILES" | wc -l)" >> $GITHUB_ENV
          else
            echo "HAS_TEST_CHANGES=false" >> $GITHUB_ENV
          fi
          
          # Check for untested source files using glob patterns
          SOURCE_FILES=$(git diff --name-only "$BASE_SHA".."$HEAD_SHA" 2>/dev/null | \
            grep -E '\.(ts|tsx|js|jsx)$' | \
            grep -v -E '(\.test\.|\.spec\.|__tests__|tests?/)' || echo "")
          
          # Flag missing tests if source changed but tests didn't
          if [ -n "$SOURCE_FILES" ] && [ -z "$TEST_FILES" ]; then
            echo "MISSING_TESTS=true" >> $GITHUB_ENV
            echo "SOURCE_FILE_COUNT=$(echo "$SOURCE_FILES" | wc -l)" >> $GITHUB_ENV
          else
            echo "MISSING_TESTS=false" >> $GITHUB_ENV
          fi

      - name: Run Intelligent Gemini Review
        id: gemini
        if: env.INSTALL_SUCCESS == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ steps.pr_info.outputs.PR_NUMBER }}
          PR_TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
          PR_DESCRIPTION: ${{ github.event.pull_request.body || github.event.issue.body }}
          PR_LABELS: ${{ env.PR_LABELS }}
          FILES_CHANGED: ${{ env.FILES_CHANGED }}
          TOTAL_LOC: ${{ env.TOTAL_LOC }}
          REVIEW_DEPTH: ${{ env.REVIEW_DEPTH }}
          CHANGED_AREAS: ${{ env.CHANGED_AREAS }}
          REVIEW_COUNT: ${{ env.REVIEW_COUNT }}
          RESOLVED_COUNT: ${{ env.RESOLVED_COUNT }}
          CHANGES_REQUESTED: ${{ env.CHANGES_REQUESTED }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          ISSUE_TITLE: ${{ env.ISSUE_TITLE }}
          ISSUE_LABELS: ${{ env.ISSUE_LABELS }}
          COMMIT_MESSAGES: ${{ env.COMMIT_MESSAGES }}
          HAS_TEST_CHANGES: ${{ env.HAS_TEST_CHANGES }}
          MISSING_TESTS: ${{ env.MISSING_TESTS }}
          REVIEW_CONTEXT_FILES: ${{ vars.REVIEW_CONTEXT_FILES || 'DEVELOPMENT.md,DESIGN_GUIDELINES.md,docs/audits/AUDIT_CODE_HYGIENE.md' }}
          PR_DIFF_FILE: pr.diff
        run: |
          if ! npx tsx scripts/gemini-client.ts \
            --preset review \
            --context "$REVIEW_CONTEXT_FILES" \
            --output "review_result.json" 2>&1; then
            echo "::error::Gemini review failed - script execution error"
            exit 1
          fi
          
          if [ ! -f "review_result.json" ]; then
            echo "::error::Gemini review failed - no output file generated"
            exit 1
          fi

      - name: Process Review Result
        if: steps.gemini.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr_info.outputs.PR_NUMBER }}
        with:
          github-token: ${{ secrets.ARI_PAT }}
          script: |
            const fs = require('fs');
            
            if (!fs.existsSync('review_result.json')) {
              console.log('No review result file found.');
              return;
            }
            
            try {
              const result = JSON.parse(fs.readFileSync('review_result.json', 'utf8'));
              let { reviewComment, labels } = result;
              
              const reviewCount = parseInt(process.env.REVIEW_COUNT || '0');
              const reviewType = reviewCount === 0 ? 'Initial Review' : `Revision #${reviewCount + 1}`;
              const filesChanged = process.env.FILES_CHANGED || '0';
              const totalLoc = process.env.TOTAL_LOC || '0';
              
              let header = `## Gemini Code Review (${reviewType})\n\n`;
              header += `**Change Summary:** ${filesChanged} files, ~${totalLoc} LOC\n`;
              header += `**Review Depth:** ${process.env.REVIEW_DEPTH || 'standard'}\n`;
              
              const changedAreas = process.env.CHANGED_AREAS || 'various';
              if (changedAreas !== '') {
                header += `**Areas Changed:** ${changedAreas}\n`;
              }
              header += '\n';
              
              if (process.env.MISSING_TESTS === 'true') {
                header += `**Note:** Source code changed without corresponding test updates.\n\n`;
              }
              
              if (!reviewComment || reviewComment.trim() === '') {
                reviewComment = '### Verification Complete\n\nNo significant issues found in this review.';
              }
              
              const finalComment = header + reviewComment;
              
              await github.rest.issues.createComment({
                issue_number: process.env.PR_NUMBER,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: finalComment
              });
              
              if (labels && Array.isArray(labels) && labels.length > 0) {
                try {
                  await github.rest.issues.addLabels({
                    issue_number: process.env.PR_NUMBER,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    labels: labels
                  });
                } catch (labelError) {
                  console.log('Could not apply labels:', labelError.message);
                }
              }
            } catch (parseError) {
              core.setFailed('Failed to parse review result: ' + parseError.message);
            }

      - name: Handle Review Failure
        if: steps.gemini.outcome == 'failure'
        env:
          PR_NUMBER: ${{ steps.pr_info.outputs.PR_NUMBER }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ARI_PAT }}
          script: |
            const failureComment = '## Gemini Review Status\n\n**Status**: Review Failed\n\nThe review process encountered an error. Please check the workflow logs for details.';
            
            try {
              await github.rest.issues.createComment({
                issue_number: process.env.PR_NUMBER,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: failureComment
              });
            } catch (error) {
              core.warning('Failed to post failure comment: ' + error.message);
            }
