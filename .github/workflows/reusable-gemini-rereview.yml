# .github/workflows/reusable-gemini-rereview.yml
name: Reusable Gemini Rereview

on:
  workflow_call:
    outputs:
      needs-review:
        description: "Whether a re-review is needed"
        value: ${{ jobs.analyze-changes.outputs.needs-review }}
      review-type:
        description: "Type of review required"
        value: ${{ jobs.analyze-changes.outputs.review-type }}
      skip-reason:
        description: "Reason for skipping review"
        value: ${{ jobs.analyze-changes.outputs.skip-reason }}

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  analyze-changes:
    name: Analyze Changes for Re-Review
    runs-on: ubuntu-latest
    outputs:
      needs-review: ${{ steps.decision.outputs.needs-review }}
      review-type: ${{ steps.decision.outputs.review-type }}
      skip-reason: ${{ steps.decision.outputs.skip-reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze Change Significance
        id: analyze
        run: |
          # 1. Detect Merge Commit
          PARENT_COUNT=$(git rev-list --parents -n 1 HEAD | wc -w)
          if [ "$PARENT_COUNT" -gt 2 ]; then
            echo "IS_MERGE=1" >> $GITHUB_ENV
          else
            echo "IS_MERGE=0" >> $GITHUB_ENV
          fi

          # 2. Get Commit Message
          MSG=$(git log -1 --pretty=format:"%s")
          echo "COMMIT_MSG=$MSG" >> $GITHUB_ENV

          # 3. Detect Significant Changes
          # A "significant change" is any change to a file that is not a markdown file,
          # an image, a package lock file, or a gitignore file.
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          SIGNIFICANT_COUNT=$(echo "$CHANGED_FILES" | grep -vE '(\.md$|\.png$|\.svg$|package-lock\.json$|\.gitignore$)' | wc -l)
          echo "SIGNIFICANT_CHANGES=$SIGNIFICANT_COUNT" >> $GITHUB_ENV

      - name: Check Review State
        id: review_state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_DATA=$(gh pr view "$PR_NUMBER" --json reviews,comments)

          CHANGES_REQUESTED=$(echo "$PR_DATA" | jq '[.reviews[] | select(.state == "CHANGES_REQUESTED")] | length')
          APPROVED=$(echo "$PR_DATA" | jq '[.reviews[] | select(.state == "APPROVED")] | length')
          REVIEW_COMMENTS=$(echo "$PR_DATA" | jq '[.comments[] | select(.author.login == "arii")] | length')
          TOTAL_REVIEWS=$(echo "$PR_DATA" | jq '[.reviews[]] | length')
          LAST_COMMENT_TIMESTAMP=$(echo "$PR_DATA" | jq -r '[.comments[] | select(.author.login == "arii")] | .[-1].createdAt // ""')

          echo "CHANGES_REQUESTED=${CHANGES_REQUESTED:-0}" >> $GITHUB_ENV
          echo "APPROVED=${APPROVED:-0}" >> $GITHUB_ENV
          echo "REVIEW_COMMENTS=${REVIEW_COMMENTS:-0}" >> $GITHUB_ENV
          echo "TOTAL_REVIEWS=${TOTAL_REVIEWS:-0}" >> $GITHUB_ENV
          echo "LAST_COMMENT_TIMESTAMP=$LAST_COMMENT_TIMESTAMP" >> $GITHUB_ENV

      - name: Decide Re-Review Strategy
        # This step determines whether a re-review is needed based on the current state of the PR.
        # It considers factors like the number of significant changes, the commit message,
        # and the time since the last review comment.
        id: decision
        env:
          IS_MERGE: ${{ env.IS_MERGE || 0 }}
          SIGNIFICANT_CHANGES: ${{ env.SIGNIFICANT_CHANGES || 0 }}
          COMMIT_MSG: ${{ env.COMMIT_MSG }}
          CHANGES_REQUESTED: ${{ env.CHANGES_REQUESTED || 0 }}
          APPROVED: ${{ env.APPROVED || 0 }}
          REVIEW_COMMENTS: ${{ env.REVIEW_COMMENTS || 0 }}
          TOTAL_REVIEWS: ${{ env.TOTAL_REVIEWS || 0 }}
          LAST_COMMENT_TIMESTAMP: ${{ env.LAST_COMMENT_TIMESTAMP }}
        run: |
          # REQ: Number of "Changes Requested" reviews on the PR.
          REQ="${CHANGES_REQUESTED:-0}"
          # SIG: Number of "significant" files changed in the last push.
          SIG="${SIGNIFICANT_CHANGES:-0}"

          NEEDS_REVIEW="false"
          REVIEW_TYPE="none"
          SKIP_REASON="no criteria met"
          
          echo "::debug::Analyzing for re-review. CHANGES_REQUESTED=${REQ}, SIGNIFICANT_CHANGES=${SIG}"

          # Skip if the last comment was very recent to avoid rapid-fire reviews
          if [ -n "$LAST_COMMENT_TIMESTAMP" ]; then
            COMMENT_TIME=$(date -d "$LAST_COMMENT_TIMESTAMP" +%s)
            CURRENT_TIME=$(date +%s)
            TIME_DIFF=$((CURRENT_TIME - COMMENT_TIME))
            if [ "$TIME_DIFF" -lt 300 ]; then # 5 minutes
              SKIP_REASON="too recent"
              echo "::debug::Skipping review: Last comment was only ${TIME_DIFF} seconds ago."
              echo "needs-review=false" >> $GITHUB_OUTPUT
              echo "skip-reason=$SKIP_REASON" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # Skip if no significant changes (just response comments, no code changes)
          if [[ "$SIG" -eq 0 ]]; then
            SKIP_REASON="no code changes"
            echo "::debug::Skipping review: No significant code changes detected (SIG=0)."
          elif [[ "$IS_MERGE" -eq 1 && "$SIG" -eq 0 ]]; then
            SKIP_REASON="merge"
            echo "::debug::Skipping review: Merge commit with no significant changes."
          elif [[ "$COMMIT_MSG" =~ ^(docs?|chore|style): ]]; then
            SKIP_REASON="trivial"
            echo "::debug::Skipping review: Trivial change detected from commit message."
          elif [[ "$TOTAL_REVIEWS" -eq 0 && "$SIG" -gt 0 ]]; then
            NEEDS_REVIEW="true"
            REVIEW_TYPE="initial"
            echo "::debug::Triggering initial review: No reviews yet and significant changes present."
          elif [[ "$REQ" -gt 0 && "$SIG" -gt 0 ]]; then
            NEEDS_REVIEW="true"
            REVIEW_TYPE="full"
            echo "::debug::Triggering full re-review: Changes were requested and new significant changes are present."
          elif [[ "$APPROVED" -gt 0 && "$SIG" -gt 0 ]]; then
            NEEDS_REVIEW="true"
            REVIEW_TYPE="verification"
            echo "::debug::Triggering verification review: PR was approved but new significant changes were pushed."
          else
            SKIP_REASON="awaiting code changes"
            echo "::debug::Skipping review: No actionable criteria met."
          fi
          echo "needs-review=$NEEDS_REVIEW" >> $GITHUB_OUTPUT
          echo "review-type=$REVIEW_TYPE" >> $GITHUB_OUTPUT
          echo "skip-reason=$SKIP_REASON" >> $GITHUB_OUTPUT

  re-review:
    name: Execute Re-Review
    needs: analyze-changes
    if: needs.analyze-changes.outputs.needs-review == 'true'
    uses: ./.github/workflows/reusable-gemini-review.yml
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ARI_PAT: ${{ secrets.ARI_PAT }}

  post-skip-check:
    name: Post Skip Check
    needs: analyze-changes
    if: needs.analyze-changes.outputs.needs-review == 'false'
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Create skip check
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const skipReason = '${{ needs.analyze-changes.outputs.skip-reason }}';
            let summary = 'Re-review was not needed for this push.';
            if (skipReason === 'merge') {
              summary = 'Merge commit detected with no significant code changes.';
            } else if (skipReason === 'trivial') {
              summary = 'Trivial change detected (docs/chore/style only).';
            } else if (skipReason === 'no code changes') {
              summary = 'No code changes detected. Review will resume when code changes are pushed.';
            } else if (skipReason === 'awaiting code changes') {
              summary = 'Awaiting code changes from Jules. Review will resume when code is updated.';
            } else if (skipReason === 'no') {
              summary = 'No re-review criteria were met.';
            }
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Gemini Code Review',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: 'skipped',
              output: {
                title: '⏭️ Review Skipped',
                summary: summary
              }
            });
