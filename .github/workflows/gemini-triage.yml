name: Gemini Triage
on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Create Task Input
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          echo "Perform triage on the following issue." > task_input.txt
          echo "Title: $ISSUE_TITLE" >> task_input.txt
          echo "Body:" >> task_input.txt
          echo "$ISSUE_BODY" >> task_input.txt

      - name: Run Gemini Triage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRIAGE_CONTEXT_FILES: ${{ vars.TRIAGE_CONTEXT_FILES || 'CONTRIBUTING.md,docs/agents/AGENT_TRIAGE.md' }}
        run: |
          npx tsx scripts/gemini-client.ts \
            --preset triage \
            --task-file "task_input.txt" \
            --context "$TRIAGE_CONTEXT_FILES" \
            --output "triage_result.json"

      - name: Process Triage Result
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ARI_PAT }}
          script: |
            const fs = require('fs');

            if (!fs.existsSync('triage_result.json')) {
              console.log('No triage result file found.');
              return;
            }

            try {
              const result = JSON.parse(fs.readFileSync('triage_result.json', 'utf8'));
              const { triageComment, labels } = result;

              // Post the comment
              if (triageComment) {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: triageComment
                });
              }

              // Apply labels
              if (labels && Array.isArray(labels) && labels.length > 0) {
                console.log('Applying labels:', labels);
                // Filter out obviously bad labels if needed, or just let GitHub handle it
                // We'll wrap in try-catch to be safe
                try {
                  await github.rest.issues.addLabels({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    labels: labels
                  });
                } catch (labelError) {
                  console.warn('Failed to add labels:', labelError.message);
                  // Optional: Post a comment about label failure? No, too noisy.
                }
              }
            } catch (e) {
              console.error('Failed to parse triage result or post comment:', e);
              core.setFailed('Error processing triage result');
            }
