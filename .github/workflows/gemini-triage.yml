# .github/workflows/gemini-triage.yml
#
# Consolidates AI-driven issue triage with scheduled maintenance tasks.
#
# Behavior:
# 1. On new issues: Gemini analyzes and provides detailed triage (labels, priority, etc.).
# 2. On schedule/manual: Rule-based checks are run to find stale issues,
#    detect duplicates, and suggest resolutions for active discussions.

name: Gemini Smart Triage

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM UTC
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    # This job runs for new issues.
    # It uses a Gemini agent to analyze the issue and provide a detailed triage.
    if: github.event_name == 'issues' && github.actor != 'ari-party-bot'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Triage Context
        id: context
        run: |
          # Aggregate project documentation for the prompt
          echo "## Project Documentation" > context.txt
          if [ -f "README.md" ]; then cat README.md >> context.txt; fi
          if [ -f "CONTRIBUTING.md" ]; then cat CONTRIBUTING.md >> context.txt; fi
          if [ -f "docs/agents/AGENT_TRIAGE.md" ]; then cat docs/agents/AGENT_TRIAGE.md >> context.txt; fi

      - name: Construct Analysis Prompt
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Create a structured prompt demanding JSON output
          cat <<EOF > task_input.txt
          You are a Senior Technical Project Manager. Analyze the following GitHub Issue.

          ### Project Context
          $(cat context.txt | head -c 4000) # Limit context to 4k chars

          ### Issue To Analyze
          **Title:** $ISSUE_TITLE
          **Body:**
          $ISSUE_BODY

          ### Instructions
          1. Determine the type (Bug, Feature, Question, etc.).
          2. Assess the clarity and quality of the issue.
          3. Generate a refined, professional title and description if the original is vague. The original content should be preserved.

          ### Output Format
          You MUST return a valid JSON object. Do not include markdown formatting like \`\`\`json.
          {
            "labels": ["bug", "enhancement", "documentation", "needs-info", "invalid"],
            "priority": "High" | "Medium" | "Low",
            "summary": "A 1-sentence summary of the issue",
            "analysis": "A brief analysis of what is needed to fix this.",
            "suggested_title": "A clearer title (if original is poor)",
            "suggested_body": "A professionally formatted issue body.",
            "completeness_score": 0-10
          }
          EOF

      - name: Run Gemini Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Run the client and save output to a file
          npx tsx scripts/gemini-client.ts \
            --task-file "task_input.txt" \
            --output "triage_result.json"

      - name: Apply Triage Actions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ARI_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            try {
              const filePath = path.resolve(process.cwd(), 'triage_result.json');
              if (!fs.existsSync(filePath)) {
                core.setFailed('Triage result file not found. The Gemini client may have crashed silently.');
                return;
              }
              const rawData = fs.readFileSync(filePath, 'utf8');
              // The model may return a JSON object wrapped in markdown.
              // This is a robust way to strip the markdown and parse the JSON.
              const cleanedData = rawData.trim().replace(/^```json|```$/g, '').trim();
              const result = JSON.parse(cleanedData);

              // ---- Start of Validation Block ----
              const requiredKeys = ['summary', 'priority', 'analysis', 'labels'];
              const expectedSchema = {
                labels: (val) => Array.isArray(val) && val.every(item => typeof item === 'string'),
                priority: (val) => typeof val === 'string' && ['High', 'Medium', 'Low'].includes(val),
                summary: (val) => typeof val === 'string' && val.length > 0,
                analysis: (val) => typeof val === 'string',
                suggested_title: (val) => typeof val === 'string',
                suggested_body: (val) => typeof val === 'string',
                completeness_score: (val) => typeof val === 'number' && val >= 0 && val <= 10,
              };

              const validationErrors = Object.entries(expectedSchema)
                .map(([key, validator]) => {
                  if (result.hasOwnProperty(key)) {
                    if (!validator(result[key])) {
                      return `\`${key}\` is present but has an invalid type or value. (Actual: \`${JSON.stringify(result[key])}\`)`;
                    }
                  } else if (requiredKeys.includes(key)) {
                    // Check for required keys
                    return `Required key \`${key}\` is missing.`;
                  }
                  return null;
                })
                .filter(Boolean);


              if (validationErrors.length > 0) {
                const errorList = validationErrors.map(e => `- ${e}`).join('\n');
                const validationComment = `
                ### ❌ Smart Triage Failed: Invalid JSON Schema

                The AI returned a structurally invalid response. The following errors were found:
                ${errorList}

                <details><summary>Raw AI Output</summary>

                \`\`\`json
                ${JSON.stringify(result, null, 2)}
                \`\`\`

                </details>
                `;
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: validationComment.trim(),
                });
                core.setFailed('The AI response failed schema validation.');
                return;
              }
              // ---- End of Validation Block ----

              // Gracefully handle cases where the Gemini agent fails and returns a structured error.
              if (result.error) {
                console.error('Triage failed with structured error:', result.error);
                const errorComment = `
                ### ❌ Smart Triage Failed: ${result.error.category || 'Unknown Error'}

                **Details**: ${result.error.message || 'No message provided.'}

                <details><summary>Technical Information</summary>

                \`\`\`json
                ${JSON.stringify(result.error.details, null, 2)}
                \`\`\`

                </details>
                `;
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: errorComment.trim(),
                });
                core.setFailed(`Triage failed: ${result.error.message}`);
                return;
              }

              // Proceed with standard triage actions if no error is present.
              console.log('Parsed Triage Result:', result);

              if (result.labels && result.labels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: result.labels,
                });
              }

              const commentBody = `
              ### 🤖 Gemini Smart Triage

              **Summary:** ${result.summary}
              **Priority:** ${result.priority} | **Score:** ${result.completeness_score}/10

              **Analysis:**
              ${result.analysis}

              ${result.suggested_title && result.suggested_title !== context.payload.issue.title
                ? `> **Suggestion:** Consider renaming this issue to: *"${result.suggested_title}"*`
                : ''}
              `;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody.trim(),
              });

              if (result.suggested_title || result.suggested_body) {
                const newTitle = result.suggested_title || context.payload.issue.title;
                let newBody = context.payload.issue.body;

                if (result.suggested_body) {
                  const originalBody = context.payload.issue.body;
                  let suggestedBody = result.suggested_body;
                  if (suggestedBody.length > 60000) {
                    suggestedBody = suggestedBody.substring(0, 60000) + '\n... (truncated)';
                  }
                  newBody = '<details>\n<summary>Original Issue Body</summary>\n\n' + originalBody + '\n</details>\n\n' + suggestedBody;
                }

                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  title: newTitle,
                  body: newBody,
                });
              }
            } catch (error) {
              console.error('Fatal error processing triage result:', error);
              const fatalErrorComment = `
              ### ❌ Smart Triage Failed: Unhandled Exception

              A critical error occurred while processing the triage result. This is likely an issue with the workflow script itself.

              <details><summary>Error Details</summary>

              \`\`\`
              ${error.stack || error.message}
              \`\`\`

              </details>
              `;
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: fatalErrorComment.trim(),
                });
              } catch (commentError) {
                console.error('Failed to post fatal error comment:', commentError);
              }
              core.setFailed('Failed to apply triage actions due to a fatal error: ' + error.message);
            }
  maintenance:
    # This job runs on a schedule or manual trigger.
    # It performs rule-based maintenance tasks like finding stale issues and duplicates.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Triage Stale Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          STALE=$(gh issue list --state open --search "updated:<$(date -d '30 days ago' '+%Y-%m-%d')" --json number,body,labels --limit 50)
          echo "$STALE" | jq -c '.[]' | while read -r issue; do
            NUM=$(echo "$issue" | jq -r '.number')
            BODY=$(echo "$issue" | jq -r '.body')
            LABELS=$(echo "$issue" | jq -r '.labels[].name | @csv' | tr -d '"' | paste -sd',' -)
            echo "::notice::Processing issue #$NUM"
            if ! echo "$BODY" | grep -iq "reproduce\|steps"; then
              if ! echo "$LABELS" | grep -q "needs-info"; then
                gh issue edit "$NUM" --add-label "needs-info" && echo "::notice::  ✅ Added 'needs-info' label to #$NUM"
                gh issue comment "$NUM" --body "Please provide reproduction steps for this issue." && echo "::notice::  ✅ Posted 'needs-info' comment to #$NUM"
              fi
            fi
            if echo "$BODY" | grep -iqE "crash|broken|error"; then
              if ! echo "$LABELS" | grep -q "bug"; then
                gh issue edit "$NUM" --add-label "bug" && echo "::notice::  ✅ Added 'bug' label to #$NUM"
              fi
            fi
          done

      - name: Detect Duplicates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          DUPLICATE_TITLES=$(gh issue list --state open --json title --limit 100 | jq -r '.[] | .title' | sort | uniq -d)
          if [ -z "$DUPLICATE_TITLES" ]; then exit 0; fi
          echo "$DUPLICATE_TITLES" | while read -r title; do
            DUPS=$(gh issue list --state open --search "\"$title\"" --json number --limit 5 | jq -r '.[].number')
            COUNT=$(echo "$DUPS" | wc -w)
            if [ "$COUNT" -gt 1 ]; then
              FIRST=$(echo "$DUPS" | awk '{print $1}')
              OTHERS=$(echo "$DUPS" | awk '{for(i=2;i<=NF;i++)printf "#%s,",$i}' | sed 's/,$//')
              echo "::notice::Found $COUNT duplicate issues for: '$title'"
              gh issue comment "$FIRST" --body "Possible duplicates: $OTHERS" && echo "::notice::  ✅ Posted duplicate notice on #$FIRST"
            fi
          done

      - name: Suggest Resolution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ISSUES=$(gh issue list --state open --json number,comments --limit 100 | jq -c '.[] | select(.comments | length > 5)')
          if [ -z "$ISSUES" ]; then exit 0; fi
          echo "$ISSUES" | while read -r issue; do
            NUM=$(echo "$issue" | jq -r '.number')
            RECENT=$(gh issue view "$NUM" --json comments --jq '.comments[-3:] | .[].body' 2>/dev/null)
            if echo "$RECENT" | grep -iqE "fixed|resolved|merged|works"; then
              echo "::notice::Issue #$NUM may be resolved"
              gh issue comment "$NUM" --body "This issue may be resolved. Feel free to close if fixed!" && echo "::notice::  ✅ Posted resolution suggestion on #$NUM"
            fi
          done
