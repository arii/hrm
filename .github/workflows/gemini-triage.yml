name: Gemini Triage
on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - run: pnpm install --frozen-lockfile

      - name: Run Gemini Triage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # Escape title and body slightly to avoid command line injection issues,
          # but really the script should handle it. Passing via env vars might be safer if the script supported it.
          # For simplicity we pass as args, quoting carefully.

          # Better approach: Write content to temp file to avoid quoting hell
          echo "Title: $ISSUE_TITLE" > issue_content.txt
          echo "Body:" >> issue_content.txt
          echo "$ISSUE_BODY" >> issue_content.txt

          TASK_CONTENT=$(cat issue_content.txt)

          npx tsx scripts/gemini-client.ts \
            --task "Perform triage on the following issue. $TASK_CONTENT" \
            --context "CONTRIBUTING.md,docs/agents/AGENT_TRIAGE.md" \
            --output "triage_result.md"

      - name: Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
             const fs = require('fs');
             try {
               const body = fs.readFileSync('triage_result.md', 'utf8');
               await github.rest.issues.createComment({
                 issue_number: context.issue.number,
                 owner: context.repo.owner,
                 repo: context.repo.repo,
                 body: body
               });
             } catch (e) {
               console.log('No triage result found or error posting comment');
             }
