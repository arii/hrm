name: Reusable Gemini Review
on:
  workflow_call:
    secrets:
      GEMINI_API_KEY:
        required: true
      ARI_PAT:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies with fallback
        id: install
        continue-on-error: true
        run: |
          echo "Attempting pnpm install with frozen lockfile..."
          if ! pnpm install --frozen-lockfile; then
            echo "::warning::Frozen lockfile failed, attempting regular install"
            echo "LOCKFILE_MISMATCH=true" >> $GITHUB_ENV

            if pnpm install; then
              echo "::notice::Dependencies installed successfully with lockfile update"
              echo "INSTALL_SUCCESS=true" >> $GITHUB_ENV
            else
              echo "::error::Dependency installation failed completely"
              echo "INSTALL_FAILURE=true" >> $GITHUB_ENV
              exit 1
            fi
          else
            echo "INSTALL_SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Get PR Diff
        id: diff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr.diff
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get Additional Context
        id: context
        run: |
          # Get linked issue body
          ISSUE_NUMBER=$(gh pr view ${{ github.event.pull_request.number }} --json closingIssuesReferences --jq '.closingIssuesReferences[0].number')
          if [ -n "$ISSUE_NUMBER" ] && [ "$ISSUE_NUMBER" != "null" ]; then
            echo "Found linked issue: $ISSUE_NUMBER"
            ISSUE_BODY=$(gh issue view $ISSUE_NUMBER --json body --jq '.body')
            echo "LINKED_ISSUE_BODY<<EOF" >> $GITHUB_ENV
            echo "$ISSUE_BODY" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> $GITHUB_ENV
          else
            echo "No linked issue found."
            echo "LINKED_ISSUE_BODY=" >> $GITHUB_ENV
            echo "ISSUE_NUMBER=" >> $GITHUB_ENV
          fi
          # Get existing review comments from this bot (user 'arii')
          COMMENTS=$(gh pr view ${{ github.event.pull_request.number }} --json comments --jq '[.comments[] | select(.author.login == "arii") | .body] | .[]')
          if [ -n "$COMMENTS" ]; then
             echo "Found existing comments."
             # Format for prompt by joining with a separator
             FORMATTED_COMMENTS=$(echo "$COMMENTS" | paste -sd '---' -)
             echo "EXISTING_COMMENTS<<EOF" >> $GITHUB_ENV
             echo "$FORMATTED_COMMENTS" >> $GITHUB_ENV
             echo "EOF" >> $GITHUB_ENV
          else
             echo "No existing comments from bot found."
             echo "EXISTING_COMMENTS=" >> $GITHUB_ENV
          fi

          # Get PR Labels
          PR_LABELS=$(gh pr view ${{ github.event.pull_request.number }} --json labels --jq '[.labels[].name] | join(",")')
          echo "PR_LABELS=$PR_LABELS" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run Gemini Review
        id: gemini
        if: env.INSTALL_SUCCESS == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKED_ISSUE_BODY: ${{ env.LINKED_ISSUE_BODY }}
          EXISTING_COMMENTS: ${{ env.EXISTING_COMMENTS }}
          PR_LABELS: ${{ env.PR_LABELS }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_DESCRIPTION: ${{ github.event.pull_request.body }}
          PR_DIFF_FILE: pr.diff
          REVIEW_CONTEXT_FILES: ${{ vars.REVIEW_CONTEXT_FILES || 'DEVELOPMENT.md,DESIGN_GUIDELINES.md,docs/audits/AUDIT_CODE_HYGIENE.md' }}
        run: |
          npx tsx scripts/gemini-client.ts \
            --preset review \
            --context "$REVIEW_CONTEXT_FILES" \
            --output "review_result.json"

      - name: Post Configuration Warning
        if: env.LOCKFILE_MISMATCH == 'true' && env.INSTALL_SUCCESS == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ARI_PAT }}
          script: |
            const warningComment = `## ⚠️ Configuration Issue Detected
            **Issue**: \`pnpm-lock.yaml\` is out of sync with \`package.json\`
            **Impact**: This doesn't affect your code changes, but the dependency lockfile needs updating.
            **Fix**: Run these commands locally and push the changes:
            \`\`\`bash
            pnpm install
            git add pnpm-lock.yaml
            git commit -m "fix: update pnpm lockfile"
            git push
            \`\`\`
            **Code Review**: The review will proceed with the updated dependencies, but please update the lockfile to ensure consistent builds.
            <details>
            <summary>Technical Details</summary>
            The workflow attempted to install dependencies with \`--frozen-lockfile\` but found mismatches. This typically happens when dependencies in \`package.json\` are changed without committing the corresponding \`pnpm-lock.yaml\` update. This is an infrastructure issue, not a problem with your code changes.
            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: warningComment
            });

      - name: Process Review Result
        if: steps.gemini.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ARI_PAT }}
          script: |
            const fs = require('fs');
            try {
              if (!fs.existsSync('review_result.json')) {
                console.log('No review result file found. Likely skipped.');
                return;
              }
              const result = JSON.parse(fs.readFileSync('review_result.json', 'utf8'));
              const { reviewComment, labels } = result;

              // Post the comment
              if (reviewComment) {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: reviewComment
                });
              }

              // Apply labels
              if (labels && labels.length > 0) {
                await github.rest.issues.addLabels({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  labels: labels
                });
              }

            } catch (e) {
              console.error('Error processing review result:', e);
              core.setFailed('Failed to process Gemini review result');
            }
      - name: Handle Gemini Failure
        if: steps.gemini.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ARI_PAT }}
          script: |
            const failureComment = `## 🤖 Gemini Review Status
            **Status**: ❌ Review Failed
            **Reason**: The Gemini review process encountered an unexpected error. This is likely an intermittent infrastructure issue.
            **Next Steps**: The workflow will be automatically re-run on the next push. If the problem persists, please check the workflow logs for more details.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: failureComment
            });

      - name: Handle Installation Failure
        if: env.INSTALL_FAILURE == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ARI_PAT }}
          script: |
            const failureComment = `## 🤖 Gemini Review Status
            **Status**: ❌ Review Skipped
            **Reason**: Dependency installation failed completely. This is a blocking issue.
            **Next Steps**: Please check your \`package.json\` for syntax errors or invalid dependencies and ensure \`pnpm-lock.yaml\` is not corrupted. Review the workflow logs for the specific error message from \`pnpm\`.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: failureComment
            });
