# .github/workflows/reusable-gemini-review.yml
# This workflow is responsible for generating code reviews and posting them as PR comments.
# It does not create GitHub issues, so 'issues: write' permission is not required.
# Issue creation is handled by the 'reusable-create-review-issues.yml' workflow.
name: Reusable Gemini Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
      force_review:
        description: 'Force review even if already reviewed'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      trigger_event:
        description: 'The event that triggered the workflow (pull_request or comment)'
        required: true
        type: string
      pr_quality_result:
        description: 'The result of the pr-quality job (success, failure, skipped, not_applicable)'
        required: true
        type: string
      comment_body:
        description: 'The body of the comment that triggered the workflow'
        required: false
        type: string
      last_non_empty_commit:
        description: 'The SHA of the last non-empty commit'
        required: false
        type: string
      failure_report_json:
        description: 'A JSON string of failed checks from the calling workflow'
        required: false
        type: string
      pr_number:
        description: 'PR Number'
        required: false
        type: string
      base_sha:
        description: 'Base SHA (override for workflow_dispatch)'
        required: false
        type: string
      head_sha:
        description: 'Head SHA (override for workflow_dispatch)'
        required: false
        type: string
    secrets:
      GEMINI_API_KEY:
        required: true
      ARI_PAT:
        required: true
    outputs:
      needs-review:
        description: 'Whether a re-review is needed'
        value: ${{ jobs.analyze-changes.outputs.needs-review }}
      skip-reason:
        description: 'Reason for skipping review'
        value: ${{ jobs.analyze-changes.outputs.skip-reason }}
      review_performed:
        description: 'Indicates if a review artifact was successfully generated and uploaded.'
        value: ${{ jobs.gemini-review.outputs.review_performed }}

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  actions: read

jobs:
  analyze-changes:
    name: Analyze Changes for Review
    runs-on: ubuntu-latest
    outputs:
      needs-review: ${{ steps.decision.outputs.needs-review }}
      skip-reason: ${{ steps.decision.outputs.skip-reason }}
      thought-signature: ${{ steps.decision.outputs.thought-signature }}
      base_sha: ${{ steps.fetch-shas.outputs.base_sha }}
      head_sha: ${{ steps.fetch-shas.outputs.head_sha }}
    steps:
      - name: Install jq
        run: |
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event.pull_request || github.event.issue.pull_request) && format('refs/pull/{0}/head', inputs.pr_number || github.event.pull_request.number || github.event.issue.number) || github.sha }}
          fetch-depth: 0

      - name: Fetch PR SHAs
        id: fetch-shas
        env:
          GH_TOKEN: ${{ secrets.ARI_PAT }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
        run: |
          BASE_SHA="${{ inputs.base_sha || github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ inputs.head_sha || github.event.pull_request.head.sha }}"
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::PR_NUMBER is required to fetch SHAs but was not provided."
              exit 1
            fi
            PR_DATA=$(gh pr view "$PR_NUMBER" --json baseRefOid,headRefOid 2>/dev/null || true)
            [ -z "$BASE_SHA" ] && BASE_SHA=$(echo "$PR_DATA" | jq -r '.baseRefOid // empty')
            [ -z "$HEAD_SHA" ] && HEAD_SHA=$(echo "$PR_DATA" | jq -r '.headRefOid // empty')
            if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
              echo "::warning::Could not resolve SHAs for PR #$PR_NUMBER; SHAs will be empty"
            fi
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Decide Review Strategy
        id: decision
        env:
          TRIGGER_EVENT: ${{ inputs.trigger_event }}
          ACTION_TYPE: ${{ github.event.action }}
          COMMENT_BODY: ${{ inputs.comment_body }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
          BASE_SHA: ${{ steps.fetch-shas.outputs.base_sha }}
          HEAD_SHA: ${{ steps.fetch-shas.outputs.head_sha }}
          GH_TOKEN: ${{ secrets.ARI_PAT }}
          PR_QUALITY_RESULT: ${{ inputs.pr_quality_result }}
          MAX_COMMENTS: 60
          REVIEW_THROTTLE_MINUTES: 30
          BOT_USERNAME: 'gemini-bot'
          GEMINI_ENABLE_PR_REVIEW: ${{ vars.GEMINI_ENABLE_PR_REVIEW }}
        run: |
          chmod +x ./scripts/decide-review-strategy.sh
          ./scripts/decide-review-strategy.sh

  gemini-review:
    name: Execute Gemini Review
    needs: analyze-changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.analyze-changes.outputs.needs-review == 'true'
    runs-on: ubuntu-latest
    outputs:
      review_performed: ${{ steps.upload_artifact.outcome == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event.pull_request || github.event.issue.pull_request) && format('refs/pull/{0}/head', inputs.pr_number || github.event.pull_request.number || github.event.issue.number) || github.sha }}
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Get PR Diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_SHA=${{ needs.analyze-changes.outputs.base_sha }}
          HEAD_SHA=${{ inputs.last_non_empty_commit || needs.analyze-changes.outputs.head_sha }}

          echo "🔍 Generating diff between base commit ($BASE_SHA) and head commit ($HEAD_SHA)..."

          # Create a diff between the head and the true merge base.
          # This ensures that the diff only contains changes from the PR,
          # avoiding the inclusion of recent changes from the base branch (e.g., 'leader').
          git diff ${BASE_SHA}...${HEAD_SHA} > pr.diff

          echo "✅ Diff generated and saved to pr.diff"

      - name: Gather PR Context
        id: context
        env:
          GH_TOKEN: ${{ secrets.ARI_PAT }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
        run: |
          # Fetch the LIVE body to ensure we see the results of pr-enrichment
          LATEST_BODY=$(gh pr view "$PR_NUMBER" --json body -q '.body')

          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          # If pr_number is input, we might need to fetch title/author via API if github context is missing
          # But for now assuming context or defaults.
          # Actually, if we have PR_NUMBER, we can fetch details.
          PR_JSON=$(gh pr view "$PR_NUMBER" --json title,author,headRefName)
          PR_TITLE=$(echo "$PR_JSON" | jq -r .title)
          PR_AUTHOR=$(echo "$PR_JSON" | jq -r .author.login)
          PR_BRANCH_NAME=$(echo "$PR_JSON" | jq -r .headRefName)

          echo "PR_TITLE=$PR_TITLE" >> $GITHUB_ENV
          echo "PR_AUTHOR=$PR_AUTHOR" >> $GITHUB_ENV
          echo "COMMIT_HASH=${{ needs.analyze-changes.outputs.head_sha }}" >> $GITHUB_ENV
          echo "PR_BRANCH_NAME=$PR_BRANCH_NAME" >> $GITHUB_ENV

          echo "BASE_SHA=${{ needs.analyze-changes.outputs.base_sha }}" >> $GITHUB_ENV
          echo "HEAD_SHA=${{ inputs.last_non_empty_commit || needs.analyze-changes.outputs.head_sha }}" >> $GITHUB_ENV

          # Get REVIEW_COUNT using gh cli
          # If this fails (e.g. no PR context), default to 0
          REVIEW_COUNT=$(gh pr view "$PR_NUMBER" --json reviews --jq '.reviews | length' 2>/dev/null || echo 0)
          echo "REVIEW_COUNT=$REVIEW_COUNT" >> $GITHUB_ENV

          echo "PR_DESCRIPTION<<EOF" >> $GITHUB_ENV
          echo "$LATEST_BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run AI Slop Detector
        id: slop-detector
        run: |
          SCRIPT_PATH="./scripts/find_slop.sh"
          SLOP_REPORT=""

          # 1. Verify script existence and permissions
          if [ ! -f "$SCRIPT_PATH" ]; then
            SLOP_REPORT="❌ ERROR: Slop detector script not found at $SCRIPT_PATH."
          elif [ ! -x "$SCRIPT_PATH" ]; then
            SLOP_REPORT="❌ ERROR: Slop detector script at $SCRIPT_PATH is not executable. Please run 'chmod +x $SCRIPT_PATH'."
          fi

          if [ -z "$SLOP_REPORT" ]; then # If no errors so far
            BASE_SHA=${{ needs.analyze-changes.outputs.base_sha }}
            HEAD_SHA=${{ inputs.last_non_empty_commit || needs.analyze-changes.outputs.head_sha }}

            # Create temp files
            FILE_LIST=$(mktemp)
            TEMP_OUT=$(mktemp)

            # Generate list of changed files
            if ! git diff --name-only -z "${BASE_SHA}...${HEAD_SHA}" > "$FILE_LIST" 2>/dev/null; then
              SLOP_REPORT="❌ ERROR: Failed to generate a list of changed files. This can happen in shallow clone environments."
            elif [ ! -s "$FILE_LIST" ]; then
              SLOP_REPORT="No analysis performed as no files were changed."
            else
              # Run script on changed files
              # xargs -0 will read null-delimited filenames from FILE_LIST and pass them to SCRIPT_PATH
              # Exit code 123 from xargs means "command failed" (which happens if find_slop.sh exits 1)
              EXIT_CODE=0
              xargs -0 "$SCRIPT_PATH" < "$FILE_LIST" > "$TEMP_OUT" 2>&1 || EXIT_CODE=$?

              if [ $EXIT_CODE -eq 0 ]; then
                # Exit code 0: Success, no slop found.
                SLOP_REPORT=$(<"$TEMP_OUT")
              elif [ $EXIT_CODE -eq 1 ] || [ $EXIT_CODE -eq 123 ]; then
                # Exit code 1 or 123: Slop was found, which is an expected "failure".
                SLOP_REPORT=$(<"$TEMP_OUT")
              else
                # Any other exit code indicates an unexpected script error.
                SLOP_REPORT="❌ ERROR: Slop detector script failed with unexpected exit code $EXIT_CODE.\n\n$(<"$TEMP_OUT")"
              fi
            fi

            # Cleanup
            rm -f "$FILE_LIST" "$TEMP_OUT"
          fi

          # Use a random delimiter to prevent injection attacks
          DELIMITER="EOF_$(openssl rand -hex 8)"
          echo "SLOP_ANALYSIS<<$DELIMITER" >> $GITHUB_ENV
          echo "$SLOP_REPORT" >> $GITHUB_ENV
          echo "$DELIMITER" >> $GITHUB_ENV

      - name: Get PR Checks & Logs
        id: checks
        env:
          GH_TOKEN: ${{ secrets.ARI_PAT }}
          ARI_PAT: ${{ secrets.ARI_PAT }} # Pass for redaction
          FAILURE_REPORT_JSON: ${{ inputs.failure_report_json }}
          HEAD_SHA: ${{ needs.analyze-changes.outputs.head_sha }}
        run: |
          FINAL_CHECKS_JSON="[]"
          # OPTION 1: Use the pre-compiled failure report from the caller if available and not empty
          if [ -n "$FAILURE_REPORT_JSON" ] && [ "$FAILURE_REPORT_JSON" != "[]" ]; then
            echo "::notice::Using pre-compiled failure report from workflow input."
            # The JSON is already in the correct format, just needs validation/sanitization
            # We trust the source here as it's from our own CI pipeline
            FINAL_CHECKS_JSON="$FAILURE_REPORT_JSON"
          # OPTION 2: Fallback to fetching checks live if no report is provided
          else
            echo "::notice::No pre-compiled report found. Fetching live PR checks."

            # Retry logic for fetching checks
            MAX_RETRIES=3
            RETRY_DELAY=5
            for ((i=1; i<=MAX_RETRIES; i++)); do
              RAW_CHECKS_JSON=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" --jq '.check_runs' 2>/dev/null)
              if [ -n "$RAW_CHECKS_JSON" ]; then
                echo "::notice::Successfully fetched check runs on attempt $i."
                break
              else
                echo "::warning::Attempt $i of $MAX_RETRIES to fetch check runs failed. Retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              fi
            done

            if [ -z "$RAW_CHECKS_JSON" ]; then
              echo "::error::Failed to fetch check runs after $MAX_RETRIES attempts."
              # Fallback to an empty JSON array to avoid script failure
              RAW_CHECKS_JSON="[]"
            fi

            # For debugging, output the raw JSON to the step summary
            echo "### Raw Checks JSON" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            echo "$RAW_CHECKS_JSON" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            # FIX: Filter checks to ensure details_url is not null and not empty.
            # EXCLUDE: 'Slop Check' from being injected into the prompt as it is redundant with AI instructions
            # and can be very large, consuming unnecessary tokens.
            FAILED_CHECKS_RAW_JSON=$(echo "$RAW_CHECKS_JSON" | jq -c 'map(select(.status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled") and .details_url != null and .details_url != "" and (.name | contains("Slop Check") | not)))')

            mapfile -t NAMES < <(echo "$FAILED_CHECKS_RAW_JSON" | jq -r '.[].name')
            mapfile -t CONCLUSIONS < <(echo "$FAILED_CHECKS_RAW_JSON" | jq -r '.[].conclusion // "failure"')
            mapfile -t URLS < <(echo "$FAILED_CHECKS_RAW_JSON" | jq -r '.[].details_url')
            LOG_DIR=$(mktemp -d)
            trap 'rm -rf "$LOG_DIR"' EXIT

            process_job() {
              local i=$1
              local url="${URLS[i]}"
              # Strip query parameters to avoid matching numbers in them (e.g. ?check_suite_focus=true&page=1)
              local url_no_query="${url%%\?*}"
              # Extract the last sequence of digits from the URL path, which is typically the job ID or run ID
              local job_id=$(echo "$url_no_query" | grep -oE '[0-9]+' | tail -n 1)
              local raw_log_file="$LOG_DIR/raw_log_${i}.txt"
              local redacted_log_file="$LOG_DIR/redacted_log_${i}.txt"

              touch "$redacted_log_file"

              # FIX: Improved error handling for Job ID parsing
              if ! [[ "$job_id" =~ ^[0-9]+$ ]]; then
                # Gracefully skip if no Job ID found, do not write error to file as it breaks downstream analysis
                echo "::warning::Could not parse Job ID from URL: $url. Skipping log fetch for this check."
                return 0
              fi

              # Retry logic for fetching job logs
              for ((j=1; j<=MAX_RETRIES; j++)); do
                gh job view "$job_id" --log > "$raw_log_file" 2>&1
                if [ $? -eq 0 ]; then
                  echo "::notice::Successfully fetched logs for job ${job_id} on attempt $j."
                  break
                else
                  echo "::warning::Attempt $j of $MAX_RETRIES to fetch logs for job ${job_id} failed. Retrying in ${RETRY_DELAY}s..."
                  sleep $RETRY_DELAY
                fi
              done

              if ! [ -f "$raw_log_file" ]; then
                  echo "Error: Failed to fetch logs for job ${job_id} after $MAX_RETRIES attempts." > "$raw_log_file"
              fi

              tail -c 15K "$raw_log_file" > "$raw_log_file.tmp" && mv "$raw_log_file.tmp" "$raw_log_file"
              if ! pnpm tsx scripts/redact-secrets.ts "$raw_log_file" "$redacted_log_file"; then
                echo "Error: The redaction script failed for job ${job_id}." > "$redacted_log_file"
              fi
              rm -f "$raw_log_file"
            }
            export -f process_job
            export LOG_DIR
            export -a JOB_IDS
            export -a URLS
            export MAX_RETRIES
            export RETRY_DELAY

            if [ ${#URLS[@]} -gt 0 ]; then
                seq 0 $((${#URLS[@]} - 1)) | xargs -P 4 -I {} bash -c 'process_job "{}"'
            fi

            # Combine results into the final JSON
            if [ ${#NAMES[@]} -gt 0 ]; then
                for i in $(seq 0 $((${#NAMES[@]} - 1))); do
                  LOGS=$(<"$LOG_DIR/redacted_log_${i}.txt")
                  CHECK_JSON=$(jq -n \
                    --arg name "${NAMES[i]}" \
                    --arg conclusion "${CONCLUSIONS[i]}" \
                    --arg url "${URLS[i]}" \
                    --arg logs "$LOGS" \
                    '{name: $name, conclusion: $conclusion, detailsUrl: $url, logs: $logs}')
                  FINAL_CHECKS_JSON=$(echo "$FINAL_CHECKS_JSON" | jq --argjson item "$CHECK_JSON" '. + [$item]')
                done
            fi
          fi

          # Use heredoc syntax to safely set the multiline JSON as an environment variable
          echo "FAILED_CHECKS_JSON<<EOF" >> $GITHUB_ENV
          echo "$FINAL_CHECKS_JSON" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run Gemini Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.ARI_PAT }}
          PR_DIFF_FILE: pr.diff
          FAILED_CHECKS_JSON: ${{ env.FAILED_CHECKS_JSON }}
          # Pass other context vars
          GEMINI_THOUGHT_SIGNATURE: ${{ needs.analyze-changes.outputs.thought-signature }}
        run: |
          pnpm tsx scripts/gemini-client.ts \
            --preset "review" \
            --instructions "## 📋 Additional Instructions\nIf a bug or debt is found in code CHANGED by this PR, include it in reviewComment. If a bug or debt is found in code NOT CHANGED by this PR (base branch legacy code), include it in suggestedIssues." \
            --context "docs/DEVELOPMENT.md,docs/DESIGN_GUIDELINES.md,docs/TYPESCRIPT_PATTERNS.md,.github/copilot-instructions.md,docs/CODE_REVIEW_GUIDELINES.md" \
            --output "review_result.json"

      - name: Upload review result
        id: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: review-result
          path: review_result.json

      - name: Post Review Comment
        env:
          GITHUB_TOKEN: ${{ secrets.ARI_PAT }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ needs.analyze-changes.outputs.head_sha }}
        run: |
          if [ -f "review_result.json" ]; then
            # Extract the original comment
            REVIEW_COMMENT=$(jq -r '.reviewComment // empty' review_result.json)

            # Check if there's a comment to post
            if [[ -n "$REVIEW_COMMENT" && "$REVIEW_COMMENT" != "null" ]]; then
              # Create the commit hash line
              COMMIT_HASH_MSG="> Reviewed commit: \`${HEAD_SHA}\`"

              # Create manual trigger footer
              FOOTER="\n\n---\n#### 🤖 [Gemini Manual Trigger Guide](${{ github.server_url }}/${{ github.repository }}/blob/leader/docs/workflows/MANUAL_TRIGGERS.md)"

              # Extract the new thought signature if present
              NEW_THOUGHT_SIG=$(jq -r '.thoughtSignature // ""' review_result.json)
              SIG_MARKER=""
              if [[ -n "$NEW_THOUGHT_SIG" && "$NEW_THOUGHT_SIG" != "null" ]]; then
                SIG_MARKER="\n\n<!-- thought_signature: ${NEW_THOUGHT_SIG} -->"
              fi

              # Combine the header and the original comment
              FINAL_COMMENT="${COMMIT_HASH_MSG}\n\n${REVIEW_COMMENT}${FOOTER}${SIG_MARKER}"

              # Write to a file to be used by the gh cli command
              echo -e "$FINAL_COMMENT" > review_comment.txt

              # Post the combined comment
              gh pr comment "$PR_NUMBER" --body-file review_comment.txt
            fi
          fi

  manage-labels:
    name: Manage PR Labels
    needs: [analyze-changes, gemini-review]
    # Always run to ensure a label is applied, as long as analyze-changes succeeded
    if: |
      always() &&
      needs.analyze-changes.result == 'success' &&
      !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Install jq
        run: |
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event.pull_request || github.event.issue.pull_request) && format('refs/pull/{0}/head', inputs.pr_number || github.event.pull_request.number || github.event.issue.number) || github.sha }}
          fetch-depth: 0

      - name: Download review result
        uses: actions/download-artifact@v8
        with:
          name: review-result
          path: .
        continue-on-error: true

      - name: Manage Labels
        env:
          GH_TOKEN: ${{ secrets.ARI_PAT }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
          NEEDS_REVIEW: ${{ needs.analyze-changes.outputs.needs-review }}
        run: ./.github/scripts/manage-pr-labels.sh

  disabled-guidance:
    if: |
      vars.GEMINI_ENABLE_PR_REVIEW == 'false' &&
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Post Guidance Comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = '### ℹ️ Gemini Review Disabled\n\n' +
              'Automatic review is currently disabled via `GEMINI_ENABLE_PR_REVIEW`. To run review manually:\n\n' +
              '**Via Comment:**\n```\n@gemini-bot\n```\n\n' +
              '**Via GitHub Actions:**\n' +
              '1. Go to [Actions → Reusable Gemini Review](' + context.payload.repository.html_url + '/actions/workflows/reusable-gemini-review.yml)\n' +
              '2. Click "Run workflow"\n' +
              '3. Enter PR number: `' + context.payload.pull_request.number + '`\n\n' +
              '**Via GitHub CLI:**\n```bash\ngh workflow run reusable-gemini-review.yml -f pr_number=' + context.payload.pull_request.number + '\n```\n\n' +
              '#### 🤖 [Gemini Manual Trigger Guide](' + context.payload.repository.html_url + '/blob/leader/docs/workflows/MANUAL_TRIGGERS.md)\n\n' +
              '**To re-enable:** Set repository variable `GEMINI_ENABLE_PR_REVIEW=true`';

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });

  post-skip-check:
    name: Post Skip Check
    needs: analyze-changes
    if: |
      needs.analyze-changes.outputs.needs-review == 'false' &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Create skip check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const skipReason = '${{ needs.analyze-changes.outputs.skip-reason }}';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Gemini Code Review',
              head_sha: '${{ inputs.head_sha || github.event.pull_request.head.sha }}',
              status: 'completed',
              conclusion: 'skipped',
              output: {
                title: 'Review Skipped',
                summary: `Review was skipped for the following reason: ${skipReason}`
              }
            });

      - name: Post Skip Comment
        uses: actions/github-script@v7
        with:
          script: |
            const skipReason = '${{ needs.analyze-changes.outputs.skip-reason }}';
            const triggerEvent = '${{ inputs.trigger_event }}';

            // Only post skip comment if it was a manual trigger or a significant reason
            // We want to avoid noise for every single automatic PR synchronize event with no changes
            const ignoreList = ['already reviewed', 'no significant code changes'];
            const shouldIgnore = ignoreList.some(reason => skipReason.toLowerCase().includes(reason));

            if (triggerEvent === 'comment' || !shouldIgnore) {
              const body = '### 🤖 Gemini Review Skipped\n\nReview was skipped for the following reason: `' + skipReason + '`' +
                '\n\n#### 🤖 [Gemini Manual Trigger Guide](' + context.payload.repository.html_url + '/blob/leader/docs/workflows/MANUAL_TRIGGERS.md)';

              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body
              });
            }
