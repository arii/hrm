# .github/workflows/reusable-gemini-review.yml
name: Reusable Gemini Review

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  gemini-review:
    runs-on: self-hosted
    steps:
      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          fetch-depth: 0
      - name: Run Gemini Review
        run: pnpm tsx scripts/gemini-client.ts --command "review"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.ARI_PAT }}
