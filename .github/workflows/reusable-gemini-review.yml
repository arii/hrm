# .github/workflows/reusable-gemini-review.yml
name: Reusable Gemini Review

on:
  workflow_call:
    inputs:
      trigger_event:
        description: 'The event that triggered the workflow (pull_request or comment)'
        required: true
        type: string
      pr_quality_result:
        description: 'The result of the pr-quality job (success, failure, skipped, not_applicable)'
        required: true
        type: string
      comment_body:
        description: 'The body of the comment that triggered the workflow'
        required: false
        type: string
    secrets:
      GEMINI_API_KEY:
        required: true
      ARI_PAT:
        required: true
    outputs:
      needs-review:
        description: 'Whether a re-review is needed'
        value: ${{ jobs.analyze-changes.outputs.needs-review }}
      skip-reason:
        description: 'Reason for skipping review'
        value: ${{ jobs.analyze-changes.outputs.skip-reason }}

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  analyze-changes:
    name: Analyze Changes for Review
    runs-on: ubuntu-latest
    outputs:
      needs-review: ${{ steps.decision.outputs.needs-review }}
      skip-reason: ${{ steps.decision.outputs.skip-reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide Review Strategy
        id: decision
        env:
          TRIGGER_EVENT: ${{ inputs.trigger_event }}
          COMMENT_BODY: ${{ inputs.comment_body }}
          PR_QUALITY_RESULT: ${{ inputs.pr_quality_result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.ARI_PAT }}
        run: |
          NEEDS_REVIEW="false"
          SKIP_REASON="no criteria met"

          # --- Initial review on PR open ---
          if [[ "$TRIGGER_EVENT" == "pull_request" && "${{ github.event.action }}" == "opened" ]]; then
            echo "::info::PR opened. Triggering initial review."
            NEEDS_REVIEW="true"
          # --- Handle manual comment triggers ---
          elif [[ "$TRIGGER_EVENT" == "comment" ]]; then
             if [[ "$COMMENT_BODY" == *@gemini-bot* || "$COMMENT_BODY" == *@jules* ]]; then
               echo "::info::Manual/CI-failure review triggered by comment."
               NEEDS_REVIEW="true"
             fi
          # --- Handle re-reviews on code synchronization ---
          elif [[ "$TRIGGER_EVENT" == "pull_request" && "${{ github.event.action }}" == "synchronize" ]]; then
            echo "::info::Code synchronized. Analyzing for re-review..."

            PR_DATA=$(gh pr view "$PR_NUMBER" --json comments -q '.comments | map(select(.author.login? == "arii")) | .[-1].createdAt // ""')
            LAST_COMMENT_TIMESTAMP="$PR_DATA"

            if [ -n "$LAST_COMMENT_TIMESTAMP" ]; then
                COMMENT_TIME=$(date -d "$LAST_COMMENT_TIMESTAMP" +%s)
                CURRENT_TIME=$(date +%s)
                TIME_DIFF=$((CURRENT_TIME - COMMENT_TIME))
                if [ "$TIME_DIFF" -lt 300 ]; then # 5 minutes
                    SKIP_REASON="too recent (${TIME_DIFF}s ago)"
                    echo "needs-review=false" >> $GITHUB_OUTPUT
                    echo "skip-reason=$SKIP_REASON" >> $GITHUB_OUTPUT
                    exit 0
                fi
            fi

            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            SIGNIFICANT_COUNT=$(echo "$CHANGED_FILES" | grep -vE '(\.md$|\.png$|\.svg$|package-lock\.json$|\.gitignore$)' | wc -l)

            if [[ "$SIGNIFICANT_COUNT" -eq 0 ]]; then
                SKIP_REASON="no significant code changes"
                echo "needs-review=false" >> $GITHUB_OUTPUT
                echo "skip-reason=$SKIP_REASON" >> $GITHUB_OUTPUT
                exit 0
            fi

            COMMIT_MSG=$(git log -1 --pretty=format:"%s")
            if [[ "$COMMIT_MSG" =~ ^(docs?|chore|style): ]]; then
                SKIP_REASON="trivial commit message"
                echo "needs-review=false" >> $GITHUB_OUTPUT
                echo "skip-reason=$SKIP_REASON" >> $GITHUB_OUTPUT
                exit 0
            fi

            echo "::info::Significant changes detected and cooldown passed. Triggering re-review."
            NEEDS_REVIEW="true"
          else
            SKIP_REASON="unhandled event trigger"
          fi

          echo "needs-review=$NEEDS_REVIEW" >> $GITHUB_OUTPUT
          echo "skip-reason=$SKIP_REASON" >> $GITHUB_OUTPUT

  gemini-review:
    name: Execute Gemini Review
    needs: analyze-changes
    if: needs.analyze-changes.outputs.needs-review == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Get PR Diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.ARI_PAT }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} --patch > pr.diff

      - name: Gather PR Context
        id: context
        env:
          GH_TOKEN: ${{ secrets.ARI_PAT }}
          # Map the body to an env var first to avoid shell injection issues
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "PR_TITLE=${{ github.event.pull_request.title }}" >> $GITHUB_ENV
          echo "PR_AUTHOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_ENV

          # Fix: Use heredoc syntax for multi-line content
          echo "PR_DESCRIPTION<<EOF" >> $GITHUB_ENV
          echo "$PR_BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Get PR Checks
        id: checks
        env:
          GH_TOKEN: ${{ secrets.ARI_PAT }}
        run: |
          CHECKS_JSON=$(gh pr checks ${{ github.event.pull_request.number }} --json name,conclusion,detailsUrl | jq -c 'map(select(.conclusion == "failure" or .conclusion == "cancelled"))')
          echo "FAILED_CHECKS_JSON=${CHECKS_JSON}" >> $GITHUB_ENV

      - name: Run Gemini Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.ARI_PAT }}
          PR_DIFF_FILE: pr.diff
          FAILED_CHECKS_JSON: ${{ env.FAILED_CHECKS_JSON }}
          # Pass other context vars
        run: |
          pnpm tsx scripts/gemini-client.ts \
            --preset "review" \
            --context "docs/DEVELOPMENT.md,docs/DESIGN_GUIDELINES.md,docs/TYPESCRIPT_PATTERNS.md" \
            --output "review_result.json"

      - name: Post Review Comment
        env:
          GITHUB_TOKEN: ${{ secrets.ARI_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f "review_result.json" ]; then
            jq -r '.reviewComment // empty' review_result.json > review_comment.txt
            if [ -s review_comment.txt ]; then
              gh pr comment "$PR_NUMBER" --body-file review_comment.txt
            fi
          fi

  post-skip-check:
    name: Post Skip Check
    needs: analyze-changes
    if: needs.analyze-changes.outputs.needs-review == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Create skip check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ARI_PAT }}
          script: |
            const skipReason = '${{ needs.analyze-changes.outputs.skip-reason }}';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Gemini Code Review',
              head_sha: '${{ github.event.pull_request.head.sha }}',
              status: 'completed',
              conclusion: 'skipped',
              output: {
                title: 'Review Skipped',
                summary: `Review was skipped for the following reason: ${skipReason}`
              }
            });
