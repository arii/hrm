# .github/workflows/reusable-gemini-review.yml
name: Reusable Gemini Review

on:
  workflow_call:
    inputs:
      trigger_event:
        description: 'The event that triggered the workflow (pull_request or comment)'
        required: true
        type: string
      pr_quality_result:
        description: 'The result of the pr-quality job (success, failure, skipped, not_applicable)'
        required: true
        type: string
      comment_body:
        description: 'The body of the comment that triggered the workflow'
        required: false
        type: string
      last_non_empty_commit:
        description: 'The SHA of the last non-empty commit'
        required: false
        type: string
    secrets:
      GEMINI_API_KEY:
        required: true
    outputs:
      needs-review:
        description: 'Whether a re-review is needed'
        value: ${{ jobs.analyze-changes.outputs.needs-review }}
      skip-reason:
        description: 'Reason for skipping review'
        value: ${{ jobs.analyze-changes.outputs.skip-reason }}

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  actions: read

jobs:
  analyze-changes:
    name: Analyze Changes for Review
    runs-on: ubuntu-latest
    outputs:
      needs-review: ${{ steps.decision.outputs.needs-review }}
      skip-reason: ${{ steps.decision.outputs.skip-reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide Review Strategy
        id: decision
        env:
          TRIGGER_EVENT: ${{ inputs.trigger_event }}
          COMMENT_BODY: ${{ inputs.comment_body }}
          PR_QUALITY_RESULT: ${{ inputs.pr_quality_result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.ARI_PAT }}
        run: |
          NEEDS_REVIEW="false"
          SKIP_REASON="no criteria met"

          # --- Check for quality check failures first ---
          if [[ "$PR_QUALITY_RESULT" != "success" ]]; then
            echo "::info::Quality checks failed. Triggering review to analyze failures."
            NEEDS_REVIEW="true"
            SKIP_REASON=""
          # --- Initial review on PR open ---
          elif [[ "$TRIGGER_EVENT" == "pull_request" && "${{ github.event.action }}" == "opened" ]]; then
            echo "::info::PR opened. Triggering initial review."
            NEEDS_REVIEW="true"
          # --- Handle manual comment triggers ---
          elif [[ "$TRIGGER_EVENT" == "comment" ]]; then
             if [[ "$COMMENT_BODY" == *@gemini-bot* || "$COMMENT_BODY" == *@jules* ]]; then
               echo "::info::Manual/CI-failure review triggered by comment."
               NEEDS_REVIEW="true"
             fi
          # --- Handle re-reviews on code synchronization ---
          elif [[ "$TRIGGER_EVENT" == "pull_request" && "${{ github.event.action }}" == "synchronize" ]]; then
            echo "::info::Code synchronized. Analyzing for re-review..."

            # Check for recent review comments (containing "## Review" or "Review Summary" to exclude test reports)
            PR_DATA=$(gh pr view "$PR_NUMBER" --json comments -q '.comments | map(select(.author.login? == "arii" and (.body | contains("## Review") or contains("Review Summary") or contains("Suggested Fix")))) | .[-1].createdAt // ""')
            LAST_REVIEW_TIMESTAMP="$PR_DATA"

            if [ -n "$LAST_REVIEW_TIMESTAMP" ]; then
                REVIEW_TIME=$(date -d "$LAST_REVIEW_TIMESTAMP" +%s)
                CURRENT_TIME=$(date +%s)
                TIME_DIFF=$((CURRENT_TIME - REVIEW_TIME))
                if [ "$TIME_DIFF" -lt 300 ]; then # 5 minutes
                    SKIP_REASON="recent review exists (${TIME_DIFF}s ago)"
                    echo "needs-review=false" >> $GITHUB_OUTPUT
                    echo "skip-reason=$SKIP_REASON" >> $GITHUB_OUTPUT
                    exit 0
                fi
            else
                # No previous review found, trigger a new one
                echo "::info::No previous review found. Triggering initial review."
                NEEDS_REVIEW="true"
            fi

            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            SIGNIFICANT_COUNT=$(echo "$CHANGED_FILES" | grep -vE '(\.md$|\.png$|\.svg$|package-lock\.json$|\.gitignore$)' | wc -l)

            if [[ "$SIGNIFICANT_COUNT" -eq 0 ]]; then
                SKIP_REASON="no significant code changes"
                echo "needs-review=false" >> $GITHUB_OUTPUT
                echo "skip-reason=$SKIP_REASON" >> $GITHUB_OUTPUT
                exit 0
            fi

            COMMIT_MSG=$(git log -1 --pretty=format:"%s")
            if [[ "$COMMIT_MSG" =~ ^(docs?|chore|style): ]]; then
                SKIP_REASON="trivial commit message"
                echo "needs-review=false" >> $GITHUB_OUTPUT
                echo "skip-reason=$SKIP_REASON" >> $GITHUB_OUTPUT
                exit 0
            fi

            echo "::info::Significant changes detected and cooldown passed. Triggering re-review."
            NEEDS_REVIEW="true"
          else
            SKIP_REASON="unhandled event trigger"
          fi

          echo "needs-review=$NEEDS_REVIEW" >> $GITHUB_OUTPUT
          echo "skip-reason=$SKIP_REASON" >> $GITHUB_OUTPUT

  gemini-review:
    name: Execute Gemini Review
    needs: analyze-changes
    if: needs.analyze-changes.outputs.needs-review == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Get PR Diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.last_non_empty_commit }}" ]; then
            git diff ${{ github.event.pull_request.base.sha }}...${{ inputs.last_non_empty_commit }} > pr.diff
          else
            gh pr diff ${{ github.event.pull_request.number }} --patch > pr.diff
          fi

      - name: Gather PR Context
        id: context
        env:
          GH_TOKEN: ${{ secrets.ARI_PAT }}
          # Map the body to an env var first to avoid shell injection issues
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "PR_TITLE=${{ github.event.pull_request.title }}" >> $GITHUB_ENV
          echo "PR_AUTHOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_ENV
          echo "COMMIT_HASH=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV

          # Fix: Use heredoc syntax for multi-line content
          echo "PR_DESCRIPTION<<EOF" >> $GITHUB_ENV
          echo "$PR_BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Get PR Checks & Logs
        id: checks
        env:
          GH_TOKEN: ${{ secrets.ARI_PAT }}
          ARI_PAT: ${{ secrets.ARI_PAT }} # Pass for redaction
        run: |
          FAILED_CHECKS_RAW_JSON=$(gh pr checks ${{ github.event.pull_request.number }} --json name,conclusion,detailsUrl | jq -c 'map(select(.conclusion == "failure" or .conclusion == "cancelled"))')
          FINAL_CHECKS_JSON="[]"

          mapfile -t NAMES < <(echo "$FAILED_CHECKS_RAW_JSON" | jq -r '.[].name')
          mapfile -t CONCLUSIONS < <(echo "$FAILED_CHECKS_RAW_JSON" | jq -r '.[].conclusion')
          mapfile -t URLS < <(echo "$FAILED_CHECKS_RAW_JSON" | jq -r '.[].detailsUrl')
          mapfile -t JOB_IDS < <(echo "$FAILED_CHECKS_RAW_JSON" | jq -r '.[].detailsUrl | split("/")[-1]')

          LOG_DIR=$(mktemp -d)

          process_job() {
            local i=$1
            local job_id=${JOB_IDS[i]}
            local job_name=${NAMES[i]}
            local job_url=${URLS[i]}
            local raw_log_file="$LOG_DIR/raw_log_${i}.txt"
            local redacted_log_file="$LOG_DIR/redacted_log_${i}.txt"
            local summary_file="$LOG_DIR/summary_${i}.txt"

            if ! [[ "$job_id" =~ ^[0-9]+$ ]]; then
              echo "Error: Could not parse Job ID from URL." > "$redacted_log_file"
            else
              gh job view "$job_id" --log > "$raw_log_file" 2>&1 || echo "Error: Failed to fetch logs for job ${job_id}." > "$raw_log_file"
              tail -c 25K "$raw_log_file" > "$raw_log_file.tmp" && mv "$raw_log_file.tmp" "$raw_log_file"
              if ! pnpm tsx scripts/redact-secrets.ts "$raw_log_file" "$redacted_log_file" > "$redacted_log_file.log" 2>&1; then
                echo "Error: Redaction script failed for job ${job_id}." > "$redacted_log_file"
                cat "$redacted_log_file.log" >> "$redacted_log_file"
              fi
            fi

            if [[ "$job_name" == *"visual"* || "$job_name" == *"e2e"* || "$job_name" == *"playwright"* ]]; then
              echo "Playwright job detected: '$job_name'. Fetching artifact summary."
              local run_id=$(echo "$job_url" | grep -oP 'runs/\K[0-9]+')
              if [[ -n "$run_id" ]]; then
                local artifact_dir=$(mktemp -d)
                if gh run download "$run_id" -n playwright-report -D "$artifact_dir" >/dev/null 2>&1; then
                  unzip -q "$artifact_dir/playwright-report" -d "$artifact_dir/unzipped_report" >/dev/null 2>&1
                  local report_json_path="$artifact_dir/unzipped_report/data/report.json"
                  if [[ -f "$report_json_path" ]]; then
                    jq -r '
                      .suites[] | .. | .specs? // empty | .[] | select(.ok | not) |
                      "Test: " + .title + "\nError: " + (.tests[].results[] | select(.error) | .error.message)
                    ' "$report_json_path" 2>/dev/null | sed 's/\\n/ /g' | head -c 8000 > "$summary_file"
                  else
                    echo "Playwright report.json not found." > "$summary_file"
                  fi
                else
                  echo "Failed to download Playwright report artifact." > "$summary_file"
                fi
                rm -rf "$artifact_dir"
              else
                echo "Could not determine run_id for Playwright job." > "$summary_file"
              fi
            fi
          }
          export -f process_job
          export LOG_DIR
          export -a JOB_IDS NAMES URLS

          seq 0 $((${#JOB_IDS[@]} - 1)) | xargs -n 1 -P 4 -I {} bash -c 'process_job "{}"'

          FINAL_CHECKS_JSON="[]"
          for i in $(seq 0 $((${#NAMES[@]} - 1))); do
            LOGS=$(<"$LOG_DIR/redacted_log_${i}.txt")
            SUMMARY_FILE="$LOG_DIR/summary_${i}.txt"
            if [[ -f "$SUMMARY_FILE" && -s "$SUMMARY_FILE" ]]; then
              SUMMARY_CONTENT=$(<"$SUMMARY_FILE")
              SUMMARY_HEADER="### Playwright Failure Summary (from Artifacts)"
              LOGS=$(printf '%s\n\n%s\n\n%s' "$SUMMARY_HEADER" "$SUMMARY_CONTENT" "$LOGS")
            fi
            CHECK_JSON=$(jq -n \
              --arg name "${NAMES[i]}" \
              --arg conclusion "${CONCLUSIONS[i]}" \
              --arg url "${URLS[i]}" \
              --arg logs "$LOGS" \
              '{name: $name, conclusion: $conclusion, detailsUrl: $url, logs: $logs}')
            FINAL_CHECKS_JSON=$(echo "$FINAL_CHECKS_JSON" | jq --argjson item "$CHECK_JSON" '. + [$item]')
          done

          rm -rf "$LOG_DIR"

          echo "FAILED_CHECKS_JSON<<EOF" >> $GITHUB_ENV
          echo "$FINAL_CHECKS_JSON" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run Gemini Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.ARI_PAT }}
          PR_DIFF_FILE: pr.diff
          FAILED_CHECKS_JSON: ${{ env.FAILED_CHECKS_JSON }}
          # Pass other context vars
        run: |
          pnpm tsx scripts/gemini-client.ts \
            --preset "review" \
            --context "docs/DEVELOPMENT.md,docs/DESIGN_GUIDELINES.md,docs/TYPESCRIPT_PATTERNS.md" \
            --output "review_result.json"

      - name: Post Review Comment
        env:
          GITHUB_TOKEN: ${{ secrets.ARI_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f "review_result.json" ]; then
            jq -r '.reviewComment // empty' review_result.json > review_comment.txt
            if [ -s review_comment.txt ]; then
              gh pr comment "$PR_NUMBER" --body-file review_comment.txt
            fi
          fi

      - name: Create Issues from Artifacts
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.ARI_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f "review_result.json" ]; then
            jq -c '.artifacts[] | select(.category == "technical-debt" or .category == "refactor-needed" or .category == "security" or .category == "performance" or .category == "documentation")' review_result.json | while read -r artifact; do
              title=$(echo "$artifact" | jq -r .title)
              body=$(echo "$artifact" | jq -r .description)
              category=$(echo "$artifact" | jq -r .category)

              # Add reference to the PR that generated the issue
              body+="\n\n*Created from review of PR #${PR_NUMBER}*"

              gh issue create --title "$title" --body "$body" --label "$category"
            done
          fi

  post-skip-check:
    name: Post Skip Check
    needs: analyze-changes
    if: needs.analyze-changes.outputs.needs-review == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Create skip check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const skipReason = '${{ needs.analyze-changes.outputs.skip-reason }}';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Gemini Code Review',
              head_sha: '${{ github.event.pull_request.head.sha }}',
              status: 'completed',
              conclusion: 'skipped',
              output: {
                title: 'Review Skipped',
                summary: `Review was skipped for the following reason: ${skipReason}`
              }
            });
