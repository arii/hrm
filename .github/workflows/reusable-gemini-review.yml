name: Reusable Gemini Review
on:
  workflow_call:
    secrets:
      GEMINI_API_KEY:
        required: true
      ARI_PAT:
        required: true

jobs:
  review:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for diff analysis

      - uses: pnpm/action-setup@v4
        # with:
        #   version: 9  # Removed to avoid conflict with package.json "packageManager" field

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies with fallback
        id: install
        continue-on-error: true
        run: |
          if ! pnpm install --frozen-lockfile; then
            echo "LOCKFILE_MISMATCH=true" >> $GITHUB_ENV
            pnpm install && echo "INSTALL_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "INSTALL_SUCCESS=true" >> $GITHUB_ENV
          fi

      # ============================================================================
      # CONTEXT GATHERING - Collect all relevant information for intelligent review
      # ============================================================================

      - name: Analyze PR Change Patterns
        id: analyze_changes
        run: |
          # Get the diff between base and current
          DIFF_STATS=$(git diff --stat ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})

          # Count total files changed
          FILES_CHANGED=$(echo "$DIFF_STATS" | wc -l)
          FILES_CHANGED=$((FILES_CHANGED - 1))  # Remove summary line

          # Calculate LOC changed
          LOC_CHANGED=$(git diff --shortstat ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | grep -oP '\d+(?= insertion)' || echo "0")
          LOC_DELETED=$(git diff --shortstat ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | grep -oP '\d+(?= deletion)' || echo "0")
          TOTAL_LOC=$((LOC_CHANGED + LOC_DELETED))

          # Determine review depth based on size
          # Thresholds:
          # < 100 LOC: Detailed review (catch nitpicks, style, deep logic)
          # < 400 LOC: Standard review (correctness, architecture, security)
          # >= 400 LOC: Focused review (architecture, critical paths, public APIs)
          # Note: These values are heuristics based on typical reviewer capacity.
          if [ $TOTAL_LOC -lt 100 ]; then
            REVIEW_DEPTH="detailed"
          elif [ $TOTAL_LOC -lt 400 ]; then
            REVIEW_DEPTH="standard"
          else
            REVIEW_DEPTH="focused"
          fi

          echo "FILES_CHANGED=$FILES_CHANGED" >> $GITHUB_ENV
          echo "TOTAL_LOC=$TOTAL_LOC" >> $GITHUB_ENV
          echo "REVIEW_DEPTH=$REVIEW_DEPTH" >> $GITHUB_ENV

          # Identify file types and architectural areas
          git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | \
            awk -F/ '{print $1}' | sort | uniq > changed_areas.txt

          CHANGED_AREAS=$(cat changed_areas.txt | tr '\n' ',' | sed 's/,$//')
          echo "CHANGED_AREAS=$CHANGED_AREAS" >> $GITHUB_ENV

      - name: Get PR Diff with Context
        id: diff
        run: |
          # Get unified diff with more context for better understanding
          gh pr diff ${{ github.event.pull_request.number }} --patch > pr.diff

          # Also get a stat summary
          gh pr diff ${{ github.event.pull_request.number }} > pr_summary.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Gather Review History
        id: review_history
        run: |
          # Get all previous review comments from Gemini/bot
          PREVIOUS_REVIEWS=$(gh pr view ${{ github.event.pull_request.number }} \
            --json comments \
            --jq '[.comments[] | select(.author.login == "arii") | {body: .body, createdAt: .createdAt}]')

          echo "PREVIOUS_REVIEWS<<EOF" >> $GITHUB_ENV
          echo "$PREVIOUS_REVIEWS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          # Count number of review iterations
          REVIEW_COUNT=$(echo "$PREVIOUS_REVIEWS" | jq '. | length')
          echo "REVIEW_COUNT=$REVIEW_COUNT" >> $GITHUB_ENV

          # Get resolved conversations (GitHub doesn't expose this via CLI easily, so we approximate)
          RESOLVED_COUNT=$(gh pr view ${{ github.event.pull_request.number }} \
            --json reviewThreads \
            --jq '[.reviewThreads[] | select(.isResolved == true)] | length' || echo "0")
          echo "RESOLVED_COUNT=$RESOLVED_COUNT" >> $GITHUB_ENV

          # Check if there are any "requested changes" reviews
          CHANGES_REQUESTED=$(gh pr view ${{ github.event.pull_request.number }} \
            --json reviews \
            --jq '[.reviews[] | select(.state == "CHANGES_REQUESTED")] | length')
          echo "CHANGES_REQUESTED=$CHANGES_REQUESTED" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get Issue Context
        id: context
        run: |
          # Get linked issue body
          ISSUE_NUMBER=$(gh pr view ${{ github.event.pull_request.number }} \
            --json closingIssuesReferences \
            --jq '.closingIssuesReferences[0].number' || echo "")

          if [ -n "$ISSUE_NUMBER" ] && [ "$ISSUE_NUMBER" != "null" ]; then
            ISSUE_BODY=$(gh issue view $ISSUE_NUMBER --json body --jq '.body')
            ISSUE_TITLE=$(gh issue view $ISSUE_NUMBER --json title --jq '.title')
            ISSUE_LABELS=$(gh issue view $ISSUE_NUMBER --json labels --jq '[.labels[].name] | join(",")')

            echo "LINKED_ISSUE_BODY<<EOF" >> $GITHUB_ENV
            echo "$ISSUE_BODY" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> $GITHUB_ENV
            echo "ISSUE_TITLE=$ISSUE_TITLE" >> $GITHUB_ENV
            echo "ISSUE_LABELS=$ISSUE_LABELS" >> $GITHUB_ENV
          else
            echo "LINKED_ISSUE_BODY=" >> $GITHUB_ENV
            echo "ISSUE_NUMBER=" >> $GITHUB_ENV
          fi

          # Get PR Labels
          PR_LABELS=$(gh pr view ${{ github.event.pull_request.number }} \
            --json labels \
            --jq '[.labels[].name] | join(",")')
          echo "PR_LABELS=$PR_LABELS" >> $GITHUB_ENV

          # Get commit messages for additional context
          COMMIT_MESSAGES=$(gh pr view ${{ github.event.pull_request.number }} \
            --json commits \
            --jq '[.commits[].commit.message] | join("\n---\n")')
          echo "COMMIT_MESSAGES<<EOF" >> $GITHUB_ENV
          echo "$COMMIT_MESSAGES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check for Test Changes
        id: test_coverage
        run: |
          # Check if tests were modified
          TEST_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | \
            grep -E '(test|spec|__tests__|\.test\.|\.spec\.)' || echo "")

          if [ -n "$TEST_FILES" ]; then
            # Using a local variable because variables written to GITHUB_ENV are not available
            # in the current step context via ${{ env.VAR }} immediately after writing.
            HAS_TEST_CHANGES_VAR="true"
            echo "HAS_TEST_CHANGES=true" >> $GITHUB_ENV
            echo "TEST_FILES<<EOF" >> $GITHUB_ENV
            echo "$TEST_FILES" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            HAS_TEST_CHANGES_VAR="false"
            echo "HAS_TEST_CHANGES=false" >> $GITHUB_ENV
          fi

          # Check if source files without tests were changed
          SOURCE_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | \
            grep -E '\.(ts|tsx|js|jsx)$' | \
            grep -v -E '(test|spec|__tests__|\.test\.|\.spec\.)' || echo "")

          if [ -n "$SOURCE_FILES" ] && [ "$HAS_TEST_CHANGES_VAR" == "false" ]; then
            echo "MISSING_TESTS=true" >> $GITHUB_ENV
          else
            echo "MISSING_TESTS=false" >> $GITHUB_ENV
          fi

      # ============================================================================
      # INTELLIGENT REVIEW - Context-aware AI review with progressive focus
      # ============================================================================

      - name: Run Intelligent Gemini Review
        id: gemini
        if: env.INSTALL_SUCCESS == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # PR Metadata
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_DESCRIPTION: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ env.PR_LABELS }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}

          # Change Analysis
          FILES_CHANGED: ${{ env.FILES_CHANGED }}
          TOTAL_LOC: ${{ env.TOTAL_LOC }}
          REVIEW_DEPTH: ${{ env.REVIEW_DEPTH }}
          CHANGED_AREAS: ${{ env.CHANGED_AREAS }}

          # Review History
          REVIEW_COUNT: ${{ env.REVIEW_COUNT }}
          RESOLVED_COUNT: ${{ env.RESOLVED_COUNT }}
          CHANGES_REQUESTED: ${{ env.CHANGES_REQUESTED }}
          PREVIOUS_REVIEWS: ${{ env.PREVIOUS_REVIEWS }}

          # Context
          LINKED_ISSUE_BODY: ${{ env.LINKED_ISSUE_BODY }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          ISSUE_TITLE: ${{ env.ISSUE_TITLE }}
          ISSUE_LABELS: ${{ env.ISSUE_LABELS }}
          COMMIT_MESSAGES: ${{ env.COMMIT_MESSAGES }}

          # Test Coverage
          HAS_TEST_CHANGES: ${{ env.HAS_TEST_CHANGES }}
          MISSING_TESTS: ${{ env.MISSING_TESTS }}
          TEST_FILES: ${{ env.TEST_FILES }}

          # Context Files
          REVIEW_CONTEXT_FILES: ${{ vars.REVIEW_CONTEXT_FILES || 'DEVELOPMENT.md,DESIGN_GUIDELINES.md,docs/audits/AUDIT_CODE_HYGIENE.md' }}

          # Diff File (Critical for review)
          PR_DIFF_FILE: pr.diff
        run: |
          npx tsx scripts/gemini-client.ts \
            --preset review \
            --context "$REVIEW_CONTEXT_FILES" \
            --output "review_result.json"

      # ============================================================================
      # SMART FEEDBACK - Progressive feedback based on review iteration
      # ============================================================================

      - name: Determine Review Type
        if: steps.gemini.outcome == 'success'
        id: review_type
        run: |
          # Determine if this is initial review or re-review
          if [ "${{ env.REVIEW_COUNT }}" -eq "0" ]; then
            echo "REVIEW_TYPE=initial" >> $GITHUB_ENV
            echo "FEEDBACK_STYLE=comprehensive" >> $GITHUB_ENV
          elif [ "${{ env.REVIEW_COUNT }}" -eq "1" ]; then
            echo "REVIEW_TYPE=first_revision" >> $GITHUB_ENV
            echo "FEEDBACK_STYLE=focused" >> $GITHUB_ENV
          else
            echo "REVIEW_TYPE=subsequent_revision" >> $GITHUB_ENV
            echo "FEEDBACK_STYLE=critical_only" >> $GITHUB_ENV
          fi

          # Check if we're close to approval
          if [ "${{ env.RESOLVED_COUNT }}" -gt "3" ] && [ "${{ env.CHANGES_REQUESTED }}" -eq "0" ]; then
            echo "NEAR_APPROVAL=true" >> $GITHUB_ENV
          else
            echo "NEAR_APPROVAL=false" >> $GITHUB_ENV
          fi

          # Check for excessive comment loops (prevent code review spam)
          TOTAL_COMMENTS=$(gh pr view ${{ github.event.pull_request.number }} --json comments,reviewThreads --jq '(.comments | length) + (.reviewThreads | length)')
          
          if [ "$TOTAL_COMMENTS" -ge "15" ]; then
            echo "POST_COMMENT=false" >> $GITHUB_ENV
          else
            echo "POST_COMMENT=true" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Process Review Result with Intelligence
        if: steps.gemini.outcome == 'success' && env.POST_COMMENT == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ARI_PAT }}
          script: |
            const fs = require('fs');

            if (!fs.existsSync('review_result.json')) {
              console.log('No review result file found.');
              return;
            }

            const result = JSON.parse(fs.readFileSync('review_result.json', 'utf8'));
            let { reviewComment, labels } = result;

            // Enhance comment with context-aware header
            const reviewType = process.env.REVIEW_TYPE;
            const reviewCount = parseInt(process.env.REVIEW_COUNT) + 1;
            const filesChanged = process.env.FILES_CHANGED;
            const totalLoc = process.env.TOTAL_LOC;
            const nearApproval = process.env.NEAR_APPROVAL === 'true';

            let header = `## 🤖 Gemini Code Review (${reviewType === 'initial' ? 'Initial Review' : `Revision #${reviewCount}`})\n\n`;

            if (reviewType === 'initial') {
              header += `📊 **Change Summary:** ${filesChanged} files, ~${totalLoc} LOC\n`;
              header += `🎯 **Review Depth:** ${process.env.REVIEW_DEPTH}\n`;
              header += `📁 **Areas Changed:** ${process.env.CHANGED_AREAS}\n\n`;
            } else {
              header += `✅ **Resolved Issues:** ${process.env.RESOLVED_COUNT}\n`;
              if (nearApproval) {
                header += `🎉 **Status:** Looking good! Just a few final items to address.\n\n`;
              } else {
                header += `🔄 **Status:** In revision. Addressing previous feedback.\n\n`;
              }
            }

            // Add test coverage warning if applicable
            if (process.env.MISSING_TESTS === 'true') {
              header += `⚠️ **Test Coverage:** Source code changed without corresponding test updates.\n\n`;
            }

            // Fallback for empty review comments (Double Check)
            if (!reviewComment || reviewComment.trim() === '') {
              console.log('Detected empty review comment in workflow. Applying workflow-level fallback.');
              reviewComment = `### ✅ Verification Complete\n\n(Fallback) No significant issues found in this iteration.\n\n- **Verified:** Code changes align with requirements.\n- **Regressions:** None detected.\n- **Verdict:** Ready for approval.`;
            }

            reviewComment = header + reviewComment;

            // Post the enhanced comment
            if (reviewComment) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: reviewComment
              });
            }

            // Apply labels intelligently
            if (labels && labels.length > 0) {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: labels
              });
            }

            // Add progression labels
            if (nearApproval) {
              try {
                await github.rest.issues.addLabels({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  labels: ['ready-for-final-review']
                });
              } catch (e) {
                // Label might not exist
                console.log('Could not add ready-for-final-review label');
              }
            }

      # ============================================================================
      # ERROR HANDLING - Better failure communication
      # ============================================================================

      - name: Post Configuration Warning
        if: env.LOCKFILE_MISMATCH == 'true' && env.INSTALL_SUCCESS == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ARI_PAT }}
          script: |
            const warningComment = `## ⚠️ Configuration Issue Detected

            **Issue**: \`pnpm-lock.yaml\` is out of sync with \`package.json\`

            **Fix**: Run these commands locally:
            \`\`\`bash
            pnpm install
            git add pnpm-lock.yaml
            git commit -m "fix: update pnpm lockfile"
            git push
            \`\`\`

            **Code Review**: ${{ steps.gemini.outcome == 'success' && '✅ Completed' || '❌ Skipped' }}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: warningComment
            });

      - name: Handle Review Failure
        if: steps.gemini.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ARI_PAT }}
          script: |
            const failureComment = `## 🤖 Gemini Review Status

            **Status**: ❌ Review Failed

            The review process encountered an error. This will be automatically re-run on the next push.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: failureComment
            });

      - name: Post Review Check (Success)
        if: steps.gemini.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            let conclusion = 'success';
            let title = '✅ Review Passed';
            let summary = 'Code review completed successfully with no issues found.';
            let reviewComment = '';

            try {
              if (fs.existsSync('review_result.json')) {
                const fileContent = fs.readFileSync('review_result.json', 'utf8');
                const result = JSON.parse(fileContent);

                if (!result || typeof result !== 'object') {
                  throw new Error('Invalid result object structure');
                }

                reviewComment = result.reviewComment || '';

                if (result.verdict === 'request_changes') {
                  conclusion = 'failure';
                  title = '❌ Changes Requested';
                  const issueCount = (reviewComment.match(/##|###/g) || []).length;
                  summary = issueCount > 0 
                    ? `Review completed - ${issueCount} issue(s) found requiring changes.`
                    : 'Review completed - changes requested.';
                } else if (result.verdict === 'comment') {
                  conclusion = 'neutral';
                  title = '⚠️ Review Comment';
                  const commentCount = (reviewComment.match(/##|###/g) || []).length;
                  summary = commentCount > 0
                    ? `Review completed - ${commentCount} comment(s) provided for improvement.`
                    : 'Review completed - comments provided.';
                }
              } else {
                throw new Error('review_result.json file not found');
              }
            } catch (error) {
              console.warn('Warning: Error processing review result:', error.message);
              conclusion = 'neutral';
              title = '⚠️ Review Status Unavailable';
              summary = 'Review was generated but status could not be determined. Check the PR comment for details.';
            }

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Gemini Code Review',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: conclusion,
              output: {
                title: title,
                summary: summary
              }
            });

      - name: Post Review Check (Failure)
        if: steps.gemini.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            let summary = 'The review process encountered an error and could not be completed.';

            try {
              if (process.env.GEMINI_ERROR) {
                summary = `Review failed: ${process.env.GEMINI_ERROR}`;
              }
            } catch (error) {
              console.warn('Warning: Could not extract error details');
            }

            try {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'Gemini Code Review',
                head_sha: context.payload.pull_request.head.sha,
                status: 'completed',
                conclusion: 'failure',
                output: {
                  title: '❌ Review Failed',
                  summary: summary
                }
              });
            } catch (checkError) {
              console.error('Failed to create check:', checkError.message);
              throw checkError;
            }
