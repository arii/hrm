name: PR Review Labeler
on:
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    env:
      APPROVED_LABEL: "approved"
      CHANGES_REQUESTED_LABEL: "changes-requested"
    steps:
      - name: Label PR based on review
        uses: actions/github-script@v6
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const approvedLabel = process.env.APPROVED_LABEL;
            const changesRequestedLabel = process.env.CHANGES_REQUESTED_LABEL;

            async function removeLabelIfExists(labelName) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: prNumber,
                  name: labelName,
                });
              } catch (error) {
                if (!error.message.includes("Label does not exist")) {
                  throw error;
                }
              }
            }

            async function addLabel(labelName) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: [labelName],
              });
            }

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number: prNumber,
            });

            const latestReviewsByUser = reviews
              .filter(review => review.state === 'APPROVED' || review.state === 'CHANGES_REQUESTED')
              .reduce((acc, review) => {
                acc[review.user.id] = review;
                return acc;
              }, {});

            const hasChangesRequested = Object.values(latestReviewsByUser).some(review => review.state === 'CHANGES_REQUESTED');
            const hasApproval = Object.values(latestReviewsByUser).some(review => review.state === 'APPROVED');

            if (hasChangesRequested) {
              await addLabel(changesRequestedLabel);
              await removeLabelIfExists(approvedLabel);
            } else if (hasApproval) {
              await addLabel(approvedLabel);
              await removeLabelIfExists(changesRequestedLabel);
            } else {
              await removeLabelIfExists(approvedLabel);
              await removeLabelIfExists(changesRequestedLabel);
            }