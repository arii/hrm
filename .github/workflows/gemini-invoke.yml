name: Gemini Invoke
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  invoke:
    if: startsWith(github.event.comment.body, '@gemini-bot')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Run Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          echo "Issue Title: $ISSUE_TITLE" > context.txt
          echo "Issue Body:" >> context.txt
          echo "$ISSUE_BODY" >> context.txt

          TASK_CONTENT=$(cat context.txt)

          npx tsx scripts/gemini-client.ts \
            --task "User comment: $COMMENT_BODY. Context: $TASK_CONTENT" \
            --context "README.md,DEVELOPMENT.md,docs/agents/AGENT_TRIAGE.md" \
            --output "reply.md"

      - name: Reply to Comment
        uses: actions/github-script@v7
        with:
          script: |
             const fs = require('fs');
             try {
               const body = fs.readFileSync('reply.md', 'utf8');
               await github.rest.issues.createComment({
                 issue_number: context.issue.number,
                 owner: context.repo.owner,
                 repo: context.repo.repo,
                 body: body
               });
             } catch (e) {
               console.error('Failed to post reply:', e);
               core.setFailed('No reply generated or error posting comment');
             }
