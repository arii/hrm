name: Smart Re-Review Trigger

on:
  pull_request:
    types: [synchronize] # Triggered when new commits are pushed
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  analyze-changes:
    name: Analyze Changes for Re-Review
    runs-on: self-hosted
    outputs:
      needs-review: ${{ steps.decision.outputs.needs-review }}
      review-type: ${{ steps.decision.outputs.review-type }}
      skip-reason: ${{ steps.decision.outputs.skip-reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # REPLACED: External script with inline logic for robustness
      - name: Analyze Change Significance
        id: analyze
        run: |
          # 1. Detect Merge Commit
          # Check if the commit has more than 1 parent
          PARENT_COUNT=$(git rev-list --parents -n 1 HEAD | wc -w)
          if [ "$PARENT_COUNT" -gt 2 ]; then
            echo "IS_MERGE=1" >> $GITHUB_ENV
            echo "Detected Merge Commit"
          else
            echo "IS_MERGE=0" >> $GITHUB_ENV
          fi

          # 2. Get Commit Message
          # Get the last commit message subject
          MSG=$(git log -1 --pretty=format:"%s")
          echo "COMMIT_MSG=$MSG" >> $GITHUB_ENV

          # 3. Detect Significant Changes
          # Filter out lockfiles, docs, assets, etc.
          # Get list of changed files between base and head
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # If triggered by review, these SHAs might be stale, verify checkout
          if [[ -z "$BASE_SHA" ]]; then BASE_SHA="origin/main"; fi

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          # Count files excluding non-code assets
          SIGNIFICANT_COUNT=$(echo "$CHANGED_FILES" | grep -vE '(\.md$|\.png$|\.svg$|package-lock\.json$|\.gitignore$)' | wc -l)

          echo "SIGNIFICANT_CHANGES=$SIGNIFICANT_COUNT" >> $GITHUB_ENV
          echo "Significant files changed: $SIGNIFICANT_COUNT"

      - name: Check Review State
        id: review_state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z "$PR_NUMBER" ]]; then
            echo "Error: No PR number found context."
            exit 1
          fi

          # Check for existing "changes requested" reviews
          CHANGES_REQUESTED=$(gh pr view "$PR_NUMBER" \
            --json reviews \
            --jq '[.reviews[] | select(.state == "CHANGES_REQUESTED")] | length')

          # Check for approved reviews
          APPROVED=$(gh pr view "$PR_NUMBER" \
            --json reviews \
            --jq '[.reviews[] | select(.state == "APPROVED")] | length')

          # Get review comments count (specifically from "arii" or bot as requested)
          # Removed strict author filter to be more general, or restore if "arii" is specific bot
          REVIEW_COMMENTS=$(gh pr view "$PR_NUMBER" \
            --json comments \
            --jq '[.comments[] | select(.author.login == "arii")] | length')

          echo "CHANGES_REQUESTED=${CHANGES_REQUESTED:-0}" >> $GITHUB_ENV
          echo "APPROVED=${APPROVED:-0}" >> $GITHUB_ENV
          echo "REVIEW_COMMENTS=${REVIEW_COMMENTS:-0}" >> $GITHUB_ENV

      - name: Decide Re-Review Strategy
        id: decision
        env:
          IS_MERGE: ${{ env.IS_MERGE || 0 }}
          SIGNIFICANT_CHANGES: ${{ env.SIGNIFICANT_CHANGES || 0 }}
          COMMIT_MSG: ${{ env.COMMIT_MSG }}
          CHANGES_REQUESTED: ${{ env.CHANGES_REQUESTED || 0 }}
          APPROVED: ${{ env.APPROVED || 0 }}
          REVIEW_COMMENTS: ${{ env.REVIEW_COMMENTS || 0 }}
        run: |
          NEEDS_REVIEW="false"
          REVIEW_TYPE="none"
          SKIP_REASON="no criteria met"

          echo "Debug: Merge=$IS_MERGE, Sig=$SIGNIFICANT_CHANGES, Req=$CHANGES_REQUESTED"

          # Skip if just a merge commit with no significant changes
          if [[ "$IS_MERGE" -eq 1 && "$SIGNIFICANT_CHANGES" -eq 0 ]]; then
            echo "Skipping re-review: Merge commit with no significant changes"
            NEEDS_REVIEW="false"
            SKIP_REASON="merge"

          # Skip if commit message indicates trivial change
          elif [[ "$COMMIT_MSG" =~ ^(docs?|chore|style): ]]; then
            echo "Skipping re-review: Trivial change (docs/chore/style)"
            NEEDS_REVIEW="false"
            SKIP_REASON="trivial"

          # Trigger full re-review if changes were requested
          elif [[ "$CHANGES_REQUESTED" -gt 0 ]]; then
            NEEDS_REVIEW="true"
            REVIEW_TYPE="full"
            echo "Full re-review needed: Addressing requested changes"

          # Trigger quick re-review if outstanding comments but no approval
          elif [[ "$REVIEW_COMMENTS" -gt 0 && "$APPROVED" -eq 0 ]]; then
            NEEDS_REVIEW="true"
            REVIEW_TYPE="quick"
            echo "Quick re-review needed: Outstanding comments"

          # Trigger verification if already approved but new changes added
          elif [[ "$APPROVED" -gt 0 && "$SIGNIFICANT_CHANGES" -gt 0 ]]; then
            NEEDS_REVIEW="true"
            REVIEW_TYPE="verification"
            echo "Verification needed: New changes after approval"

          else
            echo "No re-review needed at this time"
            SKIP_REASON="no"
          fi

          echo "needs-review=$NEEDS_REVIEW" >> $GITHUB_OUTPUT
          echo "review-type=$REVIEW_TYPE" >> $GITHUB_OUTPUT
          echo "skip-reason=$SKIP_REASON" >> $GITHUB_OUTPUT

  re-review:
    name: Execute Re-Review
    needs: analyze-changes
    if: needs.analyze-changes.outputs.needs-review == 'true'
    uses: ./.github/workflows/reusable-gemini-review.yml
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ARI_PAT: ${{ secrets.ARI_PAT }}

  post-skip-check:
    name: Post Skip Check
    needs: analyze-changes
    if: needs.analyze-changes.outputs.needs-review == 'false'
    runs-on: self-hosted
    permissions:
      checks: write
    steps:
      - name: Create skip check
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const skipReason = '${{ needs.analyze-changes.outputs.skip-reason }}';
            let summary = 'Re-review was not needed for this push.';

            if (skipReason === 'merge') {
              summary = 'Merge commit detected with no significant code changes.';
            } else if (skipReason === 'trivial') {
              summary = 'Trivial change detected (docs/chore/style only).';
            } else if (skipReason === 'no') {
              summary = 'No re-review criteria were met.';
            }

            try {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'Gemini Code Review',
                head_sha: context.payload.pull_request.head.sha,
                status: 'completed',
                conclusion: 'skipped',
                output: {
                  title: '⏭️ Review Skipped',
                  summary: summary
                }
              });
            } catch (error) {
              console.error('Failed to create check:', error.message);
            }