name: PR Quality Gate - Standalone

on:
  # pull_request:
  #   branches: ['leader']
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check'
        required: true
        default: 'leader'
  workflow_call:

concurrency:
  group: pr-quality-standalone-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # Required for dorny/test-reporter
  actions: read # Required for artifact downloads
  pull-requests: write # Required for gh pr comment
  issues: write # Required for posting comments

env:
  FORCE_COLOR: 1
  # Unique session identifier for concurrent runs
  SESSION_ID: ${{ github.event.pull_request.number || github.ref_name || github.run_id }}
  # Maximum bytes to include from each log file in failure comments
  LOG_TRUNCATE_BYTES: 20000

jobs:
  dependency-check:
    name: 📦 Dependency Check
    runs-on: self-hosted
    if: "contains(github.event.pull_request.labels.*.name, 'dependencies')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check for lockfile changes
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...${{ github.event.pull_request.head.ref }})
          if echo "$CHANGED_FILES" | grep -q "package.json" && ! echo "$CHANGED_FILES" | grep -q "pnpm-lock.yaml"; then
            echo "Error: package.json was changed but pnpm-lock.yaml was not."
            exit 1
          fi
  # ===========================================================================
  # SINGLE JOB: SETUP AND ALL TESTS
  # Sets up environment and runs all quality checks, tests in one job
  # ===========================================================================
  test:
    name: 🧪 Setup & All Tests
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0
          clean: false # 🧹 Preserves previous run artifacts for speed (Cold: ~33s vs Warm: ~4s)

      - name: Sanitize Workspace (Preserve Cache)
        run: |
          # Ensure a clean state at the start, preventing pollution from crashed previous runs
          # while preserving the heavy artifacts we want to cache.
          git reset --hard HEAD
          git clean -fdx --exclude .next --exclude node_modules --exclude .eslintcache --exclude .cache

      - name: Install GitHub CLI
        run: |
          mkdir -p $HOME/.local/bin
          # Download GitHub CLI binary
          GH_VERSION=2.63.0
          curl -L https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz -o gh.tar.gz
          tar xvf gh.tar.gz
          # Move binary to local bin
          mv gh_${GH_VERSION}_linux_amd64/bin/gh $HOME/.local/bin/
          # Add to PATH for this and future steps
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Define Dynamic Cache Path
        shell: bash
        # This expands $HOME (e.g., /home/ari) and saves it to the workflow env
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> $GITHUB_ENV

      - name: Sanitize SESSION_ID
        shell: bash
        run: |
          # Replace / with - in SESSION_ID to prevent invalid artifact names
          SAFE_SESSION_ID=$(echo "${{ env.SESSION_ID }}" | tr '/' '-')
          echo "SESSION_ID=$SAFE_SESSION_ID" >> $GITHUB_ENV

      # --- GLOBAL PERSISTENCE CONFIG ---
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Configure Persistent Store
        shell: bash
        run: |
          mkdir -p ~/.local/share/pnpm/store
          pnpm config set store-dir ~/.local/share/pnpm/store
          pnpm config set side-effects-cache true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
      # ---------------------------------

      - name: Create Runtime Envs
        run: |
          mkdir -p logs  coverage playwright-report test-results
          echo "NEXTAUTH_URL=http://127.0.0.1:3000" > .env.local
          echo "NEXTAUTH_SECRET=ci-secret-${{ env.SESSION_ID }}" >> .env.local

      - name: Run Setup Script
        run: |
          chmod +x ./scripts/setup.sh
          ./scripts/setup.sh
        # This installs dependencies into ./node_modules

      # 1. Get version for cache key
      - name: Get installed Playwright version
        id: playwright-version
        shell: bash
        run: echo "VERSION=$(npx playwright --version | cut -d ' ' -f 2)" >> $GITHUB_OUTPUT

      # 2. Cache the browser binaries in the HOME directory
      #- name: Cache Playwright Browsers
      #  id: playwright-cache
      #  uses: actions/cache@v4
      #  with:
      #    path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
      #    key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.VERSION }}
      #    restore-keys: |
      #      ${{ runner.os }}-playwright-

      # 3. Install Browsers (ONLY if cache miss)
      # NOTE: If running on a new server, install OS deps manually once with:
      # sudo env PATH="$(dirname $(which node)):$PATH" npx playwright install-deps
      - name: Install Playwright Browsers
        # if: steps.playwright-cache.outputs.cache-hit != 'true'
        # CHANGE: Removed --with-deps (System deps are already on your server)
        run: pnpm exec playwright install chromium

      - name: Run Dev Server Test (Pre-Build)
        id: infra_tests_dev
        run: |
          set -o pipefail
          PLAYWRIGHT_JUNIT_OUTPUT_NAME=test-results/infra-dev-results.xml pnpm run test:infra:dev --reporter=junit 2>&1 | tee logs/infra-dev-output.log
        continue-on-error: true

      - name: Publish Dev Server Test Results
        uses: dorny/test-reporter@v1
        if: always() && steps.infra_tests_dev.outcome != 'skipped'
        with:
          name: Infrastructure (Dev)
          path: test-results/infra-dev-results.xml
          reporter: java-junit
        continue-on-error: true

      - name: Lint Code
        id: lint
        run: |
          set -o pipefail
          pnpm run lint 2>&1 | tee logs/lint-output.log
        continue-on-error: true

      - name: Verify Build
        id: build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: build-verification-secret-do-not-use-in-production
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee logs/build-output.log
        continue-on-error: true

      - name: Run Production Server Test (Post-Build)
        id: infra_tests_prod
        # This test validates the production build artifact can start
        if: always() && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          PLAYWRIGHT_JUNIT_OUTPUT_NAME=test-results/infra-prod-results.xml pnpm run test:infra:prod --reporter=junit 2>&1 | tee logs/infra-prod-output.log
        continue-on-error: true

      - name: Publish Production Server Test Results
        uses: dorny/test-reporter@v1
        if: always() && steps.infra_tests_prod.outcome != 'skipped'
        with:
          name: Infrastructure (Prod)
          path: test-results/infra-prod-results.xml
          reporter: java-junit
        continue-on-error: true

      - name: Run Unit Tests
        id: unit_tests
        run: |
          set -o pipefail
          pnpm run test:unit 2>&1 | tee logs/unit-output.log
        continue-on-error: true

      - name: Publish Unit Test Results to GitHub Checks
        # This action reads the generated XML and displays it in the Checks/Summary tab
        uses: dorny/test-reporter@v1
        if: always() && steps.unit_tests.outcome != 'skipped' # Ensures the report is published even if tests failed, but not if skipped
        with:
          name: Unit Tests Report # The name of the check run
          path: test-results/unit-results.xml # Path to the generated XML file
          reporter: java-junit
        continue-on-error: true # Don't fail on reporter issues; rely on test step outcome

      - name: Start Application for Performance Test
        if: always() && steps.build.outcome == 'success'
        run: pnpm run start

      - name: Run Performance Test
        id: perf_tests
        if: always() && steps.build.outcome == 'success'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: PLAYWRIGHT_JUNIT_OUTPUT_NAME=test-results/perf-results.xml pnpm run test:perf --reporter=junit

      - name: Publish Performance Test Results to GitHub Checks
        uses: dorny/test-reporter@v1
        if: always() && steps.perf_tests.outcome != 'skipped'
        with:
          name: Performance Tests Report
          path: test-results/perf-results.xml
          reporter: java-junit
        continue-on-error: true

      - name: Upload Performance Metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-metrics
          path: test-results/performance-metrics.json

      - name: Stop Application
        if: always()
        run: pnpm run kill-all || true

      - name: Run Visual Tests
        id: visual_tests
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          pnpm run test:visual 2>&1 | tee logs/visual-output.log
        # NOTE: This generates files in the default ./blob-report directory
        continue-on-error: true

      - name: Publish Visual Test Results to GitHub Checks
        uses: dorny/test-reporter@v1
        if: always() && steps.visual_tests.outcome != 'skipped'
        with:
          name: Visual Tests Report
          path: test-results/results.xml
          reporter: java-junit
        continue-on-error: true

      - name: Merge Playwright Reports
        if: always() && steps.visual_tests.outcome != 'skipped'
        run: npx playwright merge-reports --reporter html ./blob-report
        # The command now correctly points to the default directory containing blob reports

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ env.SESSION_ID }}
          path: |
            coverage/
            test-results/
            logs/
            reports/performance/
          retention-days: 7

      - name: Report Failure & Generate Artifact
        if: always() && (steps.lint.outcome == 'failure' || steps.build.outcome == 'failure' || steps.infra_tests_dev.outcome == 'failure' || steps.infra_tests_prod.outcome == 'failure' || steps.unit_tests.outcome == 'failure' || steps.visual_tests.outcome == 'failure' || steps.perf_tests.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.ARI_PAT }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          INFRA_TESTS_DEV_OUTCOME: ${{ steps.infra_tests_dev.outcome }}
          INFRA_TESTS_PROD_OUTCOME: ${{ steps.infra_tests_prod.outcome }}
          UNIT_TESTS_OUTCOME: ${{ steps.unit_tests.outcome }}
          VISUAL_TESTS_OUTCOME: ${{ steps.visual_tests.outcome }}
          PERF_TESTS_OUTCOME: ${{ steps.perf_tests.outcome }}
        run: |
          set +e # Disable exit on error to continue reporting even if commands fail

          # 1. SETUP: Define files and find PR number
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
            PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number')
          fi

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
            echo "::warning::No Pull Request found for this branch. Skipping comment."
            exit 0 # Exit cleanly as there's nothing to do
          fi

          COMMENT_FILE="test-results/pr-comment.md"
          JSON_REPORT_FILE="test-results/failure-report.json"
          mkdir -p test-results

          # Define checks in a readable, maintainable format.
          # Each line: <OUTCOME_VAR_NAME>|<Display Name>|<primary_log_file>
          read -r -d '' CHECKS_DEFINITION <<'EOF'
          LINT_OUTCOME|Lint|logs/lint-output.log
          BUILD_OUTCOME|Build|logs/build-output.log
          INFRA_TESTS_DEV_OUTCOME|Infrastructure (Dev)|logs/infra-dev-output.log
          INFRA_TESTS_PROD_OUTCOME|Infrastructure (Prod)|logs/infra-prod-output.log
          UNIT_TESTS_OUTCOME|Unit Tests|logs/unit-output.log
          VISUAL_TESTS_OUTCOME|Visual Tests|logs/visual-output.log
          PERF_TESTS_OUTCOME|Performance Tests|logs/performance-output.log
          EOF

          # 2. AGGREGATION: Loop through checks to find failures and collect logs for both PR comment and JSON artifact.
          FAILED_CHECKS_LIST=""
          LOGS_BODY=""
          FAILED_CHECKS_JSON="[]" # Initialize JSON array

          # Helper function to get sanitized log content
          get_log_content() {
            local log_file="$1"
            if [ -f "$log_file" ]; then
              # Truncate and strip ANSI color codes
              tail -c "${{ env.LOG_TRUNCATE_BYTES }}" "$log_file" | sed -r 's/\x1b\[[0-9;]*m//g'
            else
              echo "_Log file not found: ${log_file}_"
            fi
          }

          # Helper function to append a log file's content to the markdown comment body
          append_log_to_body() {
            local log_file="$1"
            local test_name="$2"
            local log_content
            log_content=$(get_log_content "$log_file")
            LOGS_BODY="${LOGS_BODY}\n### ${test_name} Log\n\`\`\`\n${log_content}\n\`\`\`\n"
          }

          while IFS='|' read -r outcome_var display_name log_file; do
            # Use indirect expansion to get the outcome value (e.g., $LINT_OUTCOME)
            if [ "${!outcome_var}" == "failure" ]; then
              # --- For PR Comment ---
              if [ -z "$FAILED_CHECKS_LIST" ]; then FAILED_CHECKS_LIST="$display_name"; else FAILED_CHECKS_LIST="$FAILED_CHECKS_LIST, $display_name"; fi
              append_log_to_body "$log_file" "$display_name"
              # Special case: Performance tests have additional, specific logs
              if [ "$display_name" == "Performance Tests" ]; then
                append_log_to_body "logs/ws-stress-client.log" "WebSocket Stress Client"
                append_log_to_body "logs/frontend-perf-server.log" "Frontend Perf Server"
              fi

              # --- For JSON Report ---
              primary_log_content=$(get_log_content "$log_file")
              if [ "$display_name" == "Performance Tests" ]; then
                ws_log_content=$(get_log_content "logs/ws-stress-client.log")
                frontend_log_content=$(get_log_content "logs/frontend-perf-server.log")
                primary_log_content="${primary_log_content}\n\n--- WebSocket Stress Client Log ---\n${ws_log_content}\n\n--- Frontend Perf Server Log ---\n${frontend_log_content}"
              fi

              # Create a JSON object for the failed check
              check_json=$(jq -n \
                --arg name "$display_name" \
                --arg conclusion "failure" \
                --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                --arg logs "$primary_log_content" \
                '{name: $name, conclusion: $conclusion, detailsUrl: $url, logs: $logs}')

              # Add the object to our JSON array
              FAILED_CHECKS_JSON=$(echo "$FAILED_CHECKS_JSON" | jq --argjson item "$check_json" '. + [$item]')
            fi
          done <<< "$CHECKS_DEFINITION"

          # 3. REPORTING: If any checks failed, post comment and write JSON report
          if [ -n "$FAILED_CHECKS_LIST" ]; then
            # --- Post PR Comment ---
            COMMIT_HASH_MSG="> Failed at commit: \`${{ github.event.pull_request.head.sha || github.sha }}\`"
            COMMENT_HEADER="@jules fix: CI checks failed: ${FAILED_CHECKS_LIST}. Review requested.\n\n${COMMIT_HASH_MSG}\n\n"
            LOG_FOOTER="---\n*Note: Logs are truncated. View the [full workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.*"
            COMMENT_DETAILS="<details><summary><strong>Failed Test Report Log</strong></summary>${LOGS_BODY}\n${LOG_FOOTER}\n</details>"
            echo -e "${COMMENT_HEADER}${COMMENT_DETAILS}" > "$COMMENT_FILE"
            if ! gh pr comment "$PR_NUMBER" --body-file "$COMMENT_FILE"; then
              echo "::error::Failed to post comment to PR. The GitHub token may have expired or lack permissions."
            fi

            # --- Write JSON Report File ---
            echo "$FAILED_CHECKS_JSON" | jq '.' > "$JSON_REPORT_FILE"
            echo "::notice::Generated failure report at ${JSON_REPORT_FILE}"
          else
            echo "::warning::Job failed, but no specific test outcome was 'failure'. A step may have failed unexpectedly."
          fi

      - name: Upload Failure Report
        if: always() && (steps.lint.outcome == 'failure' || steps.build.outcome == 'failure' || steps.infra_tests_dev.outcome == 'failure' || steps.infra_tests_prod.outcome == 'failure' || steps.unit_tests.outcome == 'failure' || steps.visual_tests.outcome == 'failure' || steps.perf_tests.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: failure-report
          path: test-results/failure-report.json
          retention-days: 1

      - name: Checkout
        uses: actions/checkout@v4
        if: always()
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0
          # CHANGED: Set to false to keep .next/cache and node_modules on disk
          clean: false

      - name: Clean Workspace (Preserve Cache)
        if: always()
        continue-on-error: true
        run: |
          # Delete everything EXCEPT .next and node_modules
          find . -maxdepth 1 -mindepth 1 \
            -not -name '.next' \
            -not -name 'node_modules' \
            -not -name '.git' \
            -not -name '.cache' \
            -exec rm -rf {} +

          # Reset git state to ensure code is fresh
          git reset --hard HEAD
          git clean -fdx --exclude .next --exclude node_modules --exclude .eslintcache --exclude .cache

  gemini-review-on-failure:
    name: 🤖 Gemini Review on Failure
    # This job is responsible for a critical handoff. It runs only when the main 'test' job fails.
    # Its primary purpose is to securely download the 'failure-report.json' artifact produced by the 'test' job.
    # This report contains the definitive, complete list of all failed checks and their logs.
    # By downloading the artifact and passing its contents as an output, we ensure the subsequent review job
    # has access to the full context of the failure, preventing race conditions where the review might start
    # before all test checks have completed and reported their status.
    needs: [test]
    if: failure()
    outputs:
      failure_report_json: ${{ steps.read_report.outputs.json_content }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Failure Report
        uses: actions/download-artifact@v4
        with:
          name: failure-report
          path: test-results

      - name: Read Failure Report
        id: read_report
        run: |
          if [ -f "test-results/failure-report.json" ]; then
            # Use heredoc to safely read the entire file content into a variable
            JSON_CONTENT=$(<test-results/failure-report.json)
            # Make it available to the outputs
            echo "json_content<<EOF" >> $GITHUB_OUTPUT
            echo "$JSON_CONTENT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "::warning::Failure report not found."
            echo "json_content=[]" >> $GITHUB_OUTPUT
          fi

  call-gemini-review:
    name: 📞 Call Gemini Review
    # This job calls the reusable Gemini review workflow.
    # It is decoupled from the artifact download job to ensure a clean separation of concerns.
    # It receives the JSON failure report via 'needs' context and passes it directly to the reusable workflow.
    # This handoff is key to ensuring the code review is based on a complete and final set of test results.
    needs: [gemini-review-on-failure]
    if: always()
    uses: ./.github/workflows/reusable-gemini-review.yml
    with:
      trigger_event: 'pull_request'
      pr_quality_result: 'failure'
      failure_report_json: ${{ needs.gemini-review-on-failure.outputs.failure_report_json }}
    secrets: inherit
