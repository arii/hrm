name: PR Quality Gate - Standalone

on:
  # pull_request:
  #   branches: ['leader']
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check'
        required: true
        default: 'leader'
  workflow_call:

concurrency:
  group: pr-quality-standalone-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # Required for dorny/test-reporter
  actions: read # Required for artifact downloads
  pull-requests: write # Required for gh pr comment
  issues: write # Required for posting comments

env:
  FORCE_COLOR: 1
  # Unique session identifier for concurrent runs
  SESSION_ID: ${{ github.event.pull_request.number || github.ref_name || github.run_id }}
  # Maximum bytes to include from each log file in failure comments
  LOG_TRUNCATE_BYTES: 20000

jobs:
  dependency-check:
    name: 📦 Dependency Check
    runs-on: self-hosted
    if: "contains(github.event.pull_request.labels.*.name, 'dependencies')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check for lockfile changes
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...${{ github.event.pull_request.head.ref }})
          if echo "$CHANGED_FILES" | grep -q "package.json" && ! echo "$CHANGED_FILES" | grep -q "pnpm-lock.yaml"; then
            echo "Error: package.json was changed but pnpm-lock.yaml was not."
            exit 1
          fi

  setup:
    name: 🏗️ Setup
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      session_id: ${{ env.SESSION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0
          clean: false

      - name: Sanitize Workspace (Preserve Cache)
        run: |
          git reset --hard HEAD
          git clean -fdx --exclude .next --exclude node_modules --exclude .eslintcache --exclude .cache

      - name: Sanitize SESSION_ID
        shell: bash
        run: |
          SAFE_SESSION_ID=$(echo "${{ env.SESSION_ID }}" | tr '/' '-')
          echo "SESSION_ID=$SAFE_SESSION_ID" >> $GITHUB_ENV

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Configure Persistent Store
        shell: bash
        run: |
          mkdir -p ~/.local/share/pnpm/store
          pnpm config set store-dir ~/.local/share/pnpm/store
          pnpm config set side-effects-cache true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: Create Runtime Envs
        run: |
          mkdir -p logs coverage playwright-report test-results
          echo "NEXTAUTH_URL=http://127.0.0.1:3000" > .env.local
          echo "NEXTAUTH_SECRET=ci-secret-${{ env.SESSION_ID }}" >> .env.local

      - name: Run Setup Script
        run: |
          chmod +x ./scripts/setup.sh
          ./scripts/setup.sh

      - name: Upload Workspace Artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspace-${{ env.SESSION_ID }}
          path: |
            .
            !node_modules/.cache
          retention-days: 1

  lint:
    name: 🎨 Lint
    needs: setup
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Download Workspace Artifact
        uses: actions/download-artifact@v4
        with:
          name: workspace-${{ needs.setup.outputs.session_id }}
          path: .

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: Restore pnpm store config
        shell: bash
        run: |
          mkdir -p ~/.local/share/pnpm/store
          pnpm config set store-dir ~/.local/share/pnpm/store

      - name: Lint Code
        run: pnpm run lint

  build:
    name: 🔨 Build
    needs: setup
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Download Workspace Artifact
        uses: actions/download-artifact@v4
        with:
          name: workspace-${{ needs.setup.outputs.session_id }}
          path: .

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: Restore pnpm store config
        shell: bash
        run: |
          mkdir -p ~/.local/share/pnpm/store
          pnpm config set store-dir ~/.local/share/pnpm/store

      - name: Verify Build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: build-verification-secret-do-not-use-in-production
        run: pnpm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ needs.setup.outputs.session_id }}
          path: |
            dist/
            .next/
          retention-days: 1

  test:
    name: 🧪 Tests
    needs: [setup, build]
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Download Workspace Artifact
        uses: actions/download-artifact@v4
        with:
          name: workspace-${{ needs.setup.outputs.session_id }}
          path: .

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.setup.outputs.session_id }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: Restore pnpm store config
        shell: bash
        run: |
          mkdir -p ~/.local/share/pnpm/store
          pnpm config set store-dir ~/.local/share/pnpm/store

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium

      - name: Run Unit Tests
        run: pnpm run test:unit

      - name: Publish Unit Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests
          path: test-results/unit-results.xml
          reporter: java-junit

      - name: Run Visual Tests
        run: pnpm run test:visual

      - name: Publish Visual Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Visual Tests
          path: test-results/results.xml
          reporter: java-junit

  gemini-review-on-failure:
    name: 🤖 Gemini Review on Failure
    needs: [lint, build, test]
    if: failure()
    uses: ./.github/workflows/reusable-gemini-review.yml
    with:
      trigger_event: 'pull_request'
      pr_quality_result: 'failure'
    secrets: inherit
