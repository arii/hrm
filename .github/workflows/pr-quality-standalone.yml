name: PR Quality Gate - Standalone

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check'
        required: true
        default: 'leader'
  workflow_call:

concurrency:
  group: pr-quality-standalone-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  actions: read
  pull-requests: write
  issues: write

env:
  FORCE_COLOR: 1
  SESSION_ID: ${{ github.event.pull_request.number || github.ref_name || github.run_id }}
  LOG_TRUNCATE_BYTES: 20000

jobs:
  dependency-check:
    name: 📦 Dependency Check
    runs-on: self-hosted
    if: "contains(github.event.pull_request.labels.*.name, 'dependencies')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check for lockfile changes
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...${{ github.event.pull_request.head.ref }})
          if echo "$CHANGED_FILES" | grep -q "package.json" && ! echo "$CHANGED_FILES" | grep -q "pnpm-lock.yaml"; then
            echo "Error: package.json was changed but pnpm-lock.yaml was not."
            exit 1
          fi
  lint-check:
    name: 🔍 Lint Check
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 1
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Lint Code
        id: lint
        run: ./scripts/ci/run-linter.sh
        continue-on-error: true
      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-logs-${{ env.SESSION_ID }}
          path: logs/
          retention-days: 7

  build-check:
    name: 🏗️ Build Check
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 1
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Verify Build
        id: build
        run: ./scripts/ci/run-build.sh
        continue-on-error: true
      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ env.SESSION_ID }}
          path: logs/
          retention-days: 7

  unit-tests:
    name: 🧪 Unit Tests
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 1
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Run Unit Tests
        id: unit_tests
        run: ./scripts/ci/run-unit-tests.sh
        continue-on-error: true
      - name: Publish Unit Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests Report
          path: test-results/unit-results.xml
          reporter: java-junit
      - name: Upload Logs & Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results-${{ env.SESSION_ID }}
          path: |
            logs/
            test-results/
          retention-days: 7

  infra-tests:
    name: 🧪 Infrastructure Tests
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 1
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Run Dev Server Test
        id: infra_tests_dev
        run: ./scripts/ci/run-infra-tests.sh dev
        continue-on-error: true
      - name: Publish Dev Server Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Infrastructure (Dev)
          path: test-results/infra-dev-results.xml
          reporter: java-junit
      - name: Verify Build
        id: build
        run: ./scripts/ci/run-build.sh
        continue-on-error: true
      - name: Run Production Server Test
        id: infra_tests_prod
        if: steps.build.outcome == 'success'
        run: ./scripts/ci/run-infra-tests.sh prod
        continue-on-error: true
      - name: Publish Production Server Test Results
        uses: dorny/test-reporter@v1
        if: always() && steps.infra_tests_prod.outcome != 'skipped'
        with:
          name: Infrastructure (Prod)
          path: test-results/infra-prod-results.xml
          reporter: java-junit
      - name: Upload Logs & Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infra-test-results-${{ env.SESSION_ID }}
          path: |
            logs/
            test-results/
          retention-days: 7

  perf-tests:
    name: 🧪 Performance Tests
    runs-on: self-hosted
    needs: [build-check]
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 1
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Verify Build
        run: ./scripts/ci/run-build.sh
      - name: Start Application
        run: pnpm run start
      - name: Run Performance Test
        id: perf_tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: ./scripts/ci/run-perf-tests.sh
      - name: Publish Performance Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Performance Tests Report
          path: test-results/perf-results.xml
          reporter: java-junit
      - name: Stop Application
        if: always()
        run: pnpm run kill-all || true
      - name: Upload Logs & Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-test-results-${{ env.SESSION_ID }}
          path: |
            logs/
            test-results/
            reports/performance/
          retention-days: 7

  visual-tests:
    name: 🧪 Visual Tests
    runs-on: self-hosted
    needs: [build-check]
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 1
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Verify Build
        run: ./scripts/ci/run-build.sh
      - name: Run Visual Tests
        id: visual_tests
        run: ./scripts/ci/run-visual-tests.sh
        continue-on-error: true
      - name: Publish Visual Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Visual Tests Report
          path: test-results/results.xml
          reporter: java-junit
      - name: Merge Playwright Reports
        if: always()
        run: npx playwright merge-reports --reporter html ./blob-report
      - name: Upload Logs & Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-test-results-${{ env.SESSION_ID }}
          path: |
            logs/
            test-results/
            blob-report/
            playwright-report/
          retention-days: 7

  failure-handler:
    name: 🚨 Failure Handler
    runs-on: ubuntu-latest
    needs: [lint-check, build-check, unit-tests, infra-tests, perf-tests, visual-tests]
    if: failure()
    outputs:
      failure_report_json: ${{ steps.read_report.outputs.json_content }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Download All Logs
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Reorganize Artifacts
        run: |
          echo "Reorganizing downloaded artifacts..."
          mkdir -p logs test-results
          find artifacts -type f -name "*.log" -exec mv {} logs/ \;
          find artifacts -type f -name "*.xml" -exec mv {} test-results/ \;
          echo "Artifacts reorganized."
      - name: Generate Failure Report
        id: failure_report
        env:
          GH_TOKEN: ${{ secrets.ARI_PAT }}
          LINT_OUTCOME: ${{ needs.lint-check.result }}
          BUILD_OUTCOME: ${{ needs.build-check.result }}
          INFRA_TESTS_DEV_OUTCOME: ${{ needs.infra-tests.result }}
          INFRA_TESTS_PROD_OUTCOME: ${{ needs.infra-tests.result }}
          UNIT_TESTS_OUTCOME: ${{ needs.unit-tests.result }}
          VISUAL_TESTS_OUTCOME: ${{ needs.visual-tests.result }}
          PERF_TESTS_OUTCOME: ${{ needs.perf-tests.result }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./scripts/generate-failure-report.sh
      - name: Read Failure Report
        id: read_report
        run: |
          if [ -f "test-results/failure-report.json" ]; then
            JSON_CONTENT=$(<test-results/failure-report.json)
            echo "json_content<<EOF" >> $GITHUB_OUTPUT
            echo "$JSON_CONTENT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "::warning::Failure report not found."
            echo "json_content=[]" >> $GITHUB_OUTPUT
          fi

  call-gemini-review:
    name: 📞 Call Gemini Review
    needs: [failure-handler]
    if: failure()
    uses: ./.github/workflows/reusable-gemini-review.yml
    with:
      trigger_event: 'pull_request'
      pr_quality_result: 'failure'
      failure_report_json: ${{ needs.failure-handler.outputs.failure_report_json }}
    secrets: inherit
