name: PR Quality Gate - Standalone

on:
  # pull_request:
  #   branches: ['leader']
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check'
        required: true
        default: 'leader'
  workflow_call:

concurrency:
  group: pr-quality-standalone-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # Required for dorny/test-reporter
  actions: read # Required for artifact downloads
  pull-requests: write # Required for gh pr comment
  issues: write # Required for posting comments

env:
  FORCE_COLOR: 1
  # Unique session identifier for concurrent runs
  SESSION_ID: ${{ github.event.pull_request.number || github.ref_name || github.run_id }}
  # Maximum bytes to include from each log file in failure comments
  LOG_TRUNCATE_BYTES: 20000

jobs:
  dependency-check:
    name: 📦 Dependency Check
    runs-on: self-hosted
    if: "contains(github.event.pull_request.labels.*.name, 'dependencies')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check for lockfile changes
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...${{ github.event.pull_request.head.ref }})
          if echo "$CHANGED_FILES" | grep -q "package.json" && ! echo "$CHANGED_FILES" | grep -q "pnpm-lock.yaml"; then
            echo "Error: package.json was changed but pnpm-lock.yaml was not."
            exit 1
          fi

  lint:
    name: 🎨 Lint
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint Code
        run: pnpm run lint 2>&1 | tee lint-output.log
      - name: Upload lint logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-logs-${{ github.run_id }}
          path: lint-output.log

  build:
    name: 🔨 Build
    runs-on: self-hosted
    timeout-minutes: 10
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: build-verification-secret-do-not-use-in-production
        run: pnpm run build 2>&1 | tee build-output.log
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: build-output.log
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ github.run_id }}
          path: |
            dist/
            .next/
          retention-days: 1

  test:
    name: 🧪 Tests
    runs-on: self-hosted
    timeout-minutes: 20
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ github.run_id }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium

      - name: Run all tests
        run: |
          set -o pipefail
          # This script will run all test suites and output individual JUnit XML files
          # For now, we'll just run them sequentially and pipe to a single log
          (
            echo "--- Running Infrastructure Tests (Dev) ---"
            PLAYWRIGHT_JUNIT_OUTPUT_NAME=test-results/infra-dev-results.xml pnpm run test:infra:dev --reporter=junit
            echo "--- Running Infrastructure Tests (Prod) ---"
            PLAYWRIGHT_JUNIT_OUTPUT_NAME=test-results/infra-prod-results.xml pnpm run test:infra:prod --reporter=junit
            echo "--- Running Unit Tests ---"
            pnpm run test:unit
            echo "--- Running Performance Tests ---"
            pnpm run start
            PLAYWRIGHT_JUNIT_OUTPUT_NAME=test-results/perf-results.xml pnpm run test:perf --reporter=junit
            pnpm run kill-all || true
            echo "--- Running Visual Tests ---"
            pnpm run test:visual
          ) 2>&1 | tee all-tests-output.log

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Tests
          path: test-results/**/*.xml
          reporter: java-junit

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.run_id }}
          path: all-tests-output.log

  report-failure:
    name: 🚨 Report Failure
    runs-on: self-hosted
    needs: [lint, build, test]
    if: failure()

    steps:
      - name: Download all logs
        uses: actions/download-artifact@v4
        with:
          path: all-logs

      - name: Install GitHub CLI
        run: |
          mkdir -p $HOME/.local/bin
          GH_VERSION=2.63.0
          curl -L https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz -o gh.tar.gz
          tar xvf gh.tar.gz
          mv gh_${GH_VERSION}_linux_amd64/bin/gh $HOME/.local/bin/
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Aggregate logs and post comment
        env:
          GH_TOKEN: ${{ secrets.ARI_PAT }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set +e
          PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR found. Skipping comment."
            exit 0
          fi

          FAILED_CHECKS_LIST=""
          LOGS_BODY=""

          if [ "$LINT_RESULT" == "failure" ]; then
            FAILED_CHECKS_LIST="Lint"
            LOGS_BODY="$LOGS_BODY\n### Lint Log\n\`\`\`\n$(cat all-logs/lint-logs-${{ github.run_id }}/lint-output.log | tail -c 10000)\n\`\`\`"
          fi
          if [ "$BUILD_RESULT" == "failure" ]; then
            [ -n "$FAILED_CHECKS_LIST" ] && FAILED_CHECKS_LIST="$FAILED_CHECKS_LIST, Build" || FAILED_CHECKS_LIST="Build"
            LOGS_BODY="$LOGS_BODY\n### Build Log\n\`\`\`\n$(cat all-logs/build-logs-${{ github.run_id }}/build-output.log | tail -c 10000)\n\`\`\`"
          fi
          if [ "$TEST_RESULT" == "failure" ]; then
            [ -n "$FAILED_CHECKS_LIST" ] && FAILED_CHECKS_LIST="$FAILED_CHECKS_LIST, Test" || FAILED_CHECKS_LIST="Test"
            LOGS_BODY="$LOGS_BODY\n### Test Log\n\`\`\`\n$(cat all-logs/test-logs-${{ github.run_id }}/all-tests-output.log | tail -c 20000)\n\`\`\`"
          fi

          if [ -n "$FAILED_CHECKS_LIST" ]; then
            COMMENT_HEADER="@jules fix: CI checks failed: ${FAILED_CHECKS_LIST}. Review requested.\n\n"
            LOG_FOOTER="---\n*Note: Logs are truncated. View the [full workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.*"
            COMMENT_DETAILS="<details><summary><strong>Failed Test Report Log</strong></summary>${LOGS_BODY}\n${LOG_FOOTER}\n</details>"
            gh pr comment "$PR_NUMBER" --body "$(echo -e "${COMMENT_HEADER}${COMMENT_DETAILS}")"
          fi
