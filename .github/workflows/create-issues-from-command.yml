# .github/workflows/create-issues-from-command.yml
name: Create Issues from Command

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'The PR number to source review artifacts from'
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  create-issues-from-dispatch:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-create-review-issues.yml
    with:
      pr_number: ${{ github.event.inputs.pr_number }}
    secrets:
      gh_token: ${{ secrets.ARI_PAT }}

  create-issues-from-comment:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/create-issues')
    uses: ./.github/workflows/reusable-create-review-issues.yml
    with:
      pr_number: ${{ github.event.issue.number }}
    secrets:
      gh_token: ${{ secrets.ARI_PAT }}
