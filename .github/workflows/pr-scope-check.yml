name: PR Scope Validation
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  scope-check:
    runs-on: self-hosted
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for accurate diff

      - name: Analyze Changed Files
        id: analyze-files
        run: |
          # Define architectural areas with a clear precedence (most specific to least specific)
          # A file will only be assigned to the FIRST area it matches.
          # The order of the `for area in ...` loop below defines the precedence.
          declare -A areas
          # Authentication-related files (most specific)
          areas[Auth]="app/api/auth|lib/auth.ts|middleware.ts"
          # CI/CD and automation scripts
          areas[CI-CD]=".github/|scripts/|Dockerfile|docker-compose.yml"
          areas[API]="app/api/|services/|lib/validation"
          areas[UI]="app/((?!api).)*$|components/|hooks/|context/|public/"
          areas[Core-Internals]="server.ts|lib/|utils/|types/"
          areas[Docs]=".md$|.mdx$|docs/"

          # Get the list of changed files between the PR's base and head commits
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          echo "Base SHA: $base_sha"
          echo "Head SHA: $head_sha"

          changed_files=$(git diff --name-only "$base_sha" "$head_sha")

          if [ -z "$changed_files" ]; then
            echo "No changed files detected. Exiting."
            echo "count=0" >> $GITHUB_OUTPUT
            echo "areas=''" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Changed files:"
          echo "$changed_files"

          declare -A touched_areas_map

          # Iterate over each changed file and assign it to exactly one area
          while IFS= read -r file; do
            assigned_area=""
            # Check against areas in the defined order of precedence
            for area in Auth CI-CD API UI Core-Internals Docs; do
              pattern="${areas[$area]}"
              if echo "$file" | grep -E -q "$pattern"; then
                assigned_area="$area"
                touched_areas_map[$area]=1
                echo "  - $file -> $area"
                break # Stop after the first match
              fi
            done
            if [ -z "$assigned_area" ]; then
                echo "  - $file -> (Uncategorized)"
            fi
          done <<< "$changed_files"

          # Get the unique areas that were touched
          unique_areas="${!touched_areas_map[@]}"
          area_count="${#touched_areas_map[@]}"

          echo "Touched areas: $unique_areas"
          echo "count=$area_count" >> $GITHUB_OUTPUT
          echo "areas=$unique_areas" >> $GITHUB_OUTPUT

      - name: Clean up old scope labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels;
            const scopeLabels = labels.filter(label => label.name.startsWith('scope:'));
            for (const label of scopeLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label.name
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

      - name: Add "scope:focused" label
        if: steps.analyze-files.outputs.count <= 1
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['scope:focused']
            });

      - name: Add "scope:needs-review" label and comment
        if: steps.analyze-files.outputs.count > 1
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['scope:needs-review']
            });
            const commentBody = `
            ###  scope:needs-review

            This PR appears to touch multiple architectural areas: **${{ steps.analyze-files.outputs.areas }}**.

            Please consider splitting this PR into smaller, more focused PRs, each addressing a single concern. This makes reviews faster and more thorough.

            Refer to [DEVELOPMENT.md](DEVELOPMENT.md) for guidelines on PR scope.

            *(If this is intentional and has been discussed, this label can be used to filter for PRs that require a more detailed architectural review.)*
            `;
            // Check for existing comments to avoid spamming
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existingComment = comments.find(comment => comment.user.login === 'github-actions[bot]' && comment.body.includes('### scope:needs-review'));

            if (!existingComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            } else {
              console.log('A scope review comment already exists. Skipping comment creation.');
            }
