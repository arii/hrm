name: Deploy Production

on:
  push:
    branches: ['leader']

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    runs-on: self-hosted
    # Only run if Quality Gate passed (implied by branch protection, but good to be explicit)
    if: github.ref == 'refs/heads/leader'

    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      # Caching is disabled for self-hosted runners to improve performance.
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📥 Install Dependencies
        run: pnpm install

      - name: 🏗️ Build Standalone Artifact
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET_BUILD_PLACEHOLDER }}
          NEXTAUTH_URL: 'http://localhost:3000'
          IS_DEPLOYMENT: 'true'
        run: |
          # 1. Use production config with standalone output
          cp deploy/next.config.js next.config.js

          # 2. Build Next.js
          pnpm run build

          # 3. Package Artifact (Hybrid Strategy)
          ./scripts/package.sh

      - name: 🚚 Transfer Artifact
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
        run: |
          # Transfer the Release Archive (contains all scripts)
          scp release.tar.gz $PROD_USER@$PROD_HOST:$PROD_PATH/

      - name: 🚀 Execute Deployment
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
        run: |
          # Extract tarball and run deploy script (which it contains)
          ssh $PROD_USER@$PROD_HOST "bash -l -c 'cd $PROD_PATH && tar -xzf release.tar.gz --overwrite && ./scripts/deploy-artifact.sh'"

  create-revert-issue:
    name: Create Revert Issue
    runs-on: ubuntu-latest
    needs: [deploy]
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Create Revert Issue on Failure
        uses: ./.github/workflows/reusable-create-issue.yml
        secrets: inherit
        with:
          title: '[DEPLOYMENT FAILED] Revert Required: Production Deployment for Commit ${{ github.sha }}'
          body: |
            **Commit Details:**
            - **Commit SHA:** `${{ github.sha }}`
            - **Commit Message:** `${{ github.event.head_commit.message }}`
            - **Author:** `${{ github.event.head_commit.author.name }}`

            **Workflow Link:**
            - [View Failed Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **Environment:**
            - `production`

            **Failure Summary:**
            The deployment to the production environment failed. Please review the workflow logs for details.

            **Actionable Next Steps:**
            1. **Assess the failure:** Review the workflow logs to understand the root cause.
            2. **Initiate Revert:** If the failure is critical and cannot be immediately resolved, revert the commit to restore the production environment to a stable state.
            3. **Create a Hotfix:** If a fix is identified, create a hotfix branch and deploy it as soon as possible.
          labels: 'deployment,rollback,ci/cd,incident,priority: high'
