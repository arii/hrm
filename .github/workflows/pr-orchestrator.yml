name: PR Automation Orchestrator

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  actions: read

jobs:
  filter:
    name: 🔍 Path Filter
    runs-on: ubuntu-latest
    outputs:
      should_review: ${{ steps.changes.outputs.src }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          # Automatically compares HEAD against the PR base (leader)
          filters: |
            src:
              - 'app/**'
              - 'components/**'
              - 'constants/**'
              - 'context/**'
              - 'hooks/**'
              - 'lib/**'
              - 'services/**'
              - 'utils/**'
              - 'types/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'next.config.js'
              - 'tailwind.config.ts'
              - '.env*'
              - '.github/**'
              - 'scripts/**'

  pr-quality:
    name: 🛡️ Quality Gates
    needs: [filter]
    if: needs.filter.outputs.should_review == 'true'
    uses: ./.github/workflows/pr-quality.yml
    with:
      has_changes: true
    secrets:
      GH_TOKEN: ${{ secrets.ARI_PAT }}

  pr-review:
    name: 🤖 Gemini AI Review
    needs: [filter, pr-quality]
    # Requisite: Filter matches AND Quality Gate passed
    if: |
      always() &&
      needs.filter.outputs.should_review == 'true' &&
      needs.pr-quality.result == 'success'
    uses: ./.github/workflows/reusable-gemini-review.yml
    with:
      pr_quality_result: ${{ needs.pr-quality.result }}
      trigger_event: 'pull_request'
      # Path filter handles the diff logic; we pass current HEAD for analysis
      last_non_empty_commit: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit
