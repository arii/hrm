name: Auto Rebase & Conflict Resolve

on:
  # This workflow is triggered on PRs to the leader branch.
  # It uses pull_request_target to have access to secrets.
  pull_request_target:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number to rebase'
        required: false

jobs:
  rebase-and-resolve:
    runs-on: ubuntu-latest
    # Only run for PRs targeting the leader branch
    if: github.event.pull_request.base.ref == 'leader' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # Step 1: Checkout TRUSTED base branch code (leader). This contains our trusted scripts.
      - name: Checkout Base Branch (Trusted)
        uses: actions/checkout@v4
        with:
          ref: 'leader'
          token: ${{ secrets.ARI_PAT }}

      - name: Setup Node & PNPM
        uses: ./.github/actions/setup-env

      # Step 2: Attempt the standard rebase action.
      - name: Attempt Automatic Rebase
        id: rebase
        uses: peter-evans/rebase@v3
        continue-on-error: true
        with:
          token: ${{ secrets.ARI_PAT }}
          base: leader
          exclude-labels: 'no-rebase,wip'

      # --- AI CONFLICT RESOLUTION START ---
      # This block only runs if the automatic rebase failed.
      - name: Get PR Info
        if: steps.rebase.conclusion == 'failure'
        id: pr_data
        env:
          GH_TOKEN: ${{ secrets.ARI_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          PR_DATA=$(gh pr view $PR_NUMBER --json headRefOid)
          echo "HEAD_SHA=$(echo $PR_DATA | jq -r .headRefOid)" >> $GITHUB_OUTPUT

      # Step 3: Checkout UNTRUSTED PR code into a separate directory for analysis.
      - name: Checkout PR Code (Untrusted)
        if: steps.rebase.conclusion == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_data.outputs.HEAD_SHA }}
          path: 'pr-code' # Checkout to a subdirectory
          token: ${{ secrets.ARI_PAT }}
          fetch-depth: 0 # Needed for rebase

      # Step 4: Manually reproduce the rebase failure inside the UNTRUSTED directory.
      - name: Manual Rebase to Capture Conflicts
        if: steps.rebase.conclusion == 'failure'
        id: manual_rebase
        continue-on-error: true
        working-directory: ./pr-code # Run commands inside the subdir
        run: |
          git config user.email "bot@example.com"
          git config user.name "Gemini Bot"

          # Fetch the leader branch to make it available for rebase
          git fetch origin leader:leader

          if git rebase leader; then
            echo "Rebase passed unexpectedly."
          else
            echo "Rebase failed as expected. Capturing conflicts..."
            # List conflicting files and write to the PARENT directory
            git diff --name-only --diff-filter=U -z > ../conflicts.txt
          fi

      # Step 5: Run the TRUSTED script from the base checkout to analyze the UNTRUSTED files.
      - name: Run Gemini Conflict Resolver
        if: steps.rebase.conclusion == 'failure' && steps.manual_rebase.conclusion == 'failure'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.ARI_PAT }}
        run: |
          if [ ! -f conflicts.txt ]; then
            echo "No conflicts file found, skipping resolution."
            exit 0
          fi
          pnpm tsx scripts/gemini-client.ts \
            --preset "resolve-conflict" \
            --context-file "conflicts.txt" \
            --output "resolution-report.md"

      - name: Create Placeholder Report on Unexpected Rebase Success
        if: steps.rebase.conclusion == 'failure' && steps.manual_rebase.outcome == 'success'
        run: echo "✅ Manual rebase succeeded without conflicts. No resolution needed." > resolution-report.md

      - name: Post Resolution Report
        if: steps.rebase.conclusion == 'failure'
        uses: mshick/add-pr-comment@v2
        with:
          message-path: resolution-report.md
          issue: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      # --- AI CONFLICT RESOLUTION END ---
