name: Auto-rebase

on:
  push:
    branches:
      - leader
  # Allows manual triggering from the Actions tab
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to rebase (optional, if omitted all PRs are rebased)'
        required: false
  # Allows calling from other workflows
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull Request number to rebase'
        required: false
        type: string

jobs:
  rebase:
    runs-on: ubuntu-latest
    # Removed the incorrect 'if: github.ref != ...' which prevented it from running on pushes to leader
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PAT Token
        run: |
          if [ -z "${{ secrets.PAT_TOKEN }}" ] && [ -z "${{ secrets.ARI_PAT }}" ]; then
            echo "::warning::Neither PAT_TOKEN nor ARI_PAT secrets are configured. Using default GITHUB_TOKEN fallback. This might fail on protected branches with required status checks, as the default token cannot trigger subsequent CI workflows."
          else
            echo "::notice::Personal Access Token (PAT) is configured"
          fi

      - name: Rebase PRs
        uses: peter-evans/rebase@v4
        with:
          # A PAT (Personal Access Token) with 'repo' scope is highly recommended.
          # The default GITHUB_TOKEN has limitations: it cannot trigger other workflows
          # (e.g., CI checks won't run after the rebase) and may not be able to push
          # to protected branches depending on repository settings.
          token: ${{ secrets.PAT_TOKEN || secrets.ARI_PAT || secrets.GITHUB_TOKEN }}
          base: leader
          # Rebase a specific PR if pr_number is provided, otherwise rebase all open PRs targeting leader
          pull-request-number: ${{ inputs.pr_number || github.event.inputs.pr_number }}
          # "Intelligent" behavior: Exclude branches with specific labels (e.g., if you are in the middle of a complex refactor)
          exclude-labels: |
            no-rebase
            wip
            no-update
        continue-on-error: true
