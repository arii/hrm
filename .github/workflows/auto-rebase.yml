# owner: @arii
# purpose: Standard automation workflow
# metrics:
# - median_duration
# - failure_rate
# - ai_invocation_rate
# - deterministic_fail_rate

name: Auto Rebase

on:
  push:
    branches:
      - leader
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebase:
    runs-on: ubuntu-latest
    # Rebase all open PRs targeting 'leader' when 'leader' is updated
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PAT Token
        run: |
          if [ -z "${{ secrets.PAT_TOKEN }}" ]; then
            echo "::warning::PAT_TOKEN secret is not configured. Auto-rebase will not work."
            echo "Please configure a Personal Access Token (PAT) with 'repo' scope in repository secrets."
            exit 0
          else
            echo "::notice::PAT_TOKEN is configured"
          fi

      - name: Rebase PRs
        uses: peter-evans/rebase@v5
        with:
          token: ${{ secrets.PAT_TOKEN }} # A PAT with 'repo' scope is required to allow the action to push to protected branches and trigger CI.
          base: leader
          # "Intelligent" behavior: Exclude branches with specific labels (e.g., if you are in the middle of a complex refactor)
          exclude-labels: |
            no-rebase
            wip
        continue-on-error: true
