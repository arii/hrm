name: Auto-rebase

on:
  push:
    branches:
      - leader
  # Allows manual triggering from the Actions tab
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to rebase (optional, if omitted all PRs are rebased)'
        required: false
  # Allows calling from other workflows
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull Request number to rebase'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Check for open PRs
        id: pr_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            COUNT=$(gh pr list --repo ${{ github.repository }} --base leader --state open --json number --jq 'length' || echo "1")
            if [ "$COUNT" -eq 0 ]; then
              echo "::notice::No open PRs targeting leader. Skipping rebase."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Token Check
        if: steps.pr_check.outputs.skip != 'true'
        run: |
          if [ -z "${{ secrets.PAT_TOKEN }}" ] && [ -z "${{ secrets.ARI_PAT }}" ]; then
            echo "::error::Personal Access Token (PAT) not found. A PAT is required to trigger CI workflows after rebase."
            exit 1
          fi

      - name: Checkout code
        if: steps.pr_check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase PRs
        if: steps.pr_check.outputs.skip != 'true'
        uses: peter-evans/rebase@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.ARI_PAT }}
          base: leader
          pull-request-number: ${{ inputs.pr_number }}
          exclude-labels: |
            no-rebase
            wip
            no-update
        continue-on-error: true
