name: Auto-rebase

on:
  push:
    branches:
      - leader
  # Allows manual triggering from the Actions tab
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to rebase (optional, if omitted all PRs are rebased)'
        required: false
  # Allows calling from other workflows
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull Request number to rebase'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Token Check
        run: |
          if [ -z "${{ secrets.PAT_TOKEN }}" ] && [ -z "${{ secrets.ARI_PAT }}" ]; then
            echo "::error::Personal Access Token (PAT) not found. A PAT is required to trigger CI workflows after rebase."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase PRs
        uses: peter-evans/rebase@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.ARI_PAT }}
          base: leader
          pull-request-number: ${{ inputs.pr_number }}
          exclude-labels: |
            no-rebase
            wip
            no-update
        continue-on-error: true
