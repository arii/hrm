# .github/workflows/gemini-orchestrator.yml
name: Gemini Orchestrator

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        required: true
        default: 'review'
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  actions: read

jobs:
  # 1. Run CI checks on every push to a PR
  pr-quality:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      actions: read
      checks: write
      issues: write
    uses: ./.github/workflows/pr-quality.yml
    secrets:
      GH_TOKEN: ${{ secrets.ARI_PAT }}

  # 2. Trigger review AFTER CI checks are done for a PR event
  review-on-pr-update:
    if: github.event_name == 'pull_request'
    needs: [pr-quality]
    permissions:
      contents: read
      pull-requests: write
      actions: read # <--- Required by the reusable workflow
      checks: write # <--- Required for reporting quality metrics
      issues: write
    uses: ./.github/workflows/reusable-gemini-review.yml
    with:
      # Pass the result of the CI checks. It's crucial for the reusable workflow
      # to know if the tests passed or failed. `always()` is implied by `needs`.
      pr_quality_result: ${{ needs.pr-quality.result }}
      trigger_event: 'pull_request'
    secrets: inherit

  # 3. Trigger review immediately for a comment command (e.g., @jules fix or @gemini-bot)
  review-on-comment:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '@gemini-bot') || startsWith(github.event.comment.body, '@jules fix'))
    permissions:
      contents: read
      issues: write
      checks: write
      pull-requests: write
      actions: read
    uses: ./.github/workflows/reusable-gemini-review.yml
    with:
      # CI checks do not run on a comment event, so we pass a neutral status.
      # The reusable workflow will fetch the checks from the latest commit itself.
      pr_quality_result: 'not_applicable'
      trigger_event: 'comment'
      comment_body: ${{ github.event.comment.body }}
    secrets: inherit

  gemini-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Run Gemini Client
        run: pnpm tsx scripts/gemini-client.ts --preset "${{ github.event.inputs.command }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  gemini-invoke:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '@gemini-bot')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Run Gemini Client
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: pnpm tsx scripts/gemini-client.ts --comment-body "$COMMENT_BODY"

  update-pr-on-comment:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '@gemini-update-pr'
    runs-on: ubuntu-latest
    steps:
      - name: 'Trigger PR Enrichment'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr-enrichment.yml',
              ref: 'refs/pull/${{ github.event.issue.number }}/head'
            });
