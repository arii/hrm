# .github/workflows/gemini-orchestrator.yml
name: Gemini Orchestrator

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        required: true
        default: 'review'
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  actions: write

jobs:
  comment-router:
    name: 🔍 Comment Router
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    runs-on: ubuntu-latest
    outputs:
      is_review_comment: ${{ steps.router.outputs.is_review_comment }}
      is_gemini_invoke: ${{ steps.router.outputs.is_gemini_invoke }}
      is_update_pr: ${{ steps.router.outputs.is_update_pr }}
      is_squash_comment: ${{ steps.router.outputs.is_squash_comment }}
      is_conflict_resolve_comment: ${{ steps.router.outputs.is_conflict_resolve_comment }}
    steps:
      - name: Route Comment
        id: router
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Use grep for robust matching.
          # '^' matches the beginning of the string.
          # '-x' matches the entire line exactly.
          if echo "$COMMENT_BODY" | grep -q '^@gemini-bot' || echo "$COMMENT_BODY" | grep -q '^@jules fix'; then
            echo "is_review_comment=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$COMMENT_BODY" | grep -q '^@gemini-bot'; then
            echo "is_gemini_invoke=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$COMMENT_BODY" | grep -Fxq '@gemini-update-pr'; then
            echo "is_update_pr=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$COMMENT_BODY" | grep -q '@pr-squash'; then
            echo "is_squash_comment=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$COMMENT_BODY" | grep -q '@conflict-resolve'; then
            echo "is_conflict_resolve_comment=true" >> "$GITHUB_OUTPUT"
          fi

  check-diff:
    name: 📝 Check for file changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check_files.outputs.has_changes }}
      last_non_empty_commit: ${{ steps.check_files.outputs.last_non_empty_commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Check for file changes and find last non-empty commit
        id: check_files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git fetch origin ${{ github.base_ref }} --depth=100

          MERGE_BASE=$(git merge-base HEAD origin/${{ github.base_ref }})
          if [ -z "$MERGE_BASE" ]; then
            echo "::warning::Could not find a merge-base. Falling back to HEAD~1."
            MERGE_BASE=$(git rev-parse HEAD~1)
          fi
          echo "::notice::Merge base is at ${MERGE_BASE}"

          if git diff --quiet "$MERGE_BASE" HEAD -- .; then
            echo "::notice::No file changes detected between HEAD and merge base. Searching PR history..."
            echo "has_changes=false" >> $GITHUB_OUTPUT

            # Even if HEAD has no changes, we find the last non-empty commit to ensure that
            # downstream workflows (like gemini-review) have a valid commit SHA to analyze,
            # especially in cases of reverts or empty commits.
            echo "::notice::Fetching commit list from GitHub API for PR #${{ github.event.pull_request.number }}..."
            COMMIT_SHAS_JSON=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" --jq '.[].sha' || true)

            if [ -z "$COMMIT_SHAS_JSON" ]; then
              echo "::error::Failed to fetch commits from GitHub API. Cannot determine last non-empty commit."
              echo "last_non_empty_commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
              exit 0
            fi

            mapfile -t COMMIT_SHAS < <(echo "$COMMIT_SHAS_JSON" | tac)

            LAST_NON_EMPTY_COMMIT=""
            for sha in "${COMMIT_SHAS[@]}"; do
              if ! git cat-file -e "$sha" &>/dev/null; then
                echo "::notice::Commit $sha not found locally, fetching..."
                git fetch origin "$sha" --depth=1
              fi

              if git cat-file -e "$sha^" &>/dev/null; then
                if ! git diff --quiet "$sha^" "$sha" -- .; then
                  echo "::notice::Found last non-empty commit: $sha"
                  LAST_NON_EMPTY_COMMIT=$sha
                  break
                fi
              else
                if [ -n "$(git ls-tree --name-only -r "$sha")" ]; then
                  echo "::notice::Found first commit in PR with files: $sha"
                  LAST_NON_EMPTY_COMMIT=$sha
                  break
                fi
              fi
            done

            if [ -z "$LAST_NON_EMPTY_COMMIT" ]; then
              echo "::warning::Could not find any non-empty commit in the PR history. Using HEAD as fallback."
              LAST_NON_EMPTY_COMMIT=$(git rev-parse HEAD)
            fi
            echo "last_non_empty_commit=${LAST_NON_EMPTY_COMMIT}" >> $GITHUB_OUTPUT
          else
            echo "::notice::File changes detected between HEAD and merge base."
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "last_non_empty_commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          fi
  # 1. Run CI checks on every push to a PR
  pr-quality:
    if: github.event_name == 'pull_request' && needs.check-diff.outputs.has_changes == 'true'
    needs: [check-diff]
    permissions:
      contents: read
      pull-requests: write
      actions: read
      checks: write
      issues: write
    uses: ./.github/workflows/pr-quality.yml
    with:
      has_changes: ${{ needs.check-diff.outputs.has_changes }}
    secrets:
      GH_TOKEN: ${{ secrets.ARI_PAT }}

  # 2. Trigger review AFTER CI checks are done for a PR event
  review-on-pr-update:
    if: always() && github.event_name == 'pull_request' && needs.check-diff.outputs.has_changes == 'true'
    needs: [check-diff, pr-quality]
    permissions:
      contents: read
      pull-requests: write
      actions: read # <--- Required by the reusable workflow
      checks: write # <--- Required for reporting quality metrics
      issues: write
    uses: ./.github/workflows/reusable-gemini-review.yml
    with:
      # Pass the result of the CI checks. It's crucial for the reusable workflow
      # to know if the tests passed or failed. `always()` is implied by `needs`.
      pr_quality_result: ${{ needs.pr-quality.result }}
      trigger_event: 'pull_request'
      last_non_empty_commit: ${{ needs.check-diff.outputs.last_non_empty_commit }}
      failure_report_json: ${{ needs.pr-quality.outputs.failure-report-json }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ARI_PAT: ${{ secrets.ARI_PAT }}

  create-tech-debt-issues:
    name: 💎 Create Tech Debt Issues
    # This job runs only if the preceding review job was successful AND a review was actually performed.
    if: >
      github.event_name == 'pull_request' &&
      needs.review-on-pr-update.result == 'success' &&
      needs.review-on-pr-update.outputs.review_performed == 'true'
    needs: [review-on-pr-update]
    uses: ./.github/workflows/reusable-create-review-issues.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      # Pass the current run ID to source the artifact directly
      run_id: ${{ github.run_id }}
    secrets:
      gh_token: ${{ secrets.ARI_PAT }}

  check-diff-on-comment:
    name: 📝 Check for file changes on comment
    if: github.event_name == 'issue_comment' && needs.comment-router.outputs.is_review_comment == 'true'
    needs: [comment-router]
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check_files.outputs.has_changes }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 2
      - name: Check for file changes
        id: check_files
        run: |
          if git diff --quiet HEAD HEAD~1; then
            echo "No changes detected in HEAD commit."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in HEAD commit."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  # 3. Trigger review immediately for a comment command (e.g., @jules fix or @gemini-bot)
  review-on-comment:
    if: needs.comment-router.outputs.is_review_comment == 'true' && needs.check-diff-on-comment.outputs.has_changes == 'true'
    needs: [comment-router, check-diff-on-comment]
    permissions:
      contents: read
      issues: write
      checks: write
      pull-requests: write
      actions: read
    uses: ./.github/workflows/reusable-gemini-review.yml
    with:
      # CI checks do not run on a comment event, so we pass a neutral status.
      # The reusable workflow will fetch the checks from the latest commit itself.
      pr_quality_result: 'not_applicable'
      trigger_event: 'comment'
      comment_body: ${{ github.event.comment.body }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ARI_PAT: ${{ secrets.ARI_PAT }}

  gemini-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Run Gemini Client
        run: pnpm tsx scripts/gemini-client.ts --preset "${{ github.event.inputs.command }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  gemini-invoke:
    if: needs.comment-router.outputs.is_gemini_invoke == 'true'
    needs: [comment-router]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Run Gemini Client
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: pnpm tsx scripts/gemini-client.ts --comment-body "$COMMENT_BODY"

  update-pr-on-comment:
    if: needs.comment-router.outputs.is_update_pr == 'true'
    needs: [comment-router]
    runs-on: ubuntu-latest
    steps:
      - name: 'Trigger PR Enrichment'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr-enrichment.yml',
              ref: 'refs/pull/${{ github.event.issue.number }}/head'
            });

  squash-on-comment:
    if: needs.comment-router.outputs.is_squash_comment == 'true'
    needs: [comment-router]
    runs-on: ubuntu-latest
    steps:
      - name: 'Trigger PR Squash'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr-squash.yml',
              ref: 'leader',
              inputs: {
                pr_number: `${{ github.event.issue.number }}`,
                comment_body: `${{ github.event.comment.body }}`,
                comment_id: `${{ github.event.comment.id }}`
              }
            });

  react-to-conflict-resolve-comment:
    if: needs.comment-router.outputs.is_conflict_resolve_comment == 'true'
    needs: [comment-router]
    runs-on: ubuntu-latest
    steps:
      - name: Add reaction to comment
        uses: peter-evans/create-reaction@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-id: ${{ github.event.comment.id }}
          reaction: eyes

  resolve-conflicts-on-comment:
    if: needs.comment-router.outputs.is_conflict_resolve_comment == 'true'
    needs: [comment-router]
    runs-on: ubuntu-latest
    steps:
      - name: 'Trigger Conflict Resolver'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const baseBranch = pr.data.base.ref;
            const headBranch = pr.data.head.ref;

            console.log(`Triggering conflict resolution for PR #${context.issue.number}: merging '${headBranch}' into '${baseBranch}'`);

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'conflict-resolver.yml',
              ref: baseBranch,
              inputs: {
                target_branch: baseBranch,
                source_branch: headBranch,
                pr_number: String(context.issue.number),
              },
            });
