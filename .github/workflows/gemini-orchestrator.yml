# .github/workflows/gemini-orchestrator.yml
name: Gemini Orchestrator

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        required: true
        default: 'review'
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  actions: write

jobs:
  comment-router:
    name: 🔍 Comment Router
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    runs-on: ubuntu-latest
    outputs:
      is_review_comment: ${{ steps.router.outputs.is_review_comment }}
      is_gemini_invoke: ${{ steps.router.outputs.is_gemini_invoke }}
      is_update_pr: ${{ steps.router.outputs.is_update_pr }}
      is_squash_comment: ${{ steps.router.outputs.is_squash_comment }}
      is_conflict_resolve_comment: ${{ steps.router.outputs.is_conflict_resolve_comment }}
    steps:
      - name: Route Comment
        id: router
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Use grep for robust matching.
          # '^' matches the beginning of the string.
          # '-x' matches the entire line exactly.
          if echo "$COMMENT_BODY" | grep -q '^@gemini-bot' || echo "$COMMENT_BODY" | grep -q '^@jules fix'; then
            echo "is_review_comment=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$COMMENT_BODY" | grep -q '^@gemini-bot'; then
            echo "is_gemini_invoke=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$COMMENT_BODY" | grep -Fxq '@gemini-update-pr'; then
            echo "is_update_pr=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$COMMENT_BODY" | grep -q '@pr-squash'; then
            echo "is_squash_comment=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$COMMENT_BODY" | grep -q '@conflict-resolve'; then
            echo "is_conflict_resolve_comment=true" >> "$GITHUB_OUTPUT"
          fi

  check-paths:
    name: 📝 Check for relevant file changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check_files.outputs.has_changes }}
      last_non_empty_commit: ${{ steps.check_files.outputs.last_non_empty_commit }}
      should_run_tests: ${{ steps.check_files.outputs.should_run_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 100 # Fetch enough history to find the merge base

      - name: Check for file changes and relevant paths
        id: check_files
        run: |
          set -e # Exit script on any error

          # 1. Determine the correct base for comparison
          echo "Fetching base ref: ${{ github.base_ref }}"
          git fetch origin ${{ github.base_ref }} --depth=100

          MERGE_BASE=$(git merge-base HEAD origin/${{ github.base_ref }})
          echo "Merge base identified as: $MERGE_BASE"

          # 2. Check if there are any file changes at all
          if git diff --quiet "$MERGE_BASE" HEAD -- .; then
            echo "::notice::No file changes detected between $MERGE_BASE and HEAD."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "should_run_tests=false" >> $GITHUB_OUTPUT
            LAST_NON_EMPTY_COMMIT=$(git log -1 --pretty=format:%H "$MERGE_BASE"..HEAD -- . || git rev-parse HEAD)
            echo "last_non_empty_commit=${LAST_NON_EMPTY_COMMIT}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 3. If there are changes, determine if they are critical
          echo "::notice::File changes detected. Checking for critical paths..."
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "last_non_empty_commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

          CHANGED_FILES=$(git diff --name-only "$MERGE_BASE" HEAD)
          echo "--- Changed Files ---"
          echo "$CHANGED_FILES"
          echo "---------------------"

          # Define patterns for critical files that require running the full test suite
          CRITICAL_PATTERNS=(
            "^app/"
            "^components/"
            "^lib/"
            "^services/"
            "^tests/"
            "^types/"
            "^utils/"
            "^server\\.ts$"
            "pnpm-lock.yaml$"
            "package.json$"
            "next.config.js$"
            "tsconfig.*\\.json$"
            "jest.config.cjs$"
            "eslint.config.mjs$"
            "\\.github/workflows/"
            "\\.github/actions/"
          )

          # Join patterns with | for grep
          GREP_PATTERN=$(printf "%s|" "${CRITICAL_PATTERNS[@]}")
          GREP_PATTERN=${GREP_PATTERN%|} # Remove trailing pipe

          if echo "$CHANGED_FILES" | grep -E -q "$GREP_PATTERN"; then
            echo "::notice::✅ Critical file changes detected. Full CI suite will run."
            echo "should_run_tests=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::📝 Docs-only or non-critical changes detected. Skipping test suite."
            echo "should_run_tests=false" >> $GITHUB_OUTPUT
          fi
  # 1. Run CI checks on every push to a PR
  pr-quality:
    if: github.event_name == 'pull_request' && needs.check-paths.outputs.should_run_tests == 'true'
    needs: [check-paths]
    permissions:
      contents: read
      pull-requests: write
      actions: read
      checks: write
      issues: write
    uses: ./.github/workflows/pr-quality.yml
    with:
      has_changes: ${{ needs.check-paths.outputs.has_changes }}
    secrets:
      GH_TOKEN: ${{ secrets.ARI_PAT }}

  # 2. Trigger review AFTER CI checks are done for a PR event
  review-on-pr-update:
    if: always() && github.event_name == 'pull_request' && needs.check-paths.outputs.has_changes == 'true'
    needs: [check-paths, pr-quality]
    permissions:
      contents: read
      pull-requests: write
      actions: read # <--- Required by the reusable workflow
      checks: write # <--- Required for reporting quality metrics
      issues: write
    uses: ./.github/workflows/reusable-gemini-review.yml
    with:
      # Pass the result of the CI checks. It's crucial for the reusable workflow
      # to know if the tests passed or failed. `always()` is implied by `needs`.
      pr_quality_result: ${{ needs.pr-quality.result }}
      trigger_event: 'pull_request'
      last_non_empty_commit: ${{ needs.check-paths.outputs.last_non_empty_commit }}
      failure_report_json: ${{ needs.pr-quality.outputs.failure-report-json }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ARI_PAT: ${{ secrets.ARI_PAT }}

  create-tech-debt-issues:
    name: 💎 Create Tech Debt Issues
    # This job runs only if the preceding review job was successful AND a review was actually performed.
    if: >
      github.event_name == 'pull_request' &&
      needs.review-on-pr-update.result == 'success' &&
      needs.review-on-pr-update.outputs.review_performed == 'true'
    needs: [review-on-pr-update]
    uses: ./.github/workflows/reusable-create-review-issues.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      # Pass the current run ID to source the artifact directly
      run_id: ${{ github.run_id }}
    secrets:
      gh_token: ${{ secrets.ARI_PAT }}

  # 3. Trigger review immediately for a comment command (e.g., @jules fix or @gemini-bot)
  review-on-comment:
    if: needs.comment-router.outputs.is_review_comment == 'true'
    needs: [comment-router]
    permissions:
      contents: read
      issues: write
      checks: write
      pull-requests: write
      actions: read
    uses: ./.github/workflows/reusable-gemini-review.yml
    with:
      # CI checks do not run on a comment event, so we pass a neutral status.
      # The reusable workflow will fetch the checks from the latest commit itself.
      pr_quality_result: 'not_applicable'
      trigger_event: 'comment'
      comment_body: ${{ github.event.comment.body }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ARI_PAT: ${{ secrets.ARI_PAT }}

  gemini-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Run Gemini Client
        run: pnpm tsx scripts/gemini-client.ts --preset "${{ github.event.inputs.command }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  gemini-invoke:
    if: needs.comment-router.outputs.is_gemini_invoke == 'true'
    needs: [comment-router]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Run Gemini Client
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: pnpm tsx scripts/gemini-client.ts --comment-body "$COMMENT_BODY"

  update-pr-on-comment:
    if: needs.comment-router.outputs.is_update_pr == 'true'
    needs: [comment-router]
    runs-on: ubuntu-latest
    steps:
      - name: 'Trigger PR Enrichment'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr-enrichment.yml',
              ref: 'refs/pull/${{ github.event.issue.number }}/head'
            });

  squash-on-comment:
    if: needs.comment-router.outputs.is_squash_comment == 'true'
    needs: [comment-router]
    runs-on: ubuntu-latest
    steps:
      - name: 'Trigger PR Squash'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr-squash.yml',
              ref: 'leader',
              inputs: {
                pr_number: `${{ github.event.issue.number }}`,
                comment_body: `${{ github.event.comment.body }}`,
                comment_id: `${{ github.event.comment.id }}`
              }
            });

  react-to-conflict-resolve-comment:
    if: needs.comment-router.outputs.is_conflict_resolve_comment == 'true'
    needs: [comment-router]
    runs-on: ubuntu-latest
    steps:
      - name: Add reaction to comment
        uses: peter-evans/create-reaction@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-id: ${{ github.event.comment.id }}
          reaction: eyes

  resolve-conflicts-on-comment:
    if: needs.comment-router.outputs.is_conflict_resolve_comment == 'true'
    needs: [comment-router]
    runs-on: ubuntu-latest
    steps:
      - name: 'Trigger Conflict Resolver'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const baseBranch = pr.data.base.ref;
            const headBranch = pr.data.head.ref;

            console.log(`Triggering conflict resolution for PR #${context.issue.number}: merging '${headBranch}' into '${baseBranch}'`);

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'conflict-resolver.yml',
              ref: baseBranch,
              inputs: {
                target_branch: baseBranch,
                source_branch: headBranch,
                pr_number: String(context.issue.number),
              },
            });
