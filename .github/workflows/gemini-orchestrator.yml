# .github/workflows/gemini-orchestrator.yml
name: Gemini Orchestrator

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        required: true
        default: 'review'
      pr_number:
        description: 'The PR number to source review artifacts from'
        required: false
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  actions: write

jobs:
  comment-router:
    name: 🔍 Comment Router
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    runs-on: ubuntu-latest
    outputs:
      is_review_comment: ${{ steps.router.outputs.is_review_comment }}
      is_gemini_invoke: ${{ steps.router.outputs.is_gemini_invoke }}
      is_update_pr: ${{ steps.router.outputs.is_update_pr }}
      is_squash_comment: ${{ steps.router.outputs.is_squash_comment }}
      is_conflict_resolve_comment: ${{ steps.router.outputs.is_conflict_resolve_comment }}
      is_jules_command: ${{ steps.router.outputs.is_jules_command }}
      is_create_issues_command: ${{ steps.router.outputs.is_create_issues_command }}
    steps:
      - name: Route Comment
        id: router
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Use grep for robust matching.
          # '^' matches the beginning of the string.
          # '-x' matches the entire line exactly.
          if echo "$COMMENT_BODY" | grep -q '^@gemini-bot' || echo "$COMMENT_BODY" | grep -q '^@jules fix'; then
            echo "is_review_comment=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$COMMENT_BODY" | grep -q '^@gemini-bot'; then
            echo "is_gemini_invoke=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$COMMENT_BODY" | grep -Fxq '@gemini-update-pr'; then
            echo "is_update_pr=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$COMMENT_BODY" | grep -q '@pr-squash'; then
            echo "is_squash_comment=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$COMMENT_BODY" | grep -q '@conflict-resolve'; then
            echo "is_conflict_resolve_comment=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$COMMENT_BODY" | grep -q '^@jules-delete' || echo "$COMMENT_BODY" | grep -q '^@jules-new'; then
            echo "is_jules_command=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$COMMENT_BODY" | grep -q '/create-issues'; then
            echo "is_create_issues_command=true" >> "$GITHUB_OUTPUT"
          fi

  check-diff:
    name: 📝 Check for file changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check_files.outputs.has_changes }}
      last_non_empty_commit: ${{ steps.check_files.outputs.last_non_empty_commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Check for file changes and find last non-empty commit
        id: check_files
        run: |
          set +e

          # Fetch the base branch to ensure it exists locally
          git fetch origin ${{ github.base_ref }} --depth=100 2>/dev/null || true

          # Get merge base between current branch and base branch
          MERGE_BASE=$(git merge-base HEAD origin/${{ github.base_ref }} 2>/dev/null)

          if [ -z "$MERGE_BASE" ]; then
            # Fallback: use previous commit if merge-base fails
            MERGE_BASE=$(git rev-parse HEAD~1 2>/dev/null)
          fi

          if [ -z "$MERGE_BASE" ]; then
            # Last resort: compare HEAD against itself (will show no changes)
            MERGE_BASE=$(git rev-parse HEAD)
          fi

          # Check if there are actual file changes between merge base and HEAD
          HAS_DIFF=0
          git diff --quiet "$MERGE_BASE" HEAD -- .
          HAS_DIFF=$?

          if [ $HAS_DIFF -eq 0 ]; then
            # No changes found
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "::notice::No file changes detected between $MERGE_BASE and HEAD"

            # Find the last commit with file changes in the PR
            for sha in $(git rev-list "$MERGE_BASE"..HEAD 2>/dev/null | head -100); do
              if git cat-file -e $sha^ &>/dev/null 2>/dev/null; then
                if ! git diff --quiet $sha^ $sha -- . ; then
                  echo "last_non_empty_commit=$sha" >> $GITHUB_OUTPUT
                  break
                fi
              fi
            done
          else
            # Changes found
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "last_non_empty_commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
            echo "::notice::File changes detected between $MERGE_BASE and HEAD"
          fi

          exit 0
  # 1. Run CI checks on every push to a PR
  pr-quality:
    if: github.event_name == 'pull_request' && needs.check-diff.outputs.has_changes == 'true'
    needs: [check-diff]
    permissions:
      contents: read
      pull-requests: write
      actions: read
      checks: write
      issues: write
    uses: ./.github/workflows/pr-quality.yml
    with:
      has_changes: ${{ needs.check-diff.outputs.has_changes }}
    secrets:
      GH_TOKEN: ${{ secrets.ARI_PAT }}

  # 2. Trigger review AFTER CI checks are done for a PR event
  review-on-pr-update:
    if: always() && github.event_name == 'pull_request' && needs.check-diff.outputs.has_changes == 'true'
    needs: [check-diff, pr-quality]
    permissions:
      contents: read
      pull-requests: write
      actions: read # <--- Required by the reusable workflow
      checks: write # <--- Required for reporting quality metrics
      issues: write
    uses: ./.github/workflows/reusable-gemini-review.yml
    with:
      # Pass the result of the CI checks. It's crucial for the reusable workflow
      # to know if the tests passed or failed. `always()` is implied by `needs`.
      pr_quality_result: ${{ needs.pr-quality.result }}
      trigger_event: 'pull_request'
      last_non_empty_commit: ${{ needs.check-diff.outputs.last_non_empty_commit }}
      failure_report_json: ${{ needs.pr-quality.outputs.failure-report-json }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ARI_PAT: ${{ secrets.ARI_PAT }}

  create-tech-debt-issues:
    name: 💎 Create Tech Debt Issues
    # This job runs only if the preceding review job was successful AND a review was actually performed.
    if: >
      github.event_name == 'pull_request' &&
      needs.review-on-pr-update.result == 'success' &&
      needs.review-on-pr-update.outputs.review_performed == 'true'
    needs: [review-on-pr-update]
    uses: ./.github/workflows/reusable-create-review-issues.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      # Pass the current run ID to source the artifact directly
      run_id: ${{ github.run_id }}
    secrets:
      gh_token: ${{ secrets.ARI_PAT }}

  check-diff-on-comment:
    name: 📝 Check for file changes on comment
    if: github.event_name == 'issue_comment' && needs.comment-router.outputs.is_review_comment == 'true'
    needs: [comment-router]
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check_files.outputs.has_changes }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 2
      - name: Check for file changes
        id: check_files
        run: |
          if git diff --quiet HEAD HEAD~1; then
            echo "No changes detected in HEAD commit."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in HEAD commit."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  # 3. Trigger review immediately for a comment command (e.g., @jules fix or @gemini-bot)
  review-on-comment:
    if: needs.comment-router.outputs.is_review_comment == 'true' && needs.check-diff-on-comment.outputs.has_changes == 'true'
    needs: [comment-router, check-diff-on-comment]
    permissions:
      contents: read
      issues: write
      checks: write
      pull-requests: write
      actions: read
    uses: ./.github/workflows/reusable-gemini-review.yml
    with:
      # CI checks do not run on a comment event, so we pass a neutral status.
      # The reusable workflow will fetch the checks from the latest commit itself.
      pr_quality_result: 'not_applicable'
      trigger_event: 'comment'
      comment_body: ${{ github.event.comment.body }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ARI_PAT: ${{ secrets.ARI_PAT }}

  gemini-dispatch:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.command
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Run Gemini Client
        run: pnpm tsx scripts/gemini-client.ts --preset "${{ github.event.inputs.command }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  gemini-invoke:
    if: needs.comment-router.outputs.is_gemini_invoke == 'true'
    needs: [comment-router]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Run Gemini Client
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: pnpm tsx scripts/gemini-client.ts --comment-body "$COMMENT_BODY"

  update-pr-on-comment:
    if: needs.comment-router.outputs.is_update_pr == 'true'
    needs: [comment-router]
    uses: ./.github/workflows/pr-enrichment.yml
    with:
      pr_number: ${{ github.event.issue.number }}
    secrets: inherit

  squash-on-comment:
    if: needs.comment-router.outputs.is_squash_comment == 'true'
    needs: [comment-router]
    uses: ./.github/workflows/pr-squash.yml
    with:
      pr_number: ${{ github.event.issue.number }}
      comment_body: ${{ github.event.comment.body }}
      comment_id: ${{ github.event.comment.id }}
    secrets: inherit

  react-to-conflict-resolve-comment:
    if: needs.comment-router.outputs.is_conflict_resolve_comment == 'true'
    needs: [comment-router]
    runs-on: ubuntu-latest
    steps:
      - name: Add reaction to comment
        uses: peter-evans/create-reaction@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-id: ${{ github.event.comment.id }}
          reaction: eyes

  prepare-conflict-resolution:
    if: needs.comment-router.outputs.is_conflict_resolve_comment == 'true'
    needs: [comment-router]
    runs-on: ubuntu-latest
    outputs:
      target_branch: ${{ steps.get_branches.outputs.target_branch }}
      source_branch: ${{ steps.get_branches.outputs.source_branch }}
    steps:
      - name: Get PR Details
        id: get_branches
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('target_branch', pr.data.base.ref);
            core.setOutput('source_branch', pr.data.head.ref);

  resolve-conflicts-on-comment:
    if: needs.comment-router.outputs.is_conflict_resolve_comment == 'true'
    needs: [comment-router, prepare-conflict-resolution]
    uses: ./.github/workflows/conflict-resolver.yml
    with:
      target_branch: ${{ needs.prepare-conflict-resolution.outputs.target_branch }}
      source_branch: ${{ needs.prepare-conflict-resolution.outputs.source_branch }}
      pr_number: ${{ github.event.issue.number }}
    secrets: inherit

  jules-command:
    if: |
      needs.comment-router.outputs.is_jules_command == 'true' &&
      contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    needs: [comment-router]
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 'Parse Command'
        id: parse_command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [[ "$COMMENT_BODY" == "@jules-delete"* ]]; then
            echo "COMMAND=delete" >> $GITHUB_ENV
          elif [[ "$COMMENT_BODY" == "@jules-new"* ]]; then
            echo "COMMAND=new" >> $GITHUB_ENV
          fi

      - name: 'Get PR Context'
        id: pr_context
        if: env.COMMAND == 'new'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Fetch basic PR data
          PR_DATA=$(gh pr view "$PR_NUMBER" --json headRefName,baseRefName,body,title,comments,reviews)
          BRANCH=$(echo "$PR_DATA" | jq -r .headRefName)
          BASE_REF=$(echo "$PR_DATA" | jq -r .baseRefName)
          BODY=$(echo "$PR_DATA" | jq -r .body)
          TITLE=$(echo "$PR_DATA" | jq -r .title)

          # Fetch and format comments
          COMMENTS=$(echo "$PR_DATA" | jq -r '.comments | .[] | "- \(.body)"' | sed 's/^/  /')
          REVIEWS=$(echo "$PR_DATA" | jq -r '.reviews | .[] | select(.body != "") | "- \(.body)"' | sed 's/^/  /')

          # Fetch git logs
          # We assume the PR is up-to-date with the base branch
          # This gets the logs from the point the branch was created
          MERGE_BASE=$(git merge-base "origin/$BASE_REF" "HEAD")
          LOGS=$(git log -n 50 --pretty=format:"- %s" "$MERGE_BASE..HEAD")

          # Construct the full prompt
          FULL_PROMPT=$(cat <<EOM
          **PR Title:** $TITLE

          **PR Body:**
          $BODY

          **Review Comments:**
          $REVIEWS

          **Other Comments:**
          $COMMENTS

          **Git Logs:**
          $LOGS
          EOM
          )

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "PROMPT<<EOF" >> $GITHUB_ENV
          echo "$FULL_PROMPT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "TITLE=$TITLE" >> $GITHUB_ENV

      - name: 'Find Jules Session ID'
        id: find_session_id
        if: env.COMMAND == 'delete'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          SESSION_ID=$(gh pr view "$PR_NUMBER" --json comments --jq '.comments | .[] | .body' | grep -oP '(?<=<!-- JULES_SESSION_ID=)\S+(?= *-->)' | tail -n 1)
          if [ -z "$SESSION_ID" ]; then
            echo "::error::Could not find Jules session ID in PR comments. Was a session previously created using '@jules-new' and completed successfully?"
            exit 1
          fi
          echo "JULES_SESSION_ID=$SESSION_ID" >> $GITHUB_ENV

      - name: 'Validate Secrets and Install Dependencies'
        env:
          JULES_API_URL: ${{ secrets.JULES_API_URL }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set +e
          missing_vars=""

          if [ -z "$JULES_API_URL" ]; then
            missing_vars="JULES_API_URL"
          fi

          if [ -z "$JULES_API_KEY" ]; then
            if [ -n "$missing_vars" ]; then
              missing_vars="$missing_vars, JULES_API_KEY"
            else
              missing_vars="JULES_API_KEY"
            fi
          fi

          if [ -n "$missing_vars" ]; then
            echo "::error::The following required secrets are not set: $missing_vars. Please configure them in your repository secrets."
            exit 1
          fi

          echo "✅ All required Jules secrets are configured"
          pip install -r .github/scripts/requirements.txt

      - name: 'Run Jules Operation: New'
        if: env.COMMAND == 'new'
        id: jules_op_new
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          BRANCH: ${{ env.BRANCH }}
          TITLE: ${{ env.TITLE }}
          PROMPT: ${{ env.PROMPT }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set +e
          OUTPUT=$(python3 .github/scripts/jules_ops.py \
            --command "new" \
            --prompt "$PROMPT" \
            --branch "$BRANCH" \
            --title "$TITLE" \
            --owner "$REPO_OWNER" \
            --repo-name "$REPO_NAME" \
            --jules-api-url "${{ secrets.JULES_API_URL }}" 2>&1)
          EXIT_CODE=$?

          if [ $EXIT_CODE -ne 0 ]; then
            echo "error_message=$OUTPUT" >> $GITHUB_OUTPUT
            exit $EXIT_CODE
          fi

          echo "session_id=$OUTPUT" >> $GITHUB_OUTPUT

      - name: 'Run Jules Operation: Delete'
        if: env.COMMAND == 'delete'
        id: jules_op_delete
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_SESSION_ID: ${{ env.JULES_SESSION_ID }}
        run: |
          set +e
          OUTPUT=$(python3 .github/scripts/jules_ops.py \
            --command "delete" \
            --session-id "$JULES_SESSION_ID" \
            --jules-api-url "${{ secrets.JULES_API_URL }}" 2>&1)
          EXIT_CODE=$?

          if [ $EXIT_CODE -ne 0 ]; then
            echo "error_message=$OUTPUT" >> $GITHUB_OUTPUT
            exit $EXIT_CODE
          fi

      - name: 'Post Session ID Comment'
        if: success() && env.COMMAND == 'new'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sessionId = "${{ steps.jules_op_new.outputs.session_id }}";
            if (sessionId) {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ github.event.issue.number }},
                body: `<!-- JULES_SESSION_ID=${sessionId} -->`
              });
            }

      - name: 'Add Reaction to Comment'
        if: success()
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ github.event.comment.id }},
              content: '+1'
            })
      - name: 'Handle Failure'
        if: failure()
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const errorMessageNew = `${{ steps.jules_op_new.outputs.error_message || '' }}`;
            const errorMessageDelete = `${{ steps.jules_op_delete.outputs.error_message || '' }}`;
            const errorMessage = errorMessageNew || errorMessageDelete || 'Unknown error occurred';

            const body = `Jules operation failed with the following error:\n\n\`\`\`\n${errorMessage}\n\`\`\``;

            try {
              github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: ${{ github.event.comment.id }},
                content: '-1'
              }).catch(() => {}); // Ignore if reaction fails
            } catch (e) {
              console.log('Could not add reaction:', e);
            }

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.issue.number }},
              body: body
            })
  prepare-comment-run:
    if: needs.comment-router.outputs.is_create_issues_command == 'true'
    needs: [comment-router]
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ github.event.issue.number }}
      run_id: ${{ steps.find_run.outputs.run_id }}
    steps:
      - name: 'Get PR branch name'
        id: get_pr
        run: |
          gh pr view ${{ github.event.issue.number }} --json headRefName -q '.headRefName' > pr_branch.txt
          echo "branch=$(cat pr_branch.txt)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.ARI_PAT }}

      - name: 'Find successful workflow run'
        id: find_run
        env:
          GH_TOKEN: ${{ secrets.ARI_PAT }}
          BRANCH_NAME: ${{ steps.get_pr.outputs.branch }}
        run: |
          run_id=$(gh run list --workflow="pr-quality.yml" --branch="$BRANCH_NAME" --status=success --json databaseId -q '.[0].databaseId' || echo "")
          if [[ -z "$run_id" ]]; then
            echo "::error::Could not find a successful workflow run for $BRANCH_NAME."
            exit 1
          fi
          echo "run_id=$run_id" >> $GITHUB_OUTPUT

  create-issues-from-comment:
    needs: prepare-comment-run
    uses: ./.github/workflows/reusable-create-review-issues.yml
    with:
      pr_number: ${{ needs.prepare-comment-run.outputs.pr_number }}
      run_id: ${{ needs.prepare-comment-run.outputs.run_id }}
    secrets:
      gh_token: ${{ secrets.ARI_PAT }}

  create-issues-from-dispatch:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number
    needs: prepare-dispatch-run
    uses: ./.github/workflows/reusable-create-review-issues.yml
    with:
      pr_number: ${{ needs.prepare-dispatch-run.outputs.pr_number }}
      run_id: ${{ needs.prepare-dispatch-run.outputs.run_id }}
    secrets:
      gh_token: ${{ secrets.ARI_PAT }}

  prepare-dispatch-run:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ github.event.inputs.pr_number }}
      run_id: ${{ steps.find_run.outputs.run_id }}
    steps:
      - name: 'Get PR branch name'
        id: get_pr
        run: |
          gh pr view ${{ github.event.inputs.pr_number }} --json headRefName -q '.headRefName' > pr_branch.txt
          echo "branch=$(cat pr_branch.txt)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.ARI_PAT }}

      - name: 'Find successful workflow run'
        id: find_run
        env:
          GH_TOKEN: ${{ secrets.ARI_PAT }}
          BRANCH_NAME: ${{ steps.get_pr.outputs.branch }}
        run: |
          run_id=$(gh run list --workflow="pr-quality.yml" --branch="$BRANCH_NAME" --status=success --json databaseId -q '.[0].databaseId' || echo "")
          if [[ -z "$run_id" ]]; then
            echo "::error::Could not find a successful workflow run for $BRANCH_NAME."
            exit 1
          fi
          echo "run_id=$run_id" >> $GITHUB_OUTPUT
