# .github/workflows/gemini-orchestrator.yml
name: Gemini Orchestrator

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        required: true
        default: 'review'
  issue_comment:
    types: [created]

jobs:
  gemini-review:
    if: github.event.action == 'opened'
    uses: ./.github/workflows/reusable-gemini-review.yml
    secrets: inherit

  gemini-rereview:
    if: github.event.action == 'synchronize'
    uses: ./.github/workflows/reusable-gemini-rereview.yml
    secrets: inherit



  gemini-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Run Gemini Client
        run: pnpm tsx scripts/gemini-client.ts --preset "${{ github.event.inputs.command }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-quality:
    if: github.event.action == 'synchronize' || github.event.action == 'opened'
    uses: ./.github/workflows/pr-quality.yml
    secrets:
      GH_TOKEN: ${{ secrets.ARI_PAT }}

  gemini-invoke:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '@gemini-bot')
    runs-on: self-hosted
    steps:
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Run Gemini Client
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: pnpm tsx scripts/gemini-client.ts --comment-body "$COMMENT_BODY"
