# .github/workflows/gemini-orchestrator.yml
name: Gemini Orchestrator

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        required: true
        default: 'review'
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  actions: write

jobs:
  comment-router:
    name: 🔍 Comment Router
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    runs-on: ubuntu-latest
    outputs:
      is_review_comment: ${{ steps.router.outputs.is_review_comment }}
      is_gemini_invoke: ${{ steps.router.outputs.is_gemini_invoke }}
      is_update_pr: ${{ steps.router.outputs.is_update_pr }}
      is_squash_comment: ${{ steps.router.outputs.is_squash_comment }}
    steps:
      - name: Route Comment
        id: router
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Use grep for robust matching.
          # '^' matches the beginning of the string.
          # '-x' matches the entire line exactly.
          if echo "$COMMENT_BODY" | grep -q '^@gemini-bot' || echo "$COMMENT_BODY" | grep -q '^@jules fix'; then
            echo "is_review_comment=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$COMMENT_BODY" | grep -q '^@gemini-bot'; then
            echo "is_gemini_invoke=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$COMMENT_BODY" | grep -Fxq '@gemini-update-pr'; then
            echo "is_update_pr=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$COMMENT_BODY" | grep -q '@pr-squash'; then
            echo "is_squash_comment=true" >> "$GITHUB_OUTPUT"
          fi

  check-diff:
    name: 📝 Check for meaningful changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.set_outputs.outputs.has_changes }}
      last_non_empty_commit: ${{ steps.set_outputs.outputs.last_non_empty_commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Check for meaningful changes
        id: check_meaningful_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          chmod +x ./scripts/ci/has-meaningful-changes.sh
          ./scripts/ci/has-meaningful-changes.sh

      - name: Set final outputs
        id: set_outputs
        env:
          HAS_CHANGES: ${{ steps.check_meaningful_changes.outputs.has_changes }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -e
          echo "has_changes=${HAS_CHANGES}" >> $GITHUB_OUTPUT

          if [ "${HAS_CHANGES}" == "false" ]; then
            echo "::notice::No meaningful changes detected. Searching for last relevant commit."
            git fetch origin ${BASE_REF} --depth=100 2>/dev/null || true
            MERGE_BASE=$(git merge-base HEAD origin/${BASE_REF} 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)

            LAST_COMMIT=""
            for sha in $(git rev-list "$MERGE_BASE"..HEAD 2>/dev/null | head -100); do
              if git cat-file -e $sha^ &>/dev/null; then
                if ! git diff --quiet $sha^ $sha -- .; then
                  LAST_COMMIT=$sha
                  break
                fi
              fi
            done

            if [ -z "$LAST_COMMIT" ]; then
                LAST_COMMIT=$HEAD_SHA
            fi
            echo "last_non_empty_commit=${LAST_COMMIT}" >> $GITHUB_OUTPUT
          else
            echo "::notice::Meaningful changes detected."
            echo "last_non_empty_commit=${HEAD_SHA}" >> $GITHUB_OUTPUT
          fi
  # 1. Run CI checks on every push to a PR
  pr-quality:
    if: github.event_name == 'pull_request' && needs.check-diff.outputs.has_changes == 'true'
    needs: [check-diff]
    permissions:
      contents: read
      pull-requests: write
      actions: read
      checks: write
      issues: write
    uses: ./.github/workflows/pr-quality.yml
    with:
      has_changes: ${{ needs.check-diff.outputs.has_changes }}
    secrets:
      GH_TOKEN: ${{ secrets.ARI_PAT }}

  # 2. Trigger review AFTER CI checks are done for a PR event
  review-on-pr-update:
    if: always() && github.event_name == 'pull_request' && needs.check-diff.outputs.has_changes == 'true'
    needs: [check-diff, pr-quality]
    permissions:
      contents: read
      pull-requests: write
      actions: read # <--- Required by the reusable workflow
      checks: write # <--- Required for reporting quality metrics
      issues: write
    uses: ./.github/workflows/reusable-gemini-review.yml
    with:
      # Pass the result of the CI checks. It's crucial for the reusable workflow
      # to know if the tests passed or failed. `always()` is implied by `needs`.
      pr_quality_result: ${{ needs.pr-quality.result }}
      trigger_event: 'pull_request'
      last_non_empty_commit: ${{ needs.check-diff.outputs.last_non_empty_commit }}
    secrets: inherit

  # 3. Trigger review immediately for a comment command (e.g., @jules fix or @gemini-bot)
  review-on-comment:
    if: needs.comment-router.outputs.is_review_comment == 'true'
    needs: [comment-router]
    permissions:
      contents: read
      issues: write
      checks: write
      pull-requests: write
      actions: read
    uses: ./.github/workflows/reusable-gemini-review.yml
    with:
      # CI checks do not run on a comment event, so we pass a neutral status.
      # The reusable workflow will fetch the checks from the latest commit itself.
      pr_quality_result: 'not_applicable'
      trigger_event: 'comment'
      comment_body: ${{ github.event.comment.body }}
    secrets: inherit

  gemini-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Run Gemini Client
        run: pnpm tsx scripts/gemini-client.ts --preset "${{ github.event.inputs.command }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  gemini-invoke:
    if: needs.comment-router.outputs.is_gemini_invoke == 'true'
    needs: [comment-router]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Setup Environment
        uses: ./.github/actions/setup-env
      - name: Run Gemini Client
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: pnpm tsx scripts/gemini-client.ts --comment-body "$COMMENT_BODY"

  update-pr-on-comment:
    if: needs.comment-router.outputs.is_update_pr == 'true'
    needs: [comment-router]
    runs-on: ubuntu-latest
    steps:
      - name: 'Trigger PR Enrichment'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr-enrichment.yml',
              ref: 'refs/pull/${{ github.event.issue.number }}/head'
            });

  squash-on-comment:
    if: needs.comment-router.outputs.is_squash_comment == 'true'
    needs: [comment-router]
    runs-on: ubuntu-latest
    steps:
      - name: 'Trigger PR Squash'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr-squash.yml',
              ref: 'leader',
              inputs: {
                pr_number: `${{ github.event.issue.number }}`,
                comment_body: `${{ github.event.comment.body }}`,
                comment_id: `${{ github.event.comment.id }}`
              }
            });
