name: Gemini Orchestrator

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      task:
        description: 'Task description'
        required: true
      context_files:
        description: 'Comma-separated list of context files'
        required: false
        default: 'README.md'
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gemini-tasks:
    runs-on: self-hosted
    steps:
      - name: 'Gemini Review'
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: ./.github/workflows/reusable-gemini-review.yml
        secrets:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARI_PAT: ${{ secrets.ARI_PAT }}

      - name: 'Gemini Smart Re-review'
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        uses: ./.github/workflows/reusable-gemini-rereview.yml
        secrets:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARI_PAT: ${{ secrets.ARI_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Gemini Triage'
        if: github.event_name == 'schedule' || github.event_name == 'issues'
        uses: ./.github/workflows/reusable-gemini-tasks.yml
        secrets:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARI_PAT: ${{ secrets.ARI_PAT }}

      - name: 'Gemini Dispatch'
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/setup-env
      - run: |
          echo "${{ inputs.task }}" > task_input.txt
          npx tsx scripts/gemini-client.ts \
            --task-file "task_input.txt" \
            --context "${{ inputs.context_files }}" \
            --output "dispatch_result.md"
        if: github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 'Gemini Invoke'
        if: github.event_name == 'issue_comment'
        uses: ./.github/actions/setup-env
      - run: |
          echo "${{ github.event.comment.body }}" > comment_body.txt
          npx tsx scripts/gemini-client.ts \
            --task-file "comment_body.txt" \
            --preset invoke \
            --output "invoke_result.md"
        if: github.event_name == 'issue_comment'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
