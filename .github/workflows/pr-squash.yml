name: PR Squash and Rebase

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'The PR number to squash'
        required: true
      comment_body:
        description: 'The body of the comment that triggered the squash'
        required: true
      comment_id:
        description: 'The ID of the comment that triggered the squash'
        required: true
  workflow_call:
    inputs:
      pr_number:
        description: 'The PR number to squash'
        required: true
        type: string
      comment_body:
        description: 'The body of the comment that triggered the squash'
        required: true
        type: string
      comment_id:
        description: 'The ID of the comment that triggered the squash'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  actions: read

jobs:
  squash-and-rebase:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.squash_rebase.outcome }}
      head_ref: ${{ steps.pr_data.outputs.head_ref }}
      base_ref: ${{ steps.pr_data.outputs.base_ref }}
      squashed_sha: ${{ steps.squash_rebase.outputs.squashed_sha }}
      base_sha: ${{ steps.squash_rebase.outputs.base_sha }}
    steps:
      - name: Install jq
        run: |
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
      - name: Acknowledge command
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ inputs.comment_id }},
              content: 'rocket'
            });

      - name: Get PR data
        id: pr_data
        uses: actions/github-script@v6
        with:
          script: |
            const response = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ inputs.pr_number }}
            });
            core.setOutput('head_ref', response.data.head.ref);
            core.setOutput('base_ref', response.data.base.ref);
            core.setOutput('pr_title', response.data.title);
            core.setOutput('pr_body', response.data.body);

      - name: Determine command
        id: command
        uses: actions/github-script@v6
        with:
          script: |
            try {
              const commentBody = process.env.COMMENT_BODY;
              if (commentBody.includes('@pr-squash-rebase')) {
                core.setOutput('command', 'squash-rebase');
              } else {
                core.setOutput('command', 'squash');
              }
            } catch (error) {
              core.setFailed(`Error determining command: ${error.message}`);
            }
        env:
          COMMENT_BODY: ${{ inputs.comment_body }}

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_BOT_PAT || secrets.ARI_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ steps.pr_data.outputs.head_ref }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Squash / Rebase
        id: squash_rebase
        continue-on-error: true
        env:
          COMMAND: ${{ steps.command.outputs.command }}
          PR_TITLE: ${{ steps.pr_data.outputs.pr_title }}
          PR_BODY: ${{ steps.pr_data.outputs.pr_body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          COMMIT_MSG_FILE=$(mktemp)
          printf "%s" "$PR_TITLE" > "$COMMIT_MSG_FILE"
          printf "\n\n" >> "$COMMIT_MSG_FILE"
          printf "%s" "$PR_BODY" >> "$COMMIT_MSG_FILE"

          BASE_BRANCH="${{ steps.pr_data.outputs.base_ref }}"
          HEAD_BRANCH="${{ steps.pr_data.outputs.head_ref }}"

          git fetch origin $BASE_BRANCH

          MERGE_BASE=$(git merge-base HEAD "origin/$BASE_BRANCH")

          git reset --soft $MERGE_BASE

          git commit -F "$COMMIT_MSG_FILE"

          if [ "$COMMAND" = "squash-rebase" ]; then
            echo "Rebasing onto base branch..."
            if ! git rebase "origin/$BASE_BRANCH"; then
              echo "::error::Automatic rebase failed. The PR has conflicts with the base branch. Please rebase manually."
              exit 1
            fi
          else
            echo "Skipping rebase."
          fi

          git push --force-with-lease origin $HEAD_BRANCH
          echo "squashed_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "base_sha=$(git rev-parse origin/$BASE_BRANCH)" >> $GITHUB_OUTPUT

      - name: Handle Rebase Failure
        if: steps.squash_rebase.outcome == 'failure'
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ inputs.comment_id }},
              content: 'confused'
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body: '❌ Automatic squash and rebase failed. The branch has conflicts with `${{ steps.pr_data.outputs.base_ref }}`. Please resolve the conflicts manually and try again.'
            });

      - name: Success
        if: steps.squash_rebase.outcome == 'success'
        uses: actions/github-script@v6
        with:
          script: |
            const command = '${{ steps.command.outputs.command }}';
            let messageBody;

            if (command === 'squash-rebase') {
              messageBody = '✅ Commits squashed and rebased successfully!';
            } else {
              messageBody = '✅ Commits squashed successfully!';
            }

            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ inputs.comment_id }},
              content: 'hooray'
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body: messageBody
            });

  check-for-changes-after-squash:
    needs: squash-and-rebase
    if: needs.squash-and-rebase.outputs.outcome == 'success'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check_changes.outputs.has_changes }}
    steps:
      - name: Install jq
        run: |
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_BOT_PAT || secrets.ARI_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ needs.squash-and-rebase.outputs.head_ref }}
          fetch-depth: 0
      - name: Check for file changes
        id: check_changes
        uses: ./.github/actions/check-for-changes
        with:
          base_branch: ${{ needs.squash-and-rebase.outputs.base_ref }}

  trigger-ci-workflow:
    needs: [squash-and-rebase]
    if: needs.squash-and-rebase.outputs.outcome == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: |
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
      - name: Trigger Gemini Orchestrator
        env:
          # Use CI_BOT_PAT if available to ensure workflow is triggered (GITHUB_TOKEN prevents recursion)
          GH_TOKEN: ${{ secrets.CI_BOT_PAT || secrets.ARI_PAT || secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ needs.squash-and-rebase.outputs.head_ref }}
          BASE_BRANCH: ${{ needs.squash-and-rebase.outputs.base_ref }}
          BASE_SHA: ${{ needs.squash-and-rebase.outputs.base_sha }}
          HEAD_SHA: ${{ needs.squash-and-rebase.outputs.squashed_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          gh workflow run "Gemini Orchestrator" --ref "$HEAD_BRANCH" -f pr_number="$PR_NUMBER" -f base_ref="$BASE_SHA" -f head_ref="$HEAD_SHA" -f base_branch="$BASE_BRANCH"
