name: PR Squash and Rebase

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'The PR number to squash'
        required: true
      comment_body:
        description: 'The body of the comment that triggered the squash'
        required: true
      comment_id:
        description: 'The ID of the comment that triggered the squash'
        required: true
  workflow_call:
    inputs:
      pr_number:
        description: 'The PR number to squash'
        required: true
        type: string
      comment_body:
        description: 'The body of the comment that triggered the squash'
        required: true
        type: string
      comment_id:
        description: 'The ID of the comment that triggered the squash'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  actions: read

jobs:
  squash-and-rebase:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.squash_rebase.outcome }}
      head_ref: ${{ steps.pr_data.outputs.head_ref }}
      base_ref: ${{ steps.pr_data.outputs.base_ref }}
      squashed_sha: ${{ steps.squash_rebase.outputs.squashed_sha }}
      base_sha: ${{ steps.squash_rebase.outputs.base_sha }}
      should_run: ${{ steps.validate.outputs.should_run }}
    steps:
      - name: Validate Context
        id: validate
        env:
          PR_NUMBER_RAW: ${{ (inputs.pr_number && inputs.pr_number != '0' && inputs.pr_number) || (github.event.pull_request && github.event.pull_request.number) || (github.event.issue && github.event.issue.number) || 0 }}
        run: |
          if [ "$PR_NUMBER_RAW" == "0" ] || [ -z "$PR_NUMBER_RAW" ]; then
            echo "::warning::Could not determine PR number. Skipping job."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Acknowledge command
        if: steps.validate.outputs.should_run == 'true' && ((github.event.comment && github.event.comment.id && github.event.comment.id != 0) || (inputs.comment_id && inputs.comment_id != '0' && inputs.comment_id != 0))
        uses: peter-evans/create-reaction@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-id: ${{ (github.event.comment && github.event.comment.id) || inputs.comment_id || 0 }}
          reaction: rocket

      - name: Get PR data
        if: steps.validate.outputs.should_run == 'true'
        id: pr_data
        uses: actions/github-script@v7
        env:
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
        with:
          script: |
            let prNumber = Number(process.env.PR_NUMBER_INPUT) || (context.payload.pull_request && context.payload.pull_request.number) || (context.payload.issue && context.payload.issue.number) || 0;

            if (!prNumber || prNumber === 0) {
              core.setFailed('Could not determine PR number even after validation.');
              return;
            }

            const response = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('head_ref', response.data.head.ref);
            core.setOutput('base_ref', response.data.base.ref);
            core.setOutput('pr_title', response.data.title);
            core.setOutput('pr_body', response.data.body);

      - name: Determine command
        if: steps.validate.outputs.should_run == 'true'
        id: command
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const commentBody = process.env.COMMENT_BODY || '';
              if (commentBody.includes('@pr-squash-rebase')) {
                core.setOutput('command', 'squash-rebase');
              } else {
                core.setOutput('command', 'squash');
              }
            } catch (error) {
              core.setFailed(`Error determining command: ${error.message}`);
            }
        env:
          COMMENT_BODY: ${{ inputs.comment_body }}

      - name: Checkout PR branch
        if: steps.validate.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          # Using the default GITHUB_TOKEN. For this to work on protected branches,
          # the repository settings may need to be adjusted to allow the github-actions bot to push.
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ steps.pr_data.outputs.head_ref }}
          fetch-depth: 0

      - name: Configure Git
        if: steps.validate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Squash / Rebase
        if: steps.validate.outputs.should_run == 'true'
        id: squash_rebase
        continue-on-error: true
        env:
          COMMAND: ${{ steps.command.outputs.command }}
          PR_TITLE: ${{ steps.pr_data.outputs.pr_title }}
          PR_BODY: ${{ steps.pr_data.outputs.pr_body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          COMMIT_MSG_FILE=$(mktemp)
          printf "%s" "$PR_TITLE" > "$COMMIT_MSG_FILE"
          printf "\n\n" >> "$COMMIT_MSG_FILE"
          printf "%s" "$PR_BODY" >> "$COMMIT_MSG_FILE"

          BASE_BRANCH="${{ steps.pr_data.outputs.base_ref }}"
          HEAD_BRANCH="${{ steps.pr_data.outputs.head_ref }}"

          git fetch origin $BASE_BRANCH

          MERGE_BASE=$(git merge-base HEAD "origin/$BASE_BRANCH")

          git reset --soft $MERGE_BASE

          git commit -F "$COMMIT_MSG_FILE"

          if [ "$COMMAND" = "squash-rebase" ]; then
            echo "Rebasing onto base branch..."
            if ! git rebase "origin/$BASE_BRANCH"; then
              echo "::error::Automatic rebase failed. The PR has conflicts with the base branch. Please rebase manually."
              exit 1
            fi
          else
            echo "Skipping rebase."
          fi

          git push --force-with-lease origin $HEAD_BRANCH
          echo "squashed_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "base_sha=$(git rev-parse origin/$BASE_BRANCH)" >> $GITHUB_OUTPUT

      - name: Handle Rebase Failure
        if: steps.validate.outputs.should_run == 'true' && steps.squash_rebase.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          COMMENT_ID_INPUT: ${{ inputs.comment_id }}
          BASE_REF: ${{ steps.pr_data.outputs.base_ref }}
        with:
          script: |
            let prNumber = Number(process.env.PR_NUMBER_INPUT) || (context.payload.pull_request && context.payload.pull_request.number) || (context.payload.issue && context.payload.issue.number) || 0;
            let commentId = Number(process.env.COMMENT_ID_INPUT) || (context.payload.comment && context.payload.comment.id) || 0;
            const baseRef = process.env.BASE_REF;

            if (commentId && commentId !== 0) {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                content: 'confused'
              });
            }

            if (prNumber && prNumber !== 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `❌ Automatic squash and rebase failed. The branch has conflicts with \`${baseRef}\`. Please resolve the conflicts manually and try again.`
              });
            }

      - name: Success
        if: steps.validate.outputs.should_run == 'true' && steps.squash_rebase.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          COMMENT_ID_INPUT: ${{ inputs.comment_id }}
          COMMAND: ${{ steps.command.outputs.command }}
        with:
          script: |
            let prNumber = Number(process.env.PR_NUMBER_INPUT) || (context.payload.pull_request && context.payload.pull_request.number) || (context.payload.issue && context.payload.issue.number) || 0;
            let commentId = Number(process.env.COMMENT_ID_INPUT) || (context.payload.comment && context.payload.comment.id) || 0;

            const command = process.env.COMMAND;
            let messageBody;

            if (command === 'squash-rebase') {
              messageBody = '✅ Commits squashed and rebased successfully!';
            } else {
              messageBody = '✅ Commits squashed successfully!';
            }

            if (commentId && commentId !== 0) {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                content: 'hooray'
              });
            }

            if (prNumber && prNumber !== 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: messageBody
              });
            }

  check-for-changes-after-squash:
    needs: squash-and-rebase
    if: needs.squash-and-rebase.outputs.should_run == 'true' && needs.squash-and-rebase.outputs.outcome == 'success'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check_changes.outputs.has_changes }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.squash-and-rebase.outputs.head_ref }}
          fetch-depth: 2
      - name: Check for file changes
        id: check_changes
        uses: ./.github/actions/check-for-changes
        with:
          base_branch: ${{ needs.squash-and-rebase.outputs.base_ref }}

  trigger-ci-workflow:
    needs: [squash-and-rebase]
    if: needs.squash-and-rebase.outputs.should_run == 'true' && needs.squash-and-rebase.outputs.outcome == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Gemini Orchestrator
        env:
          # Use CI_BOT_PAT if available to ensure workflow is triggered (GITHUB_TOKEN prevents recursion)
          GH_TOKEN: ${{ secrets.CI_BOT_PAT || secrets.ARI_PAT || secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ needs.squash-and-rebase.outputs.head_ref }}
          BASE_BRANCH: ${{ needs.squash-and-rebase.outputs.base_ref }}
          BASE_SHA: ${{ needs.squash-and-rebase.outputs.base_sha }}
          HEAD_SHA: ${{ needs.squash-and-rebase.outputs.squashed_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "0" ]; then
            gh workflow run "Gemini Orchestrator" --ref "$HEAD_BRANCH" -f pr_number="$PR_NUMBER" -f base_ref="$BASE_SHA" -f head_ref="$HEAD_SHA" -f base_branch="$BASE_BRANCH"
          else
            gh workflow run "Gemini Orchestrator" --ref "$HEAD_BRANCH" -f base_ref="$BASE_SHA" -f head_ref="$HEAD_SHA" -f base_branch="$BASE_BRANCH"
          fi
