name: PR Squash and Rebase

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  squash-and-rebase:
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@pr-squash')
    steps:
      - name: Acknowledge command
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ github.event.comment.id }},
              content: 'rocket'
            });

      - name: Get PR data
        id: pr_data
        uses: actions/github-script@v6
        with:
          script: |
            const response = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ github.event.issue.number }}
            });
            core.setOutput('head_ref', response.data.head.ref);
            core.setOutput('base_ref', response.data.base.ref);
            core.setOutput('pr_title', response.data.title);
            core.setOutput('pr_body', response.data.body);

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          # A PAT is required to allow the action to push to protected branches and trigger CI
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ steps.pr_data.outputs.head_ref }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Squash and Rebase
        id: squash_rebase
        continue-on-error: true
        env:
          PR_TITLE: ${{ steps.pr_data.outputs.pr_title }}
          PR_BODY: ${{ steps.pr_data.outputs.pr_body }}
        run: |
          set -e

          COMMIT_MSG_FILE=$(mktemp)
          printf "%s" "$PR_TITLE" > "$COMMIT_MSG_FILE"
          printf "\n\n" >> "$COMMIT_MSG_FILE"
          printf "%s" "$PR_BODY" >> "$COMMIT_MSG_FILE"

          BASE_BRANCH="${{ steps.pr_data.outputs.base_ref }}"
          HEAD_BRANCH="${{ steps.pr_data.outputs.head_ref }}"

          git fetch origin $BASE_BRANCH

          MERGE_BASE=$(git merge-base HEAD "origin/$BASE_BRANCH")

          git reset --soft $MERGE_BASE

          git commit -F "$COMMIT_MSG_FILE"

          if ! git rebase "origin/$BASE_BRANCH"; then
            echo "::error::Automatic rebase failed. The PR has conflicts with the base branch. Please rebase manually."
            exit 1
          fi

          git push --force-with-lease origin $HEAD_BRANCH

      - name: Handle Rebase Failure
        if: steps.squash_rebase.outcome == 'failure'
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ github.event.comment.id }},
              content: 'confused'
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.issue.number }},
              body: '❌ Automatic squash and rebase failed. The branch has conflicts with `${{ steps.pr_data.outputs.base_ref }}`. Please resolve the conflicts manually and try again.'
            });

      - name: Success
        if: steps.squash_rebase.outcome == 'success'
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ github.event.comment.id }},
              content: 'hooray'
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.issue.number }},
              body: '✅ Commits squashed and rebased successfully!'
            });
