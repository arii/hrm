name: Auto Fix Linting

on:
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.tsx'

jobs:
  fix-lint:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 'Setup Environment'
        id: setup
        uses: ./.github/actions/setup-env
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
        continue-on-error: true

      - name: Install GitHub CLI
        run: |
          type -p gh >/dev/null || (curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null && sudo apt update && sudo apt install gh -y)

      - name: Comment on Install Failure
        if: steps.setup.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.ARI_PAT }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "## 🚨 Auto-Fix Failed
          The \`pnpm install --frozen-lockfile\` command failed. This likely means your \`pnpm-lock.yaml\` file is out of sync with your \`package.json\`.
          **Action Required:** Please run \`pnpm install\` locally on your branch, commit the updated \`pnpm-lock.yaml\` file, and push the changes."
          exit 1

      - name: Run Intelligent Fixes
        run: |
          pnpm run format
          pnpm run lint -- --fix

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'style: auto-fix linting and formatting issues'
          file_pattern: '**/*.ts **/*.tsx'
