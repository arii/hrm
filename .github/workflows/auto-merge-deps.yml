name: Auto-merge Dependencies

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    permissions:
      pull-requests: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Validate Context
        id: validate
        env:
          PR_URL: ${{ (github.event.pull_request && github.event.pull_request.html_url) || '' }}
        run: |
          if [ -z "$PR_URL" ]; then
            echo "::warning::Missing PR URL. Skipping auto-merge."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Check PR Labels
        if: steps.validate.outputs.should_run == 'true'
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return false;
            const labels = pr.labels.map(l => l.name);
            return labels.includes('automerge');

      - name: Auto-approve
        if: steps.validate.outputs.should_run == 'true' && steps.check.outputs.result == 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ (github.event.pull_request && github.event.pull_request.html_url) || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Auto-merge
        if: steps.validate.outputs.should_run == 'true' && steps.check.outputs.result == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ (github.event.pull_request && github.event.pull_request.html_url) || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
