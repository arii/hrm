name: Validate Dependency PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-files:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.title, 'deps')
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Validate Dependency PR
      run: |
        BASE_SHA="${{ github.event.pull_request.base.sha }}"
        HEAD_SHA="${{ github.sha }}"

        # Check for package.json changes
        git diff --name-only "${BASE_SHA}".."${HEAD_SHA}" | grep -q package.json || {
          echo "ERROR: Dependency PR missing package.json changes. Please ensure package.json is updated and included in your PR. Refer to DEVELOPMENT.md and use the dependency.md PR template for guidance." >&2
          exit 1
        }

        # Check for lock file changes
        git diff --name-only "${BASE_SHA}".."${HEAD_SHA}" | grep -q pnpm-lock.yaml || {
          echo "ERROR: Dependency PR missing pnpm-lock.yaml changes. Please ensure pnpm-lock.yaml is updated and included in your PR. Refer to DEVELOPMENT.md and use the dependency.md PR template for guidance." >&2
          exit 1
        }
