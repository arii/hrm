name: 'E2E CI Tests'

on:
  push:
    paths:
      - '.github/**'

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # GH_TOKEN is used for GitHub CLI commands.
  # Priority: CI_BOT_PAT (automated), ARI_PAT (legacy/user), GITHUB_TOKEN (fallback).
  # A PAT is required to trigger downstream workflows (e.g., PR squash orchestrator).
  # DEPRECATION: secrets.ARI_PAT is legacy. Future updates should use secrets.CI_BOT_PAT.
  GH_TOKEN: ${{ secrets.CI_BOT_PAT || secrets.ARI_PAT || secrets.GITHUB_TOKEN }}

jobs:
  test_pr_squash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Create Test Branch and PR
        id: create_pr
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="e2e-test-$(date +%s)"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

          git checkout -b "$BRANCH_NAME"
          echo "test content $(date)" > test-file.txt
          git add test-file.txt
          git commit -m "E2E Test Commit 1"
          echo "another line" >> test-file.txt
          git add test-file.txt
          git commit -m "E2E Test Commit 2"
          git push origin "$BRANCH_NAME"

          PR_URL=$(gh pr create --base leader --head "$BRANCH_NAME" --fill)
          PR_NUMBER=${PR_URL##*/}
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Trigger PR Squash and Wait
        timeout-minutes: 15
        run: |
          gh pr comment "$PR_NUMBER" --body "@pr-squash"
          sleep 10
          timeout 300 gh pr checks "$PR_NUMBER" --watch

      - name: Verify Squash
        run: |
          git fetch origin "$BRANCH_NAME"
          git checkout "$BRANCH_NAME"
          COMMIT_COUNT=$(git rev-list --count HEAD ^origin/leader)
          [ "$COMMIT_COUNT" -eq 1 ] || { echo "Squash failed: $COMMIT_COUNT commits"; exit 1; }

      - name: Cleanup
        if: always()
        run: |
          [ -n "$PR_NUMBER" ] && gh pr close "$PR_NUMBER" --delete-branch || true

  test_conflict_resolver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Create Conflict
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          ID=${{ github.run_id }}
          BASE="base-$ID"
          HEAD="head-$ID"

          echo "BASE_BRANCH=$BASE" >> $GITHUB_ENV
          echo "HEAD_BRANCH=$HEAD" >> $GITHUB_ENV

          git checkout -b "$BASE"
          echo "initial" > conflict.txt
          git add conflict.txt && git commit -m "base" && git push origin "$BASE"

          git checkout -b "$HEAD"
          echo "head-change" > conflict.txt
          git add conflict.txt && git commit -m "head change" && git push origin "$HEAD"

          git checkout "$BASE"
          echo "base-conflict" > conflict.txt
          git add conflict.txt && git commit -m "base conflict" && git push origin "$BASE"

          PR_URL=$(gh pr create --base "$BASE" --head "$HEAD" --fill)
          echo "PR_NUMBER=${PR_URL##*/}" >> $GITHUB_ENV

      - name: Trigger Conflict Resolver
        run: |
          gh pr comment "$PR_NUMBER" --body "@conflict-resolve"
          sleep 10
          timeout 300 gh pr checks "$PR_NUMBER" --watch

      - name: Cleanup
        if: always()
        run: |
          [ -n "$PR_NUMBER" ] && gh pr close "$PR_NUMBER" || true
          git push origin --delete "$BASE_BRANCH" "$HEAD_BRANCH" || true

  test_pr_squash_rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Create Test Branch and PR
        id: create_pr
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="e2e-test-rebase-$(date +%s)"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

          git checkout -b "$BRANCH_NAME"
          echo "test content" > test-file-rebase.txt
          git add test-file-rebase.txt
          git commit -m "E2E Test Commit 1 (rebase)"
          echo "another line" >> test-file-rebase.txt
          git add test-file-rebase.txt
          git commit -m "E2E Test Commit 2 (rebase)"
          git push origin "$BRANCH_NAME"

          PR_URL=$(gh pr create --base leader --head "$BRANCH_NAME" --fill)
          PR_NUMBER=${PR_URL##*/}
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Trigger PR Squash and Rebase and Wait
        timeout-minutes: 15
        run: |
          set -e
          gh pr comment "$PR_NUMBER" --body "@pr-squash-rebase"
          echo "Waiting for squash and rebase to complete..."
          sleep 10
          timeout 300 gh pr checks "$PR_NUMBER" --watch

      - name: Verify Squash and Rebase
        run: |
          set -e
          git fetch origin "$BRANCH_NAME"
          git checkout "$BRANCH_NAME"
          COMMIT_COUNT=$(git rev-list --count HEAD ^origin/leader)
          if [ "$COMMIT_COUNT" -eq 1 ]; then
            echo "✅ Squash and rebase successful: Branch has 1 commit."
          else
            echo "❌ Squash and rebase failed: Branch has $COMMIT_COUNT commits instead of 1."
            exit 1
          fi
          # Verify that the branch is rebased on top of leader
          if git merge-base --is-ancestor origin/leader HEAD; then
            echo "✅ Branch is rebased on top of leader."
          else
            echo "❌ Branch is not rebased on top of leader."
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          set -e
          [ -n "$PR_NUMBER" ] && gh pr close "$PR_NUMBER" --delete-branch || true
