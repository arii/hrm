name: 'E2E CI Tests'

on:
  push:
    paths:
      - '.github/**'

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  test_pr_squash:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CI_BOT_PAT || secrets.ARI_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - name: Install jq
        run: |
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Create Test Branch and PR
        id: create_pr
        run: |
          set -e
          echo "Token Owner: $(gh api user --jq '.login' || echo 'Unknown (probably GITHUB_TOKEN)')"
          BRANCH_NAME="e2e-test-$(date +%s)"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          git checkout -b $BRANCH_NAME
          echo "test content" > test-file.txt
          git add test-file.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "E2E Test Commit 1"
          echo "another line" >> test-file.txt
          git add test-file.txt
          git commit -m "E2E Test Commit 2"
          git push origin $BRANCH_NAME
          PR_URL=$(gh pr create --title "E2E Test PR" --body "Test PR for E2E testing" --base leader --head $BRANCH_NAME)
          PR_NUMBER=$(echo "$PR_URL" | grep -oE "/pull/[0-9]+" | head -n 1 | cut -d'/' -f3)
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT

      - name: Trigger PR Squash and Wait
        timeout-minutes: 20
        env:
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          set -e
          # 1. Establish initial SHA
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          INITIAL_SHA=$(git ls-remote "$REPO" "refs/heads/$BRANCH_NAME" | awk '{print $1}')
          echo "Initial SHA: $INITIAL_SHA"

          # 2. Trigger bot
          echo "Triggering bot with @pr-squash comment..."
          gh pr comment $PR_NUMBER --body "@pr-squash"
          echo "Waiting for squash and rebase to complete..."

          # 3. Wait for SHA to change or success comment
          MAX_RETRIES=60
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            CURRENT_SHA=$(git ls-remote "$REPO" "refs/heads/$BRANCH_NAME" | awk '{print $1}')
            if [ -n "$CURRENT_SHA" ] && [ "$CURRENT_SHA" != "$INITIAL_SHA" ]; then
              echo "✅ Bot has pushed changes (New SHA: $CURRENT_SHA)"
              break
            fi

            # Fallback: check for the bot's success comment
            if gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body' | grep -qi "successfully"; then
              echo "✅ Bot has commented success. Proceeding to watch checks."
              CURRENT_SHA=$(git ls-remote "$REPO" "refs/heads/$BRANCH_NAME" | awk '{print $1}')
              break
            fi

            echo "Waiting for SHA change or success comment... ($RETRY_COUNT/$MAX_RETRIES)"
            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep 15
          done

          if [ -z "$CURRENT_SHA" ] || [ "$CURRENT_SHA" == "$INITIAL_SHA" ]; then
            echo "❌ Bot failed to push changes or comment success within timeout."
            exit 1
          fi

          # 4. Wait for checks to appear for the new commit.
          # We add a mandatory 15s delay to allow GitHub's eventually consistent API to index the new push.
          echo "Waiting 15s for GitHub API to index the new commit..."
          sleep 15
          echo "Waiting for checks to appear for SHA $CURRENT_SHA..."
          MAX_CHECK_RETRIES=60
          CHECK_RETRY=0
          while [ $CHECK_RETRY -lt $MAX_CHECK_RETRIES ]; do
            # Filter checks by name to avoid being confused by older runs
            if gh pr checks "$PR_NUMBER" | grep -v "no checks reported" | grep -qiE "pending|pass|fail|progressing|waiting|success|failure"; then
              echo "✅ Checks have been registered."
              break
            fi
            echo "Still waiting for checks to be indexed... ($CHECK_RETRY/$MAX_CHECK_RETRIES)"
            CHECK_RETRY=$((CHECK_RETRY + 1))
            sleep 10
          done

          timeout 900 gh pr checks $PR_NUMBER --watch

      - name: Verify Squash
        env:
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          set -e
          git fetch origin $BRANCH_NAME
          git checkout $BRANCH_NAME
          COMMIT_COUNT=$(git rev-list --count HEAD ^origin/leader)
          if [ "$COMMIT_COUNT" -eq 1 ]; then
            echo "✅ Squash successful: Branch has 1 commit."
          else
            echo "❌ Squash failed: Branch has $COMMIT_COUNT commits instead of 1."
            exit 1
          fi

      - name: Cleanup
        if: always()
        env:
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          set -e
          echo "Cleaning up PR and branch..."
          gh pr close $PR_NUMBER
          git push origin --delete $BRANCH_NAME

  test_conflict_resolver:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CI_BOT_PAT || secrets.ARI_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - name: Install jq
        run: |
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Create Conflict
        id: create_conflict
        run: |
          set -e
          echo "Token Owner: $(gh api user --jq '.login' || echo 'Unknown (probably GITHUB_TOKEN)')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Use a unique identifier for branch names to avoid concurrency issues
          UNIQUE_ID=${{ github.run_id }}
          BRANCH_A="branch-a-$UNIQUE_ID"
          BRANCH_B="branch-b-$UNIQUE_ID"
          BASE_BRANCH="base-branch-$UNIQUE_ID"

          echo "BRANCH_A=$BRANCH_A" >> $GITHUB_ENV
          echo "BRANCH_B=$BRANCH_B" >> $GITHUB_ENV
          echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_ENV

          # Create a base commit with a file
          git checkout -b $BASE_BRANCH
          echo "initial content" > conflict-file.txt
          git add conflict-file.txt
          git commit -m "Create conflict-file.txt"
          git push origin $BASE_BRANCH

          # Create branch A with a modification
          git checkout -b $BRANCH_A
          echo "branch-a content" > conflict-file.txt
          git add conflict-file.txt
          git commit -m "Modify conflict-file.txt in branch-a"
          git push origin $BRANCH_A

          # Create branch B from the base, with a conflicting modification
          git checkout $BASE_BRANCH
          git checkout -b $BRANCH_B
          echo "branch-b content" > conflict-file.txt
          git add conflict-file.txt
          git commit -m "Modify conflict-file.txt in branch-b"
          git push origin $BRANCH_B

          # Create a pull request to trigger the conflict resolver
          PR_URL=$(gh pr create --title "E2E Test PR with Conflict" --body "Test PR for conflict resolver" --base $BRANCH_A --head $BRANCH_B)
          PR_NUMBER=$(echo "$PR_URL" | grep -oE "/pull/[0-9]+" | head -n 1 | cut -d'/' -f3)
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT

      - name: Trigger Conflict Resolver and Wait
        timeout-minutes: 20
        env:
          PR_NUMBER: ${{ steps.create_conflict.outputs.pr_number }}
          BRANCH_B: ${{ env.BRANCH_B }}
        run: |
          set -e
          # 1. Establish initial SHA
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          INITIAL_SHA=$(git ls-remote "$REPO" "refs/heads/$BRANCH_B" | awk '{print $1}')
          echo "Initial SHA: $INITIAL_SHA"

          # 2. Trigger bot
          echo "Triggering bot with @conflict-resolve comment..."
          gh pr comment $PR_NUMBER --body "@conflict-resolve"
          echo "Waiting for conflict resolver to complete..."

          # 3. Wait for SHA to change or success comment
          MAX_RETRIES=60
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            CURRENT_SHA=$(git ls-remote "$REPO" "refs/heads/$BRANCH_B" | awk '{print $1}')
            if [ -n "$CURRENT_SHA" ] && [ "$CURRENT_SHA" != "$INITIAL_SHA" ]; then
              echo "✅ Bot has pushed changes (New SHA: $CURRENT_SHA)"
              break
            fi

            # Fallback: check for the bot's success comment
            if gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body' | grep -qi "Successfully resolved all conflicts"; then
              echo "✅ Bot has commented success. Proceeding to watch checks."
              CURRENT_SHA=$(git ls-remote "$REPO" "refs/heads/$BRANCH_B" | awk '{print $1}')
              break
            fi

            echo "Waiting for SHA change or success comment... ($RETRY_COUNT/$MAX_RETRIES)"
            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep 15
          done

          if [ -z "$CURRENT_SHA" ] || [ "$CURRENT_SHA" == "$INITIAL_SHA" ]; then
            echo "❌ Bot failed to push changes or comment success within timeout."
            exit 1
          fi

          # 4. Wait for checks to appear for the new commit
          echo "Waiting 15s for GitHub API to index the new commit..."
          sleep 15
          echo "Waiting for checks to appear for SHA $CURRENT_SHA..."
          MAX_CHECK_RETRIES=60
          CHECK_RETRY=0
          while [ $CHECK_RETRY -lt $MAX_CHECK_RETRIES ]; do
            if gh pr checks "$PR_NUMBER" | grep -v "no checks reported" | grep -qiE "pending|pass|fail|progressing|waiting|success|failure"; then
              echo "✅ Checks have been registered."
              break
            fi
            echo "Still waiting for checks to be indexed... ($CHECK_RETRY/$MAX_CHECK_RETRIES)"
            CHECK_RETRY=$((CHECK_RETRY + 1))
            sleep 10
          done

          timeout 900 gh pr checks $PR_NUMBER --watch

      - name: Verify Conflict Resolution
        run: |
          set -e
          git fetch origin $BRANCH_B
          git checkout $BRANCH_B
          # Check if the conflict is resolved by verifying the content
          # The bot merges BRANCH_A into BRANCH_B.
          # BRANCH_B already had "branch-b content".
          # We want to make sure the merge happened and the file is still correct (or contains both if it was a smart merge,
          # but our bot usually accepts --ours or --theirs based on config).
          # In this test, we just want to see it didn't fail.
          if grep -q "branch-b content" conflict-file.txt; then
            echo "✅ Conflict resolved: conflict-file.txt has the correct content."
          else
            echo "❌ Conflict resolution failed: conflict-file.txt has incorrect content."
            exit 1
          fi

      - name: Cleanup
        if: always()
        env:
          PR_NUMBER: ${{ steps.create_conflict.outputs.pr_number }}
        run: |
          set -e
          echo "Cleaning up PR and branches..."
          gh pr close $PR_NUMBER
          git push origin --delete $BRANCH_A
          git push origin --delete $BRANCH_B
          git push origin --delete $BASE_BRANCH

  test_pr_squash_rebase:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CI_BOT_PAT || secrets.ARI_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - name: Install jq
        run: |
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Create Test Branch and PR
        id: create_pr
        run: |
          set -e
          BRANCH_NAME="e2e-test-rebase-$(date +%s)"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          git checkout -b $BRANCH_NAME
          echo "test content" > test-file-rebase.txt
          git add test-file-rebase.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "E2E Test Commit 1 (rebase)"
          echo "another line" >> test-file-rebase.txt
          git add test-file-rebase.txt
          git commit -m "E2E Test Commit 2 (rebase)"
          git push origin $BRANCH_NAME
          PR_URL=$(gh pr create --title "E2E Test PR (rebase)" --body "Test PR for E2E testing (rebase)" --base leader --head $BRANCH_NAME)
          PR_NUMBER=$(echo "$PR_URL" | grep -oE "/pull/[0-9]+" | head -n 1 | cut -d'/' -f3)
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT

      - name: Trigger PR Squash and Rebase and Wait
        timeout-minutes: 20
        env:
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          set -e
          # 1. Establish initial SHA
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          INITIAL_SHA=$(git ls-remote "$REPO" "refs/heads/$BRANCH_NAME" | awk '{print $1}')
          echo "Initial SHA: $INITIAL_SHA"

          # 2. Trigger bot
          echo "Triggering bot with @pr-squash-rebase comment..."
          gh pr comment $PR_NUMBER --body "@pr-squash-rebase"
          echo "Waiting for squash and rebase to complete..."

          # 3. Wait for SHA to change or success comment
          MAX_RETRIES=60
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            CURRENT_SHA=$(git ls-remote "$REPO" "refs/heads/$BRANCH_NAME" | awk '{print $1}')
            if [ -n "$CURRENT_SHA" ] && [ "$CURRENT_SHA" != "$INITIAL_SHA" ]; then
              echo "✅ Bot has pushed changes (New SHA: $CURRENT_SHA)"
              break
            fi

            # Fallback: check for the bot's success comment
            if gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body' | grep -qi "successfully"; then
              echo "✅ Bot has commented success. Proceeding to watch checks."
              CURRENT_SHA=$(git ls-remote "$REPO" "refs/heads/$BRANCH_NAME" | awk '{print $1}')
              break
            fi

            echo "Waiting for SHA change or success comment... ($RETRY_COUNT/$MAX_RETRIES)"
            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep 15
          done

          if [ -z "$CURRENT_SHA" ] || [ "$CURRENT_SHA" == "$INITIAL_SHA" ]; then
            echo "❌ Bot failed to push changes or comment success within timeout."
            exit 1
          fi

          # 4. Wait for checks to appear for the new commit
          echo "Waiting 15s for GitHub API to index the new commit..."
          sleep 15
          echo "Waiting for checks to appear for SHA $CURRENT_SHA..."
          MAX_CHECK_RETRIES=60
          CHECK_RETRY=0
          while [ $CHECK_RETRY -lt $MAX_CHECK_RETRIES ]; do
            if gh pr checks "$PR_NUMBER" | grep -v "no checks reported" | grep -qiE "pending|pass|fail|progressing|waiting|success|failure"; then
              echo "✅ Checks have been registered."
              break
            fi
            echo "Still waiting for checks to be indexed... ($CHECK_RETRY/$MAX_CHECK_RETRIES)"
            CHECK_RETRY=$((CHECK_RETRY + 1))
            sleep 10
          done

          timeout 900 gh pr checks $PR_NUMBER --watch

      - name: Verify Squash and Rebase
        env:
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          set -e
          git fetch origin $BRANCH_NAME
          git checkout $BRANCH_NAME
          COMMIT_COUNT=$(git rev-list --count HEAD ^origin/leader)
          if [ "$COMMIT_COUNT" -eq 1 ]; then
            echo "✅ Squash and rebase successful: Branch has 1 commit."
          else
            echo "❌ Squash and rebase failed: Branch has $COMMIT_COUNT commits instead of 1."
            exit 1
          fi
          # Verify that the branch is rebased on top of leader
          if git merge-base --is-ancestor origin/leader HEAD; then
            echo "✅ Branch is rebased on top of leader."
          else
            echo "❌ Branch is not rebased on top of leader."
            exit 1
          fi

      - name: Cleanup
        if: always()
        env:
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          set -e
          echo "Cleaning up PR and branch..."
          gh pr close $PR_NUMBER
          git push origin --delete $BRANCH_NAME
