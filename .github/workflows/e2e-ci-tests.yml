name: 'E2E CI Tests'

on:
  push:
    paths:
      - '.github/**'

jobs:
  test_pr_squash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Create Test Branch
        run: |
          set -e
          BRANCH_NAME="e2e-test-$(date +%s)"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          git checkout -b $BRANCH_NAME
          echo "test content" > test-file.txt
          git add test-file.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "E2E Test Commit 1"
          echo "another line" >> test-file.txt
          git add test-file.txt
          git commit -m "E2E Test Commit 2"
          git push origin $BRANCH_NAME

      - name: Create PR
        id: create_pr
        uses: ./.github/actions/gh-pr-create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          title: 'E2E Test PR'
          body: 'Test PR for E2E testing'
          base: leader
          head: ${{ env.BRANCH_NAME }}

      - name: Get Initial SHA
        id: get_sha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(gh pr view ${{ steps.create_pr.outputs.pr_number }} --json headRefOid -q '.headRefOid')
          echo "initial_sha=$SHA" >> $GITHUB_OUTPUT

      - name: Trigger PR Squash
        uses: ./.github/actions/gh-pr-comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          pr_number: ${{ steps.create_pr.outputs.pr_number }}
          body: '@pr-squash'

      - name: Wait for PR Update
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INITIAL_SHA: ${{ steps.get_sha.outputs.initial_sha }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
        run: |
          echo "Waiting for PR $PR_NUMBER to be updated by the bot (Initial SHA: $INITIAL_SHA)..."
          for i in {1..40}; do
            CURRENT_SHA=$(gh pr view $PR_NUMBER --json headRefOid -q '.headRefOid')
            if [ "$CURRENT_SHA" != "$INITIAL_SHA" ]; then
              echo "✅ PR updated! New SHA: $CURRENT_SHA"
              exit 0
            fi
            echo "Still waiting for update... ($i/40)"
            sleep 15
          done
          echo "❌ Timed out waiting for PR update."
          exit 1

      - name: Wait for Checks
        uses: ./.github/actions/gh-pr-wait-checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          pr_number: ${{ steps.create_pr.outputs.pr_number }}
          timeout: 600

      - name: Verify Squash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          set -e
          git fetch origin $BRANCH_NAME
          git checkout $BRANCH_NAME
          COMMIT_COUNT=$(git rev-list --count HEAD ^origin/leader)
          if [ "$COMMIT_COUNT" -eq 1 ]; then
            echo "✅ Squash successful: Branch has 1 commit."
          else
            echo "❌ Squash failed: Branch has $COMMIT_COUNT commits instead of 1."
            exit 1
          fi

      - name: Close PR
        if: always()
        uses: ./.github/actions/gh-pr-close
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          pr_number: ${{ steps.create_pr.outputs.pr_number }}

      - name: Cleanup Branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          set -e
          echo "Cleaning up branch..."
          git push origin --delete $BRANCH_NAME

  test_conflict_resolver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Create Conflict
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Use a unique identifier for branch names to avoid concurrency issues
          UNIQUE_ID=${{ github.run_id }}
          BRANCH_A="branch-a-$UNIQUE_ID"
          BRANCH_B="branch-b-$UNIQUE_ID"
          BASE_BRANCH="base-branch-$UNIQUE_ID"

          echo "BRANCH_A=$BRANCH_A" >> $GITHUB_ENV
          echo "BRANCH_B=$BRANCH_B" >> $GITHUB_ENV
          echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_ENV

          # Create a base commit with a file
          git checkout -b $BASE_BRANCH
          echo "initial content" > conflict-file.txt
          git add conflict-file.txt
          git commit -m "Create conflict-file.txt"
          git push origin $BASE_BRANCH

          # Create branch A with a modification
          git checkout -b $BRANCH_A
          echo "branch-a content" > conflict-file.txt
          git add conflict-file.txt
          git commit -m "Modify conflict-file.txt in branch-a"
          git push origin $BRANCH_A

          # Create branch B from the base, with a conflicting modification
          git checkout $BASE_BRANCH
          git checkout -b $BRANCH_B
          echo "branch-b content" > conflict-file.txt
          git add conflict-file.txt
          git commit -m "Modify conflict-file.txt in branch-b"
          git push origin $BRANCH_B

      - name: Create PR
        id: create_conflict
        uses: ./.github/actions/gh-pr-create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          title: 'E2E Test PR with Conflict'
          body: 'Test PR for conflict resolver'
          base: ${{ env.BRANCH_A }}
          head: ${{ env.BRANCH_B }}

      - name: Get Initial SHA
        id: get_sha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(gh pr view ${{ steps.create_conflict.outputs.pr_number }} --json headRefOid -q '.headRefOid')
          echo "initial_sha=$SHA" >> $GITHUB_OUTPUT

      - name: Trigger Conflict Resolver
        uses: ./.github/actions/gh-pr-comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          pr_number: ${{ steps.create_conflict.outputs.pr_number }}
          body: '@conflict-resolve'

      - name: Wait for PR Update
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INITIAL_SHA: ${{ steps.get_sha.outputs.initial_sha }}
          PR_NUMBER: ${{ steps.create_conflict.outputs.pr_number }}
        run: |
          echo "Waiting for PR $PR_NUMBER to be updated by the bot (Initial SHA: $INITIAL_SHA)..."
          for i in {1..40}; do
            CURRENT_SHA=$(gh pr view $PR_NUMBER --json headRefOid -q '.headRefOid')
            if [ "$CURRENT_SHA" != "$INITIAL_SHA" ]; then
              echo "✅ PR updated! New SHA: $CURRENT_SHA"
              exit 0
            fi
            echo "Still waiting for update... ($i/40)"
            sleep 15
          done
          echo "❌ Timed out waiting for PR update."
          exit 1

      - name: Wait for Checks
        uses: ./.github/actions/gh-pr-wait-checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          pr_number: ${{ steps.create_conflict.outputs.pr_number }}
          timeout: 600

      - name: Verify Conflict Resolution
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch origin $BRANCH_A
          git checkout $BRANCH_A
          # Check if the conflict is resolved by verifying the content
          if grep -q "branch-b content" conflict-file.txt; then
            echo "✅ Conflict resolved: conflict-file.txt has the correct content."
          else
            echo "❌ Conflict resolution failed: conflict-file.txt has incorrect content."
            exit 1
          fi

      - name: Close PR
        if: always()
        uses: ./.github/actions/gh-pr-close
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          pr_number: ${{ steps.create_conflict.outputs.pr_number }}

      - name: Cleanup Branches
        if: always()
        env:
          BRANCH_A: ${{ env.BRANCH_A }}
          BRANCH_B: ${{ env.BRANCH_B }}
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
        run: |
          set -e
          echo "Cleaning up branches..."
          git push origin --delete $BRANCH_A
          git push origin --delete $BRANCH_B
          git push origin --delete $BASE_BRANCH

  test_pr_squash_rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Create Test Branch
        run: |
          set -e
          BRANCH_NAME="e2e-test-rebase-$(date +%s)"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          git checkout -b $BRANCH_NAME
          echo "test content" > test-file-rebase.txt
          git add test-file-rebase.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "E2E Test Commit 1 (rebase)"
          echo "another line" >> test-file-rebase.txt
          git add test-file-rebase.txt
          git commit -m "E2E Test Commit 2 (rebase)"
          git push origin $BRANCH_NAME

      - name: Create PR
        id: create_pr
        uses: ./.github/actions/gh-pr-create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          title: 'E2E Test PR (rebase)'
          body: 'Test PR for E2E testing (rebase)'
          base: leader
          head: ${{ env.BRANCH_NAME }}

      - name: Get Initial SHA
        id: get_sha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(gh pr view ${{ steps.create_pr.outputs.pr_number }} --json headRefOid -q '.headRefOid')
          echo "initial_sha=$SHA" >> $GITHUB_OUTPUT

      - name: Trigger PR Squash and Rebase
        uses: ./.github/actions/gh-pr-comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          pr_number: ${{ steps.create_pr.outputs.pr_number }}
          body: '@pr-squash-rebase'

      - name: Wait for PR Update
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INITIAL_SHA: ${{ steps.get_sha.outputs.initial_sha }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
        run: |
          echo "Waiting for PR $PR_NUMBER to be updated by the bot (Initial SHA: $INITIAL_SHA)..."
          for i in {1..40}; do
            CURRENT_SHA=$(gh pr view $PR_NUMBER --json headRefOid -q '.headRefOid')
            if [ "$CURRENT_SHA" != "$INITIAL_SHA" ]; then
              echo "✅ PR updated! New SHA: $CURRENT_SHA"
              exit 0
            fi
            echo "Still waiting for update... ($i/40)"
            sleep 15
          done
          echo "❌ Timed out waiting for PR update."
          exit 1

      - name: Wait for Checks
        uses: ./.github/actions/gh-pr-wait-checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          pr_number: ${{ steps.create_pr.outputs.pr_number }}
          timeout: 600

      - name: Verify Squash and Rebase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          set -e
          git fetch origin $BRANCH_NAME
          git checkout $BRANCH_NAME
          COMMIT_COUNT=$(git rev-list --count HEAD ^origin/leader)
          if [ "$COMMIT_COUNT" -eq 1 ]; then
            echo "✅ Squash and rebase successful: Branch has 1 commit."
          else
            echo "❌ Squash and rebase failed: Branch has $COMMIT_COUNT commits instead of 1."
            exit 1
          fi
          # Verify that the branch is rebased on top of leader
          if git merge-base --is-ancestor origin/leader HEAD; then
            echo "✅ Branch is rebased on top of leader."
          else
            echo "❌ Branch is not rebased on top of leader."
            exit 1
          fi

      - name: Close PR
        if: always()
        uses: ./.github/actions/gh-pr-close
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          pr_number: ${{ steps.create_pr.outputs.pr_number }}

      - name: Cleanup Branch
        if: always()
        env:
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          set -e
          echo "Cleaning up branch..."
          git push origin --delete $BRANCH_NAME
