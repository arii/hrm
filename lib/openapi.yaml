openapi: 3.0.0
info:
  title: HRM API
  version: 1.0.0
  description: API documentation for the HRM application
paths:
  /api/debug/auth-check:
    get:
      summary: Check auth configuration
      description: Verifies that the Spotify OAuth configuration is loaded correctly.
      responses:
        '200':
          description: An object with the auth configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nextAuthConfigured:
                    type: boolean
                  spotifyConfigured:
                    type: boolean
                  clientId:
                    type: string
                  hasClientSecret:
                    type: boolean
                  redirectUri:
                    type: string
        '500':
          description: Auth check failed.
  /api/debug/ping:
    get:
      summary: Ping the server
      description: A simple endpoint to check if the server is running.
      responses:
        '200':
          description: Server is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  time:
                    type: number
  /api/debug/reset:
    post:
      summary: Reset the server
      description: Deletes the Spotify token file.
      responses:
        '200':
          description: Server reset successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: This feature is only available in development mode.
        '500':
          description: Error resetting server.
  /api/debug/session:
    get:
      summary: Get the session
      description: Returns the server-side NextAuth session.
      responses:
        '200':
          description: An object with the session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  session:
                    type: object
                    nullable: true
        '500':
          description: Error getting the session.
  /api/debug/spotify-token:
    get:
      summary: Get the Spotify token
      description: Returns the Spotify token from the `logs` directory.
      responses:
        '200':
          description: An object with the Spotify token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  token:
                    type: object
                    nullable: true
        '500':
          description: Error getting the Spotify token.
  /api/debug/spotify-token-status:
    get:
      summary: Get the Spotify token status
      description: Returns the status of the Spotify token.
      responses:
        '200':
          description: An object with the Spotify token status.
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Error getting the Spotify token status.
  /api/internal/clear-token:
    post:
      summary: Clear the Spotify token
      description: Deletes the persisted Spotify token file.
      responses:
        '200':
          description: Token file cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '500':
          description: Error clearing the token file.
  /api/internal/token-delivery:
    post:
      summary: Deliver the Spotify token
      description: Persists the latest token payload to the `logs` directory.
      responses:
        '200':
          description: Token delivered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '401':
          description: Unauthorized.
        '500':
          description: Error delivering the token.
  /api/spotify/access-token:
    get:
      summary: Get the Spotify access token
      description: Provides the Spotify access token to the client.
      responses:
        '200':
          description: An object with the access token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '401':
          description: Not authenticated or token is missing.
        '500':
          description: Error getting the access token.
  /api/spotify/control:
    post:
      summary: Control Spotify playback
      description: Controls Spotify playback with a simple command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                  enum: [PLAY, NEXT, PREVIOUS]
      responses:
        '200':
          description: Command executed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Authorization required.
        '500':
          description: Error processing the command.
  /api/spotify/devices:
    get:
      summary: Get Spotify devices
      description: Fetches available Spotify devices for the authenticated user.
      responses:
        '200':
          description: A list of Spotify devices.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      nullable: true
                    is_active:
                      type: boolean
                    is_private_session:
                      type: boolean
                    is_restricted:
                      type: boolean
                    name:
                      type: string
                    type:
                      type: string
                    volume_percent:
                      type: integer
                      nullable: true
        '401':
          description: Not authenticated or token is missing.
        '500':
          description: Error fetching the devices.
  /api/spotify/playlists:
    get:
      summary: Get Spotify playlists
      description: Fetches preset and user Spotify playlists.
      responses:
        '200':
          description: A list of Spotify playlists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  presetPlaylists:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        uri:
                          type: string
                  userPlaylists:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        uri:
                          type: string
                        description:
                          type: string
                          nullable: true
                        imageUrl:
                          type: string
                          nullable: true
                        trackCount:
                          type: integer
                        owner:
                          type: string
                        public:
                          type: boolean
        '401':
          description: Not authenticated or token is missing.
